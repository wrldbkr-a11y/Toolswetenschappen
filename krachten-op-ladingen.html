<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krachten op ladingen — oefentool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F5F1;
    --panel:#FFFFFF;
    --ink:#1D2A22;
    --muted:#5C6B60;
    --line:#DCE3DC;
    --accent:#3F7A5E;
    --accent-dark:#2C5A43;
    --accent-soft:#E6F0E9;
    --pos:#C1443B;
    --pos-soft:#F7E4E1;
    --neg:#2B6CA3;
    --neg-soft:#E2EDF5;
    --good:#2E7D4F;
    --good-soft:#E4F3E9;
    --bad:#B3392C;
    --bad-soft:#FBEAE7;
    --font-head: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 28px 28px;
    background-attachment: fixed;
    color:var(--ink);
    font-family:var(--font-body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  header.top{
    padding: 6px 2px 20px;
  }
  header.top h1{
    font-family:var(--font-head);
    font-weight:600;
    font-size: clamp(24px, 4vw, 32px);
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header.top p{
    margin:0;
    color:var(--muted);
    font-size:15px;
    max-width: 60ch;
  }
  nav.tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin: 18px 0 22px;
  }
  nav.tabs button{
    font-family:var(--font-body);
    font-size:14px;
    font-weight:600;
    color:var(--muted);
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 14px;
    cursor:pointer;
    text-align:left;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
    flex: 1 1 190px;
  }
  nav.tabs button .num{
    display:inline-block;
    width:20px; height:20px;
    line-height:20px;
    text-align:center;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent-dark);
    font-size:12px;
    margin-right:8px;
  }
  nav.tabs button.active{
    color:var(--accent-dark);
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  nav.tabs button.active .num{
    background:var(--accent);
    color:#fff;
  }
  nav.tabs button:hover{ border-color:var(--accent); }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding: 22px 22px 24px;
    box-shadow: 0 1px 0 rgba(29,42,34,0.03);
    margin-bottom:18px;
  }
  .card h2{
    font-family:var(--font-head);
    font-weight:600;
    font-size:20px;
    margin:0 0 10px;
  }
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom: 14px;
  }
  .toolbar .desc{
    color:var(--muted);
    font-size:14px;
    max-width: 56ch;
  }
  button.primary, button.ghost, button.link{
    font-family:var(--font-body);
    cursor:pointer;
    border-radius:9px;
    font-weight:600;
    font-size:14px;
  }
  button.primary{
    background:var(--accent);
    color:#fff;
    border:1px solid var(--accent);
    padding:10px 16px;
  }
  button.primary:hover{ background:var(--accent-dark); border-color:var(--accent-dark); }
  button.primary:disabled{ opacity:.5; cursor:not-allowed; }
  button.ghost{
    background:transparent;
    color:var(--accent-dark);
    border:1px solid var(--line);
    padding:9px 14px;
  }
  button.ghost:hover{ border-color:var(--accent); }
  button.link{
    background:none;
    border:none;
    color:var(--muted);
    text-decoration:underline;
    padding:4px 0;
  }
  button.link:hover{ color:var(--accent-dark); }

  .opgave-tekst{
    font-weight:500;
    font-size:15px;
    line-height:1.55;
    color:var(--ink);
    background:var(--accent-soft);
    border-left:4px solid var(--accent);
    border-radius:6px;
    padding:12px 16px;
    margin-bottom:14px;
    display:none;
  }

  .diagram-box{
    background: var(--accent-soft);
    border:1px solid var(--line);
    border-radius:12px;
    padding: 6px;
    margin-bottom:18px;
  }
  .diagram-box svg{ width:100%; height:auto; display:block; }

  .steps-nav{
    display:flex;
    gap:6px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .steps-nav .dot{
    width:26px; height:26px;
    border-radius:50%;
    border:1px solid var(--line);
    background:#fff;
    color:var(--muted);
    font-size:12px;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }
  .steps-nav .dot.current{ border-color:var(--accent); color:var(--accent-dark); background:var(--accent-soft); }
  .steps-nav .dot.done{ background:var(--good); border-color:var(--good); color:#fff; }
  .steps-nav .dot.wrong{ background:var(--bad-soft); border-color:var(--bad); color:var(--bad); }

  .stap-kop{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom: 4px;
  }
  .stap-kop .stap-label{
    font-size:12px;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--accent-dark);
    background:var(--accent-soft);
    border-radius:6px;
    padding:3px 8px;
  }
  .stap-vraag{
    font-size:16px;
    font-weight:600;
    margin: 10px 0 14px;
  }

  .opties{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:16px;
  }
  label.optie{
    display:flex;
    align-items:center;
    gap:10px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 14px;
    cursor:pointer;
    background:#fff;
    font-size:14.5px;
    transition: border-color .15s ease, background .15s ease;
  }
  label.optie:hover{ border-color:var(--accent); }
  label.optie input{ accent-color: var(--accent); width:16px; height:16px; flex-shrink:0; }
  label.optie.correct{ border-color:var(--good); background:var(--good-soft); }
  label.optie.fout{ border-color:var(--bad); background:var(--bad-soft); }

  .veldgroep{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:16px;
  }
  .veld-rij{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .veld-rij label{ font-size:14.5px; min-width: 210px; }
  .veld-rij input[type=text], .veld-rij input[type=number]{
    font-family:var(--font-body);
    font-size:15px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    width:120px;
    background:#fff;
  }
  .veld-rij input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .veld-rij .eenheid{ color:var(--muted); font-size:14px; }
  .veld-rij.fout input{ border-color:var(--bad); background:var(--bad-soft); }
  .veld-rij.correct input{ border-color:var(--good); background:var(--good-soft); }

  .info-box{
    background:#FAFBF9;
    border:1px dashed var(--line);
    border-radius:10px;
    padding:14px 16px;
    font-size:14.5px;
    margin-bottom:16px;
  }
  .info-box table{ border-collapse:collapse; width:100%; }
  .info-box td{ padding:3px 6px 3px 0; vertical-align:top; }
  .info-box td.k{ color:var(--muted); white-space:nowrap; width:1%; }
  .formule{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:17px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 14px;
    display:inline-block;
    margin:4px 0;
  }
  .uitwerking{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    font-size:14px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .uitwerking .formule{ margin-top:4px; font-size:15px; }

  .sqrt{
    display:inline-flex;
    align-items:flex-start;
    margin:0 1px;
  }
  .sqrt-sign{
    font-size:1.15em;
    line-height:1;
    transform:translateY(1px);
  }
  .sqrt-body{
    border-top:1.4px solid currentColor;
    padding:0 3px 0 1px;
    margin-left:-1px;
  }

  .feedback{
    border-radius:10px;
    padding:12px 14px;
    font-size:14.5px;
    margin-bottom:14px;
    display:none;
  }
  .feedback.goed{ display:block; background:var(--good-soft); color:var(--good); border:1px solid var(--good); }
  .feedback.slecht{ display:block; background:var(--bad-soft); color:var(--bad); border:1px solid var(--bad); }
  .feedback strong{ display:block; margin-bottom:2px; }

  .stap-acties{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
  }

  .afgerond{
    text-align:center;
    padding: 20px 10px 8px;
  }
  .afgerond .vinkje{
    font-size:38px;
    color:var(--good);
    display:block;
    margin-bottom:6px;
  }
  .afgerond h3{
    font-family:var(--font-head);
    margin:0 0 6px;
    font-size:20px;
  }
  .afgerond p{ color:var(--muted); margin:0 0 16px; font-size:14.5px;}

  footer.foot{
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    margin-top: 24px;
  }

  @media (max-width:560px){
    .veld-rij label{ min-width: unset; width:100%; }
    nav.tabs button{ flex-basis: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>Krachten op ladingen</h1>
    <p>Oefen de coulombkracht stap voor stap: analyse eerst, dan de berekening. Kies hieronder een oefening.</p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="card">
    <div class="toolbar">
      <div class="desc" id="oef-desc"></div>
      <div style="display:flex; gap:8px;">
        <button class="ghost" id="btn-oplossing">Toon volledige oplossing</button>
        <button class="primary" id="btn-nieuw">Nieuwe opgave</button>
      </div>
    </div>

    <div class="opgave-tekst" id="opgave-tekst"></div>

    <div class="diagram-box" id="diagram"></div>

    <div class="steps-nav" id="steps-nav"></div>

    <div id="stap-inhoud"></div>
  </div>

  <footer class="foot">Alles gebeurt lokaal in je browser — er wordt niets opgeslagen of verzonden.</footer>
</div>

<script>
const k = 8.99e9; // N·m²/C²

/* ============================= HULPFUNCTIES ============================= */

function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randSign(){ return Math.random() < 0.5 ? 1 : -1; }
function randChoice(arr){ return arr[randInt(0, arr.length-1)]; }

const UNITS = ['\u00b5C','nC'];
const UNIT_EXP = {'\u00b5C':-6, 'nC':-9};
function randUnit(){ return randChoice(UNITS); }

function randCharge(minMag, maxMag, unit, forceSign){
  const mag = randInt(minMag, maxMag);
  const sign = forceSign !== undefined ? forceSign : randSign();
  return { mag, sign, unit };
}
function chargeC(q){ return q.sign * q.mag * Math.pow(10, UNIT_EXP[q.unit]); } // naar Coulomb
function signChar(s){ return s>0 ? '+' : '\u2212'; }
function magStr(mag){ return Number.isInteger(mag) ? String(mag) : fmtNL(mag,1); }
// wetenschappelijke notatie van een lading, bv. \u22125\u00d710\u207b\u2076
function csci(mag, sign, exp){
  return (sign<0?'\u2212':'') + magStr(mag) + '\u00d710'+toSup(exp);
}
// regel met eenheidsomzetting, bv. "q\u2081 = +5 \u00b5C = 5\u00d710\u207b\u2076 C"
function convLine(q, label){
  return label+' = '+signChar(q.sign)+magStr(q.mag)+' '+q.unit+' = '+csci(q.mag,q.sign,UNIT_EXP[q.unit])+' C';
}
// korte weergave van een lading, bv. "+5 \u00b5C"
function chargeShort(q){
  return signChar(q.sign)+magStr(q.mag)+' '+q.unit;
}
// symbolische weergave als eenvoudig veelvoud van Q, bv. "+2Q", "-Q"
function symbolicShort(q){
  return signChar(q.sign)+(q.mag===1?'':q.mag)+'Q';
}

// Nederlandse decimale notatie (komma), met opgeschoonde nullen
function fmtNL(num, decimals){
  if (decimals === undefined) decimals = 2;
  if (!isFinite(num)) return '—';
  let s = num.toFixed(decimals);
  // trim onnodige nullen maar hou er minstens 1 decimaal indien decimals>0 gevraagd? we houden het simpel: toon vast aantal decimalen
  return s.replace('.', ',').replace('-', '\u2212');
}
function fmtSci(num){
  // compacte weergave voor kleine/grote getallen, bv krachten in N
  const abs = Math.abs(num);
  if (abs !== 0 && (abs < 0.001 || abs >= 100000)){
    const exp = num.toExponential(2); // "1.23e-4"
    const [mant, e] = exp.split('e');
    return mant.replace('.', ',').replace('-','\u2212') + ' \u00d7 10' + toSup(parseInt(e,10));
  }
  return fmtNL(num, abs < 1 ? 4 : 2);
}
function toSup(n){
  const map = {'-':'\u207b','0':'\u2070','1':'\u00b9','2':'\u00b2','3':'\u00b3','4':'\u2074','5':'\u2075','6':'\u2076','7':'\u2077','8':'\u2078','9':'\u2079'};
  return String(n).split('').map(c=>map[c]!==undefined?map[c]:c).join('');
}
// echt overkoepelend wortelteken (de content krijgt een lijn erboven, i.p.v. enkel het \u221a-symbool ervoor)
function sqrtHtml(innerHtml){
  return '<span class="sqrt"><span class="sqrt-sign">\u221a</span><span class="sqrt-body">'+innerHtml+'</span></span>';
}

function parseNum(str){
  if (str === null || str === undefined) return NaN;
  const cleaned = String(str).trim().replace(',', '.').replace(/\s+/g,'');
  if (cleaned === '') return NaN;
  return parseFloat(cleaned);
}

function withinTol(userVal, correctVal, relTol, absTol){
  if (relTol === undefined) relTol = 0.05;
  if (absTol === undefined) absTol = Math.max(Math.abs(correctVal)*relTol, 1e-6);
  return Math.abs(userVal - correctVal) <= absTol;
}

// Ondertekende kracht (x-component) die 'ander' uitoefent op 'doel', op een lijn (posities in m, ladingen in C)
// rechts = positief, per de afspraak van deze tool
function signedForceX(qDoelC, qAnderC, xDoelM, xAnderM){
  const dx = xDoelM - xAnderM;
  const r = Math.abs(dx);
  return k * qDoelC * qAnderC * dx / (r*r*r);
}
function forceMag(q1C, q2C, rM){
  return k * Math.abs(q1C*q2C) / (rM*rM);
}

/* ============================= SVG-HELPERS ============================= */

const NS = 'http://www.w3.org/2000/svg';

function svgOpen(w,h){
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="${NS}" font-family="Inter, sans-serif">`;
}
function chargeCircle(cx, cy, q, label, r, magText){
  r = r || 24;
  const fill = q.sign>0 ? 'var(--pos)' : 'var(--neg)';
  const mag = magText !== undefined ? magText : (magStr(q.mag) + ' ' + q.unit);
  return `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${fill}" stroke-width="1.5"/>
    <text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">${q.sign>0?'+':'\u2212'}</text>
    <text x="${cx}" y="${cy-r-10}" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2A22">${label}</text>
    <text x="${cx}" y="${cy+r+18}" text-anchor="middle" font-size="12.5" fill="#5C6B60">${mag}</text>
  `;
}
function neutralCircle(cx, cy, label, r, questionMark){
  r = r || 20;
  return `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#8A9A8E" stroke="#8A9A8E" stroke-width="1.5"/>
    <text x="${cx}" y="${cy+6}" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">${questionMark?'?':'Q'}</text>
    <text x="${cx}" y="${cy-r-10}" text-anchor="middle" font-size="14" font-weight="700" fill="#1D2A22">${label}</text>
  `;
}
// leesbare labeltekst met witte halo, zodat tekst goed afsteekt tegen elke achtergrond/lijn
function labelHalo(x,y,text,color,size,weight){
  return `<text x="${x}" y="${y}" text-anchor="middle" font-size="${size}" font-weight="${weight}" fill="${color}" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">${text}</text>`;
}
function arrow(x1,y1,x2,y2, color, label, labelAbove){
  const id = 'ah'+Math.round(Math.random()*1e6);
  const angle = Math.atan2(y2-y1, x2-x1);
  const dx = Math.cos(angle), dy = Math.sin(angle);
  const midx = (x1+x2)/2, midy = (y1+y2)/2;
  const lx = midx + (labelAbove? -14:14)*Math.sin(angle)*-1;
  const ly = midy - 10;
  return `
    <defs>
      <marker id="${id}" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="${color}"/>
      </marker>
    </defs>
    <line x1="${x1}" y1="${y1}" x2="${x2-dx*8}" y2="${y2-dy*8}" stroke="${color}" stroke-width="3" marker-end="url(#${id})"/>
    ${label!==undefined ? labelHalo(lx, ly, label, color, 15, 800) : ''}
  `;
}
function tickLine(x, y, cm, showLabel){
  return `
    <line x1="${x}" y1="${y-5}" x2="${x}" y2="${y+5}" stroke="#8A9A8E" stroke-width="1.5"/>
    ${showLabel ? labelHalo(x, y+20, cm+' cm', 'var(--accent-dark)', 12.5, 700) : ''}
  `;
}
const FCOLOR = '#7A5AC2'; // kleur voor krachtpijlen

// F_ij = kracht die lading i uitoefent OP lading j (bronvolgorde, i en j zijn 1-based ladingnummers)
function Fsub(i,j){ return 'F'+toSub(i)+toSub(j); }
// F_i = resulterende (netto) kracht op lading i
function Fnet(i){ return 'F'+toSub(i); }
// r_ij = afstand tussen lading i en j, subscript altijd oplopend genummerd
function rSub(i,j){ const a=Math.min(i,j), b=Math.max(i,j); return 'r'+toSub(a)+toSub(b); }

// Pijl die vertrekt vanaf de rand van een lading (op de lading zelf, niet erboven) langs de x-as
function edgeArrowX(cx, cy, r, pointRight, len, color, label){
  const start = cx + (pointRight ? r : -r);
  const end = start + (pointRight ? len : -len);
  return arrow(start, cy, end, cy, color, label);
}
// Pijl die vertrekt vanaf de rand van een lading langs de y-as (omhoog/omlaag)
function edgeArrowY(cx, cy, r, pointDown, len, color, label){
  const start = cy + (pointDown ? r : -r);
  const end = start + (pointDown ? len : -len);
  return arrow(cx, start, cx, end, color, label, true);
}

/* ============================= TYPE 1: TWEE LADINGEN ============================= */

const TYPE_TWEE = {
  key: 'twee',
  tabLabel: 'Twee ladingen',
  title: 'Kracht tussen twee ladingen',
  beschrijving: 'Teken de kracht op de juiste lading en bereken de grootte ervan met de wet van Coulomb.',

  generate(){
    const unit = randUnit();
    const q1 = randCharge(1,9,unit);
    const q2 = randCharge(1,9,unit);
    const rCm = randInt(15,55);
    const rM = rCm/100;
    const doel = randChoice([1,2]); // welke lading vragen we de kracht op?
    const ander = doel === 1 ? 2 : 1;
    const qDoel = doel === 1 ? q1 : q2;
    const qAnder = doel === 1 ? q2 : q1;
    const xDoel = doel === 1 ? 0 : rM;
    const xAnder = doel === 1 ? rM : 0;
    // Fsigned = kracht die qAnder uitoefent op qDoel (F_{ander,doel})
    const Fsigned = signedForceX(chargeC(qDoel), chargeC(qAnder), xDoel, xAnder);
    const zinDoel = Fsigned > 0 ? 'rechts' : 'links';
    const tekenDoel = Fsigned > 0 ? '+' : '\u2212';
    const Fmag = forceMag(chargeC(q1), chargeC(q2), rM);
    return { q1, q2, rCm, rM, doel, ander, Fsigned, zinDoel, tekenDoel, Fmag };
  },

  diagram(p, reveal){
    const x1 = 150, x2 = 490, y = 100, r = 24;
    let s = svgOpen(640,190);
    s += `<line x1="70" y1="${y}" x2="570" y2="${y}" stroke="#C7D3C9" stroke-width="1.5"/>`;
    s += tickLine(x1,y,0,false);
    s += tickLine(x2,y,p.rCm,false);
    s += labelHalo((x1+x2)/2, y+20, rSub(1,2)+' = '+p.rCm+' cm', 'var(--accent-dark)', 12.5, 700);
    if (reveal.pijlen){
      const rechtsOpDoel = p.zinDoel === 'rechts';
      const xDoelPx = p.doel === 1 ? x1 : x2;
      s += edgeArrowX(xDoelPx, y, r, rechtsOpDoel, 55, FCOLOR, Fsub(p.ander,p.doel));
    }
    s += chargeCircle(x1, y, p.q1, 'q\u2081', r);
    s += chargeCircle(x2, y, p.q2, 'q\u2082', r);
    s += '</svg>';
    return s;
  },

  opgave(p){
    return 'Twee puntladingen q\u2081 = '+chargeShort(p.q1)+' en q\u2082 = '+chargeShort(p.q2)+' bevinden zich op '+p.rCm+' cm van elkaar. Bereken de kracht die q'+p.ander+' uitoefent op q'+p.doel+' (grootte en teken).';
  },

  uitwerking(p){
    return '<div class="uitwerking">'
      + '<div>'+convLine(p.q1,'q\u2081')+'</div>'
      + '<div>'+convLine(p.q2,'q\u2082')+'</div>'
      + '<div>'+rSub(1,2)+' = '+p.rCm+' cm = '+fmtNL(p.rM,2)+' m</div>'
      + '<div class="formule">'+Fsub(p.ander,p.doel)+' = 8,99\u00d710\u2079 \u00b7 |'+csci(p.q1.mag,p.q1.sign,UNIT_EXP[p.q1.unit])+' C \u00b7 '+csci(p.q2.mag,p.q2.sign,UNIT_EXP[p.q2.unit])+' C| / ('+fmtNL(p.rM,2)+' m)\u00b2 = '+fmtSci(p.Fmag)+' N</div>'
      + '</div>';

  steps(p){
    const doelSym = 'q'+p.doel, anderSym = 'q'+p.ander;
    return [
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'a',
        vraag:'Op welke lading teken je een kracht?',
        kind:'keuze',
        groups:[
          {key:'ab', multiple:true, options:[
            {value:'q1', label:'q\u2081'},
            {value:'q2', label:'q\u2082'},
          ], correct:['q'+p.doel]},
          {key:'krachten', multiple:true, label:'Welke kracht moet je dus tekenen?', options:[
            {value:'F'+p.ander+p.doel, label:Fsub(p.ander,p.doel)},
            {value:'F'+p.doel+p.ander, label:Fsub(p.doel,p.ander)},
            {value:'F11', label:Fsub(1,1)},
            {value:'F22', label:Fsub(2,2)},
          ], correct:['F'+p.ander+p.doel]},
        ]
      },
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'b',
        vraag:'Wat is de zin van '+Fsub(p.ander,p.doel)+' (de kracht die '+anderSym+' uitoefent op '+doelSym+')?',
        kind:'keuze',
        groups:[{key:'zin', multiple:false, options:[
          {value:'links', label:'naar links'},
          {value:'rechts', label:'naar rechts'},
        ], correct:p.zinDoel}],
        onCorrect:{reveal:'pijlen'}
      },
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'c',
        vraag:'Welk teken krijgt '+Fsub(p.ander,p.doel)+'? (afspraak: rechts = +)',
        kind:'keuze',
        groups:[{key:'teken', multiple:false, options:[
          {value:'+', label:'+'},
          {value:'\u2212', label:'\u2212'},
        ], correct:p.tekenDoel}]
      },
      {
        stapNr:2, stapNaam:'Berekening', onderdeel:'gegeven & gevraagd',
        kind:'info',
        vraag:'Gegeven en gevraagd',
        infoHtml: gegevenTabel([
          ['q\u2081', signChar(p.q1.sign)+magStr(p.q1.mag)+' '+p.q1.unit],
          ['q\u2082', signChar(p.q2.sign)+magStr(p.q2.mag)+' '+p.q2.unit],
          [rSub(1,2), p.rCm + ' cm = ' + fmtNL(p.rM,2) + ' m'],

        ])
      },
      {
        stapNr:2, stapNaam:'Berekening', onderdeel:'oplossing',
        vraag:'Bereken de grootte van de kracht.',
        kind:'numbers',
        infoHtml: '<div class="formule">'+Fsub(p.ander,p.doel)+' = k \u00b7 |q\u2081 \u00b7 q\u2082| / '+rSub(1,2)+'\u00b2</div>',
        fields:[
          {key:'F', label:Fsub(p.ander,p.doel)+' =', unit:'N', correct:p.Fmag, relTol:0.05}
        ],

      },
    ];

};

/* ============================= TYPE 2: DRIE LADINGEN OP EEN LIJN ============================= */

function toSub(n){
  const map = {'0':'\u2080','1':'\u2081','2':'\u2082','3':'\u2083','4':'\u2084','5':'\u2085','6':'\u2086','7':'\u2087','8':'\u2088','9':'\u2089'};
  return String(n).split('').map(c=>map[c]!==undefined?map[c]:c).join('');
}

const TYPE_LIJN = {
  key: 'lijn',
  tabLabel: 'Resultante op een lijn',
  title: 'Resulterende kracht op één van drie ladingen',
  beschrijving: 'Drie ladingen liggen op een rechte lijn. Bereken de resulterende kracht op één ervan, met een + of \u2212 teken voor de zin.',

  generate(){
    const unit = randUnit();
    const gap1 = randInt(15,32);
    const gap2 = randInt(15,32);
    const xCm = [0, gap1, gap1+gap2];
    const xM = xCm.map(v=>v/100);
    const q = [randCharge(1,9,unit), randCharge(1,9,unit), randCharge(1,9,unit)];
    const t = randInt(0,2);
    const others = [0,1,2].filter(i=>i!==t).sort((a,b)=>xM[a]-xM[b]);
    const F = {};
    others.forEach(o=>{ F[o] = signedForceX(chargeC(q[t]), chargeC(q[o]), xM[t], xM[o]); });
    const Fres = others.reduce((s,o)=>s+F[o],0);
    return { xCm, xM, q, t, others, F, Fres };
  },

  diagram(p, reveal){
    const maxCm = p.xCm[2];
    const mapX = cm => 90 + (cm/maxCm)*440;
    const y = 100, r = 24;
    let s = svgOpen(640,200);
    s += `<line x1="70" y1="${y}" x2="570" y2="${y}" stroke="#C7D3C9" stroke-width="1.5"/>`;
    p.xCm.forEach((cm,i)=>{ s += tickLine(mapX(cm), y, cm, false); });
    // afstand-labels tussen opeenvolgende ladingen (r12 en r23)
    for (let i=0;i<2;i++){
      const mid = (mapX(p.xCm[i])+mapX(p.xCm[i+1]))/2;
      s += labelHalo(mid, y+20, rSub(i+1,i+2)+' = '+(p.xCm[i+1]-p.xCm[i])+' cm', 'var(--accent-dark)', 12.5, 700);
    }
    if (reveal.pijlen){
      const tx = mapX(p.xCm[p.t]);
      p.others.forEach((o,idx)=>{
        const pointRight = p.F[o] > 0;
        const yOff = y - 7 + idx*14;
        s += edgeArrowX(tx, yOff, r, pointRight, 55, FCOLOR, Fsub(o+1, p.t+1));
      });
    }
    p.q.forEach((qi,i)=>{ s += chargeCircle(mapX(p.xCm[i]), y, qi, 'q'+toSub(i+1), r); });
    s += '</svg>';
    return s;
  },

  opgave(p){
    const r12 = p.xCm[1]-p.xCm[0], r23 = p.xCm[2]-p.xCm[1];
    return 'Drie ladingen liggen op een rechte lijn: q\u2081 = '+chargeShort(p.q[0])+', q\u2082 = '+chargeShort(p.q[1])+' en q\u2083 = '+chargeShort(p.q[2])+'. De afstand tussen q\u2081 en q\u2082 is '+r12+' cm, en tussen q\u2082 en q\u2083 is '+r23+' cm. Bereken de resulterende kracht op q'+toSub(p.t+1)+'.';
  },

  uitwerking(p){
    const symOf = i => 'q'+toSub(i+1);
    let html = '<div class="uitwerking">';
    html += '<div>'+convLine(p.q[p.t], symOf(p.t))+'</div>';
    p.others.forEach(o=>{ html += '<div>'+convLine(p.q[o], symOf(o))+'</div>'; });
    p.others.forEach(o=>{
      const rCm = Math.abs(p.xCm[o]-p.xCm[p.t]);
      const rM = rCm/100;
      const mag = Math.abs(p.F[o]);
      html += '<div class="formule">|'+Fsub(o+1,p.t+1)+'| = 8,99\u00d710\u2079 \u00b7 |'+csci(p.q[p.t].mag,p.q[p.t].sign,UNIT_EXP[p.q[p.t].unit])+' C \u00b7 '+csci(p.q[o].mag,p.q[o].sign,UNIT_EXP[p.q[o].unit])+' C| / ('+fmtNL(rM,2)+' m)\u00b2 = '+fmtSci(mag)+' N &nbsp;(teken: '+(p.F[o]>0?'+':'\u2212')+') &nbsp;\u2192&nbsp; '+Fsub(o+1,p.t+1)+' = '+fmtSci(p.F[o])+' N</div>';
    });
    html += '<div class="formule">'+Fnet(p.t+1)+' = '+p.others.map(o=>fmtSci(p.F[o])+' N').join(' + ')+' = '+fmtSci(p.Fres)+' N</div>';
    html += '</div>';
    return html;
  },

  steps(p){
    const tSym = 'q'+toSub(p.t+1);
    const symOf = i => 'q'+toSub(i+1);
    const groepB = p.others.map(o => ({
      key:'zin'+o, multiple:false,
      label: `Zin van ${Fsub(o+1,p.t+1)} (kracht van ${symOf(o)} op ${tSym})`,
      options:[{value:'links',label:'naar links'},{value:'rechts',label:'naar rechts'}],
      correct: p.F[o] > 0 ? 'rechts' : 'links'
    }));
    const groepC = p.others.map(o => ({
      key:'teken'+o, multiple:false,
      label: `Teken van ${Fsub(o+1,p.t+1)}`,
      options:[{value:'+',label:'+'},{value:'\u2212',label:'\u2212'}],
      correct: p.F[o] > 0 ? '+' : '\u2212'
    }));
    const gegevenRows = p.q.map((qi,i)=>[symOf(i), signChar(qi.sign)+magStr(qi.mag)+' '+qi.unit]);
    p.others.forEach(o=>{ gegevenRows.push([rSub(o+1,p.t+1), Math.abs(p.xCm[o]-p.xCm[p.t])+' cm']); });
    gegevenRows.push(['doellading', tSym]);
    gegevenRows.push(['gevraagd', Fnet(p.t+1)+' (resulterende kracht op '+tSym+', grootte + teken)']);
    const numberFields = p.others.map(o => ({key:'F'+o, label:Fsub(o+1,p.t+1)+' =', unit:'N', correct:p.F[o], relTol:0.06}));
    numberFields.push({key:'Fres', label:Fnet(p.t+1)+' =', unit:'N', correct:p.Fres, relTol:0.06});
    const krachtCorrect = p.others.map(o => 'F'+(o+1)+(p.t+1));
    const krachtOpties = [];
    p.others.forEach(o=>{
      krachtOpties.push({value:'F'+(o+1)+(p.t+1), label:Fsub(o+1,p.t+1)});
      krachtOpties.push({value:'F'+(p.t+1)+(o+1), label:Fsub(p.t+1,o+1)});
    });
    return [
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'a',
        vraag:'Op welke lading teken je de resulterende kracht?',
        kind:'keuze',
        groups:[
          {key:'ab', multiple:true, options:[0,1,2].map(i=>({value:symOf(i), label:symOf(i)})), correct:[tSym]},
          {key:'krachten', multiple:true, label:'Welke krachten moet je dus tekenen?', options:krachtOpties, correct:krachtCorrect},
        ]
      },
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'b',
        vraag:'Wat is de zin van elke deelkracht op '+tSym+'?',
        kind:'keuze',
        groups: groepB,
        onCorrect:{reveal:'pijlen'}
      },
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'c',
        vraag:'Welk teken krijgt elke deelkracht? (afspraak: rechts = +)',
        kind:'keuze',
        groups: groepC
      },
      {
        stapNr:2, stapNaam:'Berekening', onderdeel:'gegeven & gevraagd',
        kind:'info', vraag:'Gegeven en gevraagd',
        infoHtml: gegevenTabel(gegevenRows)
      },
      {
        stapNr:2, stapNaam:'Berekening', onderdeel:'oplossing',
        vraag:'Bereken elke deelkracht en tel ze op (met teken).',
        kind:'numbers',
        infoHtml: '<div class="formule">F<sub>ij</sub> = k \u00b7 |q<sub>i</sub> \u00b7 q<sub>j</sub>| / r<sub>ij</sub>\u00b2 &nbsp; \u2192 &nbsp; '+Fnet(p.t+1)+' = \u03a3 F<sub>ij</sub></div>',
        fields: numberFields,
        uitwerking: TYPE_LIJN.uitwerking(p)
      },
    ];
  }
};

/* ============================= TYPE 3: EVENWICHT (AFSTAND OF GROOTTE) ============================= */

const TYPE_EVENWICHT = {
  key: 'evenwicht',
  tabLabel: 'Evenwicht',
  title: 'Evenwicht: afstand of grootte berekenen',
  beschrijving: 'Zoek de afstand of de grootte van een lading waarvoor de resulterende kracht op q\u2083 nul is.',

  generate(){
    const subtype = randChoice(['afstand','grootte']);
    const unit = randUnit();
    const q3 = randCharge(1,9,unit); // grootte van q3 valt weg uit de evenwichtsvergelijking
    if (subtype === 'afstand'){
      // kwadraatgetallen (1,4,9) zodat \u221aq1 en \u221aq2 steeds nette gehele getallen zijn (1, 2 of 3)
      const kwadraten = [1,4,9];
      const sign1 = randSign();
      const magA = randChoice(kwadraten);
      let magB = randChoice(kwadraten);
      while (magB === magA) magB = randChoice(kwadraten); // twee verschillende waarden, anders triviaal
      const q1 = { mag: magA, sign: sign1, unit };
      const q2 = { mag: magB, sign: sign1, unit };
      const sqrt1 = Math.sqrt(q1.mag), sqrt2 = Math.sqrt(q2.mag);
      // q1 en q2 liggen op een gekende onderlinge afstand r12; q3 ligt daartussen.
      // r12 wordt verdeeld in de verhouding \u221aq1 : \u221aq2 (dus \u221aq1+\u221aq2 "delen" in totaal)
      const r12Cm = (sqrt1 + sqrt2) * randInt(6, 14);
      const r13Cm = r12Cm * sqrt1 / (sqrt1 + sqrt2); // gevraagd: afstand q1\u2013q3
      const r23Cm = r12Cm - r13Cm;
      const zin13 = (q3.sign === q1.sign) ? 'rechts' : 'links';
      const zin23 = (q3.sign === q2.sign) ? 'links' : 'rechts';
      return { subtype, q1, q2, q3, r12Cm, r13Cm, r23Cm, zin13, zin23 };
    } else {
      const q1 = randCharge(1,9,unit);
      const r13Cm = randInt(15,40);
      const r23Cm = randInt(15,40);
      const q2mag = q1.mag * Math.pow(r23Cm/r13Cm, 2);
      const q2 = { mag: q2mag, sign: q1.sign, unit };
      const zin13 = (q3.sign === q1.sign) ? 'rechts' : 'links';
      const zin23 = (q3.sign === q2.sign) ? 'links' : 'rechts';
      return { subtype, q1, q2, q3, r13Cm, r23Cm, zin13, zin23 };
    }
  },

  diagram(p, reveal){
    let s = svgOpen(640,190);
    const y = 100, r = 22;
    s += `<line x1="70" y1="${y}" x2="570" y2="${y}" stroke="#C7D3C9" stroke-width="1.5"/>`;
    if (p.subtype === 'afstand'){
      // q1 op 0 en q2 op r12Cm (beide gegeven); q3 ligt daartussen op r13Cm (onbekend tot antwoord getoond wordt)
      const mapX = cm => 100 + (cm/p.r12Cm)*440;
      s += tickLine(mapX(0), y, 0, false);
      s += tickLine(mapX(p.r12Cm), y, p.r12Cm, false);
      s += labelHalo((mapX(0)+mapX(p.r12Cm))/2, y+20, rSub(1,2)+' = '+p.r12Cm+' cm', 'var(--accent-dark)', 12.5, 700);
      const qx = reveal.antwoord ? mapX(p.r13Cm) : mapX(p.r12Cm*0.45);
      if (reveal.antwoord){
        s += tickLine(qx, y, Math.round(p.r13Cm), false);
        s += labelHalo(qx, y+38, rSub(1,3)+' = '+fmtNL(p.r13Cm,1)+' cm', 'var(--good)', 12.5, 700);
      }
      if (reveal.pijlen){
        s += edgeArrowX(qx, y, r, p.zin13==='rechts', 50, FCOLOR, Fsub(1,3));
        s += edgeArrowX(qx, y, r, p.zin23==='rechts', 50, FCOLOR, Fsub(2,3));
      }
      s += chargeCircle(mapX(0), y, p.q1, 'q\u2081', r);
      s += chargeCircle(mapX(p.r12Cm), y, p.q2, 'q\u2082', r);
      s += chargeCircle(qx, y, p.q3, 'q\u2083', r);
    } else {
      const totalCm = p.r13Cm + p.r23Cm;
      const mapX = cm => 100 + (cm/totalCm)*440;
      s += tickLine(mapX(0), y, 0, false);
      s += tickLine(mapX(p.r13Cm), y, p.r13Cm, false);
      s += tickLine(mapX(totalCm), y, totalCm, false);
      s += labelHalo((mapX(0)+mapX(p.r13Cm))/2, y+20, rSub(1,3)+' = '+p.r13Cm+' cm', 'var(--accent-dark)', 12.5, 700);
      s += labelHalo((mapX(p.r13Cm)+mapX(totalCm))/2, y+20, rSub(2,3)+' = '+p.r23Cm+' cm', 'var(--accent-dark)', 12.5, 700);
      if (reveal.pijlen){
        s += edgeArrowX(mapX(p.r13Cm), y, r, p.zin13==='rechts', 50, FCOLOR, Fsub(1,3));
        s += edgeArrowX(mapX(p.r13Cm), y, r, p.zin23==='rechts', 50, FCOLOR, Fsub(2,3));
      }
      s += chargeCircle(mapX(0), y, p.q1, 'q\u2081', r);
      s += chargeCircle(mapX(p.r13Cm), y, p.q3, 'q\u2083', r);
      const magText = reveal.antwoord ? (fmtNL(p.q2.mag,1)+' '+p.q2.unit) : '?';
      s += chargeCircle(mapX(totalCm), y, p.q2, 'q\u2082', r, magText);
    }
    s += '</svg>';
    return s;
  },

  opgave(p){
    if (p.subtype === 'afstand'){
      return 'Twee ladingen q\u2081 = '+chargeShort(p.q1)+' en q\u2082 = '+chargeShort(p.q2)+' bevinden zich op '+p.r12Cm+' cm van elkaar. Een derde lading q\u2083 = '+chargeShort(p.q3)+' wordt tussen q\u2081 en q\u2082 geplaatst, op de plek waar de resulterende kracht op q\u2083 nul is. Op welke afstand van q\u2081 bevindt q\u2083 zich?';
    }
    return 'Een lading q\u2081 = '+chargeShort(p.q1)+' bevindt zich op '+p.r13Cm+' cm van een lading q\u2083 = '+chargeShort(p.q3)+'. Op '+p.r23Cm+' cm voorbij q\u2083 bevindt zich een lading q\u2082 met onbekende grootte (in '+p.q2.unit+'). Hoe groot moet q\u2082 zijn zodat de resulterende kracht op q\u2083 nul is?';
  },

  uitwerking(p){
    const isAfstand = p.subtype === 'afstand';
    let html = '<div class="uitwerking">';
    html += '<div>'+convLine(p.q1,'q\u2081')+'</div>';
    html += '<div>'+convLine(p.q2,'q\u2082')+'</div>';
    html += '<div>'+convLine(p.q3,'q\u2083')+' &nbsp;(valt weg bij het herleiden)</div>';
    if (isAfstand){
      // \u221aq\u2081 en \u221aq\u2082 zijn door de kwadraatgetallen altijd nette gehele getallen (1, 2 of 3)
      const sqrt1 = Math.sqrt(p.q1.mag), sqrt2 = Math.sqrt(p.q2.mag);
      html += '<div>q\u2081 en q\u2082 staan in dezelfde eenheid, dus die eenheid valt weg \u2014 enkel de (kwadraat)getallen tellen mee.</div>';
      html += '<div class="formule">'+sqrtHtml('q\u2081')+' = '+sqrtHtml(magStr(p.q1.mag))+' = '+sqrt1+' &nbsp;&nbsp;&nbsp; '+sqrtHtml('q\u2082')+' = '+sqrtHtml(magStr(p.q2.mag))+' = '+sqrt2+'</div>';
      html += '<div>Verdeel '+rSub(1,2)+' in de verhouding '+sqrtHtml('q\u2081')+' : '+sqrtHtml('q\u2082')+' = '+sqrt1+' : '+sqrt2+' (dus '+(sqrt1+sqrt2)+' gelijke delen in totaal, '+sqrt1+' ervan voor '+rSub(1,3)+').</div>';
      html += '<div class="formule">'+rSub(1,3)+' = '+rSub(1,2)+'\u00b7'+sqrt1+'/('+sqrt1+'+'+sqrt2+') = '+p.r12Cm+' cm \u00b7 '+sqrt1+'/'+(sqrt1+sqrt2)+' = '+fmtNL(p.r13Cm,1)+' cm</div>';
    } else {
      html += '<div class="formule">q\u2082 = q\u2081\u00b7('+rSub(2,3)+'/'+rSub(1,3)+')\u00b2 = '+magStr(p.q1.mag)+' '+p.q1.unit+'\u00b7('+p.r23Cm+' cm / '+p.r13Cm+' cm)\u00b2 = '+fmtNL(p.q2.mag,1)+' '+p.q2.unit+'</div>';
    }
    html += '</div>';
    return html;
  },

  steps(p){
    const isAfstand = p.subtype === 'afstand';
    const gegevenRows = isAfstand ? [
      ['q\u2081', signChar(p.q1.sign)+magStr(p.q1.mag)+' '+p.q1.unit],
      ['q\u2082', signChar(p.q2.sign)+magStr(p.q2.mag)+' '+p.q2.unit],
      ['q\u2083', signChar(p.q3.sign)+magStr(p.q3.mag)+' '+p.q3.unit],
      [rSub(1,2), p.r12Cm+' cm'],
      ['gevraagd', rSub(1,3)+' (afstand tussen q\u2081 en q\u2083, waarvoor '+Fnet(3)+' = 0)'],
    ] : [
      ['q\u2081', signChar(p.q1.sign)+magStr(p.q1.mag)+' '+p.q1.unit],
      ['q\u2083', signChar(p.q3.sign)+magStr(p.q3.mag)+' '+p.q3.unit],
      [rSub(1,3), p.r13Cm+' cm'],
      [rSub(2,3), p.r23Cm+' cm'],

/* ============================= TYPE 4: RECHTHOEKIGE DRIEHOEK ============================= */

const TYPE_DRIEHOEK = {
  key: 'driehoek',
  tabLabel: 'Rechthoekige driehoek',
  title: 'Resulterende kracht in een rechthoekige driehoek',
  beschrijving: 'Drie ladingen vormen een rechthoekige driehoek. Bereken de resulterende kracht op de lading in de rechte hoek.',

  generate(){
    const unit = randUnit();
    const r12Cm = randInt(20,55); // q1 - q2 (horizontale rechthoekszijde)
    const r13Cm = randInt(20,55); // q1 - q3 (verticale rechthoekszijde)
    const q1 = randCharge(1,9,unit);
    const q2 = randCharge(1,9,unit);
    const q3 = randCharge(1,9,unit);
    const r12M = r12Cm/100, r13M = r13Cm/100;
    const F21 = forceMag(chargeC(q1), chargeC(q2), r12M); // kracht van q2 op q1
    const F31 = forceMag(chargeC(q1), chargeC(q3), r13M); // kracht van q3 op q1
    const richtingH = (q1.sign !== q2.sign) ? 'naar' : 'weg';
    const richtingV = (q1.sign !== q3.sign) ? 'naar' : 'weg';
    const F1 = Math.sqrt(F21*F21 + F31*F31);
    const hoek = Math.atan2(F31, F21) * 180/Math.PI;
    return { r12Cm, r13Cm, r12M, r13M, q1, q2, q3, F21, F31, richtingH, richtingV, F1, hoek };
  },

  diagram(p, reveal){
    let s = svgOpen(640,370);
    const scale = Math.min(300/p.r12Cm, 150/p.r13Cm);
    const pxA = p.r12Cm*scale, pxB = p.r13Cm*scale;
    const Qx = 140, Qy = 230, rr = 24;
    const Hx = Qx+pxA, Hy = Qy;
    const Vx = Qx, Vy = Qy-pxB;
    s += `<line x1="${Hx}" y1="${Hy}" x2="${Vx}" y2="${Vy}" stroke="#C7D3C9" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    s += `<line x1="${Qx}" y1="${Qy}" x2="${Hx}" y2="${Hy}" stroke="#C7D3C9" stroke-width="1.5"/>`;
    s += `<line x1="${Qx}" y1="${Qy}" x2="${Vx}" y2="${Vy}" stroke="#C7D3C9" stroke-width="1.5"/>`;
    s += `<rect x="${Qx}" y="${Qy-14}" width="14" height="14" fill="none" stroke="#8A9A8E" stroke-width="1.5"/>`;
    s += labelHalo((Qx+Hx)/2, Qy+20, rSub(1,2)+' = '+p.r12Cm+' cm', 'var(--accent-dark)', 12.5, 700);
    s += labelHalo(Qx-26, (Qy+Vy)/2, rSub(1,3)+' = '+p.r13Cm+' cm', 'var(--accent-dark)', 12.5, 700);
    if (reveal.pijlen){
      const dirH = p.richtingH === 'naar' ? 1 : -1;
      const dirV = p.richtingV === 'naar' ? -1 : 1;
      s += edgeArrowX(Qx, Qy, rr, dirH>0, 60, FCOLOR, Fsub(2,1));
      s += edgeArrowY(Qx, Qy, rr, dirV>0, 60, FCOLOR, Fsub(3,1));
      if (reveal.resultant){
        const norm = Math.sqrt(p.F21*p.F21+p.F31*p.F31) || 1;
        const rx = (dirH*p.F21/norm)*85, ry = (dirV*p.F31/norm)*85;
        s += arrow(Qx, Qy, Qx+rx, Qy+ry, '#B3392C', Fnet(1), true);
      }
    }
    s += chargeCircle(Qx, Qy, p.q1, 'q\u2081', rr);
    s += chargeCircle(Hx, Hy, p.q2, 'q\u2082', rr);
    s += chargeCircle(Vx, Vy, p.q3, 'q\u2083', rr);
    s += '</svg>';
    return s;
  },

  opgave(p){
    return 'Drie ladingen vormen een rechthoekige driehoek: q\u2081 (in de rechte hoek) = '+chargeShort(p.q1)+', q\u2082 = '+chargeShort(p.q2)+' op '+p.r12Cm+' cm van q\u2081, en q\u2083 = '+chargeShort(p.q3)+' op '+p.r13Cm+' cm van q\u2081. Bereken de resulterende kracht op q\u2081.';
  },

  uitwerking(p){
    return '<div class="uitwerking">'
      + '<div>'+convLine(p.q1,'q\u2081')+'</div>'
      + '<div>'+convLine(p.q2,'q\u2082')+'</div>'
      + '<div>'+convLine(p.q3,'q\u2083')+'</div>'
      + '<div class="formule">'+Fsub(2,1)+' = 8,99\u00d710\u2079 \u00b7 |'+csci(p.q1.mag,p.q1.sign,UNIT_EXP[p.q1.unit])+' C \u00b7 '+csci(p.q2.mag,p.q2.sign,UNIT_EXP[p.q2.unit])+' C| / ('+fmtNL(p.r12M,2)+' m)\u00b2 = '+fmtSci(p.F21)+' N</div>'
      + '<div class="formule">'+Fsub(3,1)+' = 8,99\u00d710\u2079 \u00b7 |'+csci(p.q1.mag,p.q1.sign,UNIT_EXP[p.q1.unit])+' C \u00b7 '+csci(p.q3.mag,p.q3.sign,UNIT_EXP[p.q3.unit])+' C| / ('+fmtNL(p.r13M,2)+' m)\u00b2 = '+fmtSci(p.F31)+' N</div>'
      + '<div class="formule">'+Fnet(1)+' = '+sqrtHtml('('+fmtSci(p.F21)+' N)\u00b2 + ('+fmtSci(p.F31)+' N)\u00b2')+' = '+fmtSci(p.F1)+' N</div>'
      + '</div>';
  },

  steps(p){
    return [
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'a',
        vraag:'Op welke lading teken je de resulterende kracht?',
        kind:'keuze',
        groups:[
          {key:'ab', multiple:true, options:[{value:'q1',label:'q\u2081'},{value:'q2',label:'q\u2082'},{value:'q3',label:'q\u2083'}], correct:['q1']},
          {key:'krachten', multiple:true, label:'Welke krachten moet je dus tekenen?', options:[
            {value:'F21', label:Fsub(2,1)},
            {value:'F31', label:Fsub(3,1)},
            {value:'F12', label:Fsub(1,2)},
            {value:'F13', label:Fsub(1,3)},
          ], correct:['F21','F31']},
        ]
      },
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'b',
        vraag:'Wat is de zin van elke deelkracht op q\u2081?',
        kind:'keuze',
        groups:[
          {key:'richtH', multiple:false, label:'Zin van '+Fsub(2,1)+' (langs de zijde naar q\u2082)', options:[{value:'naar',label:'naar q\u2082 toe'},{value:'weg',label:'weg van q\u2082'}], correct:p.richtingH},
          {key:'richtV', multiple:false, label:'Zin van '+Fsub(3,1)+' (langs de zijde naar q\u2083)', options:[{value:'naar',label:'naar q\u2083 toe'},{value:'weg',label:'weg van q\u2083'}], correct:p.richtingV},
        ],
        onCorrect:{reveal:'pijlen'}
      },
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'c',
        vraag:'Hoe geef je de richting van de resulterende kracht weer?',
        kind:'keuze',
        groups:[{key:'weergave', multiple:false, options:[
          {value:'teken', label:'Met een + of \u2212 teken'},
          {value:'hoek', label:'Met een grootte en een hoek t.o.v. een zijde'},
        ], correct:'hoek'}]
      },
      {
        stapNr:2, stapNaam:'Berekening', onderdeel:'gegeven & gevraagd',
        kind:'info', vraag:'Gegeven en gevraagd',
        infoHtml: gegevenTabel([
          ['q\u2081', signChar(p.q1.sign)+magStr(p.q1.mag)+' '+p.q1.unit],
          ['q\u2082', signChar(p.q2.sign)+magStr(p.q2.mag)+' '+p.q2.unit],
          ['q\u2083', signChar(p.q3.sign)+magStr(p.q3.mag)+' '+p.q3.unit],
          [rSub(1,2), p.r12Cm+' cm'],
          [rSub(1,3), p.r13Cm+' cm'],
          ['gevraagd', Fnet(1)+' op q\u2081 (grootte)'],
        ])
      },
      {
        stapNr:2, stapNaam:'Berekening', onderdeel:'oplossing',
        vraag:'Bereken de twee deelkrachten en combineer ze.',
        kind:'numbers',
        infoHtml: '<div class="formule">'+Fsub(2,1)+' = k|q\u2081\u00b7q\u2082|/'+rSub(1,2)+'\u00b2 &nbsp; '+Fsub(3,1)+' = k|q\u2081\u00b7q\u2083|/'+rSub(1,3)+'\u00b2<br>'+Fnet(1)+' = '+sqrtHtml(Fsub(2,1)+'\u00b2+'+Fsub(3,1)+'\u00b2')+'</div>',
        fields:[
          {key:'F21', label:Fsub(2,1)+' =', unit:'N', correct:p.F21, relTol:0.05},
          {key:'F31', label:Fsub(3,1)+' =', unit:'N', correct:p.F31, relTol:0.05},
          {key:'F1', label:Fnet(1)+' =', unit:'N', correct:p.F1, relTol:0.05},
        ],
        onCorrect:{reveal:'resultant'},
        uitwerking: TYPE_DRIEHOEK.uitwerking(p)
      },
    ];
  }
};

function gegevenTabel(rows){
  let html = '<table><tbody>';
  rows.forEach(r=>{ html += `<tr><td class="k">${r[0]}</td><td>${r[1]}</td></tr>`; });
  html += '</tbody></table>';
  return html;
}

/* ============================= TYPE 5: VOOR EN NA VERGELIJKEN ============================= */

function factorActie(f){
  if (f===2) return 'verdubbeld';
  if (f===3) return 'verdrievoudigd';
  if (f===0.5) return 'gehalveerd';
  return 'door 3 gedeeld';
}
// symbolisch label voor een afstand t.o.v. de basisafstand r, bv. factor 2 -> "2r", 0.5 -> "r/2"
function rFactorLabel(f){
  if (f===1) return 'r';
  if (f===2) return '2r';
  if (f===3) return '3r';
  if (f===0.5) return 'r/2';
  if (Math.abs(f-1/3)<1e-9) return 'r/3';
  return fmtNL(f,2)+'r';
}
// vaste set van 4 "factor"-opties voor de analysevraag (hoe verandert r of de lading zelf)
const FACTOR_KEUZES = [
  {val:2, label:'wordt 2 keer groter'},
  {val:3, label:'wordt 3 keer groter'},
  {val:0.5, label:'wordt 2 keer kleiner'},
  {val:(1/3), label:'wordt 3 keer kleiner'},
];

const TYPE_VERGELIJK = {
  key: 'vergelijk',
  tabLabel: 'Voor en na vergelijken',
  title: 'Vergelijk de kracht: situatie 1 versus situatie 2',
  beschrijving: 'Eenvoudige ladingen, veelvouden van Q. Vergelijk hoe de grootte van de kracht verandert als de afstand of een lading verandert.',

  generate(){
    const wijzigingType = randChoice(['afstand','lading']);
    const factor = randChoice([2,3,0.5,1/3]);
    const q1 = {mag:randInt(1,3), sign:randSign(), unit:'Q'};
    const q2 = {mag:randInt(1,3), sign:randSign(), unit:'Q'};
    const r1 = 6; // abstract aantal eenheden (streepjes) op de as, geen echte afstand
    let r2, wieVerandert=null, forceFactor, nieuweMag=null;

    if (wijzigingType === 'afstand'){
      r2 = Math.round(r1 * factor);
      forceFactor = 1/(factor*factor);
    } else {
      r2 = r1;
      wieVerandert = randChoice([1,2]);
      let oldMag, newMag;
      if (factor===2){ oldMag=1; newMag=2; }
      else if (factor===3){ oldMag=1; newMag=3; }
      else if (factor===0.5){ oldMag=2; newMag=1; }
      else { oldMag=3; newMag=1; }
      if (wieVerandert===1) q1.mag = oldMag; else q2.mag = oldMag;
      nieuweMag = newMag;
      forceFactor = factor;
    }

    const q1Na = {mag:q1.mag, sign:q1.sign, unit:'Q'};
    const q2Na = {mag:q2.mag, sign:q2.sign, unit:'Q'};
    if (wijzigingType === 'lading'){
      if (wieVerandert === 1) q1Na.mag = nieuweMag; else q2Na.mag = nieuweMag;
    }

    return { wijzigingType, factor, q1, q2, q1Na, q2Na, r1, r2, wieVerandert, forceFactor };
  },

  diagram(p, reveal){
    const maxUnit = Math.max(p.r1, p.r2);
    const mapX = u => 120 + (u/maxUnit)*460;
    const y1 = 80, y2 = 200, r = 22;
    let s = svgOpen(640,260);
    [[y1,'SITUATIE 1',p.q1,p.q2,p.r1],[y2,'SITUATIE 2',p.q1Na,p.q2Na,p.r2]].forEach(row=>{
      const [y,label,qa,qb,rUnit] = row;
      s += `<text x="40" y="${y+5}" text-anchor="start" font-size="12" font-weight="700" fill="var(--muted)">${label}</text>`;
      s += `<line x1="110" y1="${y}" x2="600" y2="${y}" stroke="#C7D3C9" stroke-width="1.5"/>`;
      for (let u=0; u<=maxUnit; u++){
        s += `<line x1="${mapX(u)}" y1="${y-6}" x2="${mapX(u)}" y2="${y+6}" stroke="#C7D3C9" stroke-width="1.3"/>`;
      }
      s += labelHalo((mapX(0)+mapX(rUnit))/2, y+22, rSub(1,2)+' = '+rFactorLabel(rUnit/p.r1), 'var(--accent-dark)', 12.5, 700);
      s += chargeCircle(mapX(0), y, qa, 'q\u2081', r, symbolicShort(qa).replace(/^[+\u2212]/,''));
      s += chargeCircle(mapX(rUnit), y, qb, 'q\u2082', r, symbolicShort(qb).replace(/^[+\u2212]/,''));
    });
    s += '</svg>';
    return s;
  },

  opgave(p){
    const basis = 'Twee ladingen q\u2081 = '+symbolicShort(p.q1)+' en q\u2082 = '+symbolicShort(p.q2)+' bevinden zich op een afstand r van elkaar (situatie 1).';
    if (p.wijzigingType === 'afstand'){
      return basis+' In situatie 2 wordt de afstand '+factorActie(p.factor)+' (tot '+rFactorLabel(p.r2/p.r1)+'). Vergelijk de grootte van de kracht tussen situatie 1 en situatie 2.';
    }
    const wieSym = 'q'+p.wieVerandert;
    const nieuweWaarde = p.wieVerandert===1 ? symbolicShort(p.q1Na) : symbolicShort(p.q2Na);
    return basis+' In situatie 2 verandert '+wieSym+' naar '+nieuweWaarde+' (de afstand blijft gelijk). Vergelijk de grootte van de kracht tussen situatie 1 en situatie 2.';
  },

  uitwerking(p){
    let html = '<div class="uitwerking">';
    if (p.wijzigingType === 'afstand'){
      html += '<div>F \u223c 1/r\u00b2</div>';
      html += '<div class="formule">F\u2082/F\u2081 = (r\u2081/r\u2082)\u00b2 = (r/'+rFactorLabel(p.r2/p.r1)+')\u00b2 = '+fmtNL(p.forceFactor,3)+'</div>';
    } else {
      html += '<div>F \u223c q</div>';
      const wieSym = 'q'+p.wieVerandert;
      const oud = p.wieVerandert===1 ? p.q1.mag : p.q2.mag;
      const nieuw = p.wieVerandert===1 ? p.q1Na.mag : p.q2Na.mag;
      html += '<div class="formule">F\u2082/F\u2081 = '+wieSym+'(nieuw)/'+wieSym+'(oud) = '+nieuw+'/'+oud+' = '+fmtNL(p.forceFactor,3)+'</div>';
    }
    const groter = p.forceFactor > 1;
    const b = groter ? Math.round(p.forceFactor*100)/100 : Math.round((1/p.forceFactor)*100)/100;
    html += '<div>De kracht wordt dus '+fmtNL(b, Number.isInteger(b)?0:2)+' keer '+(groter?'groter':'kleiner')+'.</div>';
    html += '</div>';
    return html;
  },

  steps(p){
    const factorCorrectIdx = FACTOR_KEUZES.findIndex(f=>f.val===p.factor);
    const watVerandertCorrect = p.wijzigingType === 'afstand' ? 'afstand' : ('q'+p.wieVerandert);

    // opties voor de uiteindelijke "met welke factor verandert de kracht"-vraag, met doelbewuste afleiders
    const b = p.factor>1 ? p.factor : Math.round(1/p.factor);
    let forceOpties;
    if (p.wijzigingType === 'afstand'){
      const rGroeit = p.factor > 1;
      forceOpties = rGroeit ? [
        {value:'correct', label:(b*b)+' keer kleiner'},
        {value:'d1', label:b+' keer kleiner'},
        {value:'d2', label:(b*b)+' keer groter'},
        {value:'d3', label:b+' keer groter'},
      ] : [
        {value:'correct', label:(b*b)+' keer groter'},
        {value:'d1', label:b+' keer groter'},
        {value:'d2', label:(b*b)+' keer kleiner'},
        {value:'d3', label:b+' keer kleiner'},
      ];
    } else {
      const ladingGroeit = p.factor > 1;
      forceOpties = ladingGroeit ? [
        {value:'correct', label:b+' keer groter'},
        {value:'d1', label:(b*b)+' keer groter'},
        {value:'d2', label:b+' keer kleiner'},
        {value:'d3', label:'blijft gelijk'},
      ] : [
        {value:'correct', label:b+' keer kleiner'},
        {value:'d1', label:(b*b)+' keer kleiner'},
        {value:'d2', label:b+' keer groter'},
        {value:'d3', label:'blijft gelijk'},
      ];
    }

    return [
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'a',
        vraag:'Wat verandert er tussen situatie 1 en situatie 2?',
        kind:'keuze',
        groups:[{key:'wat', multiple:false, options:[
          {value:'afstand', label:'de afstand tussen q\u2081 en q\u2082'},
          {value:'q1', label:'de grootte van q\u2081'},
          {value:'q2', label:'de grootte van q\u2082'},
        ], correct:watVerandertCorrect}]
      },
      {
        stapNr:1, stapNaam:'Analyse', onderdeel:'b',
        vraag:'Met welke factor verandert dit?',
        kind:'keuze',
        groups:[{key:'factor', multiple:false, options:FACTOR_KEUZES.map((f,i)=>({value:'f'+i, label:f.label})), correct:'f'+factorCorrectIdx}]
      },
      {
        stapNr:2, stapNaam:'Redenering', onderdeel:'gegeven & gevraagd',
        kind:'info', vraag:'Gegeven en gevraagd',
        infoHtml: gegevenTabel([
          ['situatie 1', 'q\u2081 = '+symbolicShort(p.q1)+', q\u2082 = '+symbolicShort(p.q2)+', '+rSub(1,2)+' = '+p.r1Cm+' cm'],
          ['situatie 2', 'q\u2081 = '+symbolicShort(p.q1Na)+', q\u2082 = '+symbolicShort(p.q2Na)+', '+rSub(1,2)+' = '+p.r2Cm+' cm'],
          ['gevraagd', 'met welke factor verandert de grootte van de kracht tussen q\u2081 en q\u2082?'],
        ])
      },
      {
        stapNr:2, stapNaam:'Redenering', onderdeel:'conclusie',
        vraag:'Met welke factor verandert de grootte van de kracht?',
        kind:'keuze',
        infoHtml: '<div class="formule">F = k \u00b7 |q\u2081 \u00b7 q\u2082| / r\u00b2</div>',
        groups:[{key:'forcefactor', multiple:false, options:forceOpties, correct:'correct'}],
        uitwerking: TYPE_VERGELIJK.uitwerking(p)
      },
    ];
  }
};

/* ============================= ENGINE ============================= */

const TYPES = [TYPE_TWEE, TYPE_LIJN, TYPE_EVENWICHT, TYPE_DRIEHOEK, TYPE_VERGELIJK];

const state = {
  typeIndex: 0,
  problem: null,
  steps: null,
  stepIndex: 0,
  stepStatus: [],   // 'open' | 'goed' | 'opgelost'
  reveal: {},
  showSolution: false,
  voltooid: false,
};

function huidigType(){ return TYPES[state.typeIndex]; }

function nieuweOpgave(){
  const t = huidigType();
  state.problem = t.generate();
  state.steps = t.steps(state.problem);
  state.stepIndex = 0;
  state.stepStatus = state.steps.map(()=> 'open');
  state.reveal = {};
  state.showSolution = false;
  state.voltooid = false;
  render();
}

function selectType(idx){
  state.typeIndex = idx;
  nieuweOpgave();
}

/* ---------- render: tabs ---------- */

function renderTabs(){
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  TYPES.forEach((t, i)=>{
    const btn = document.createElement('button');
    btn.className = i === state.typeIndex ? 'active' : '';
    btn.innerHTML = `<span class="num">${i+1}</span>${t.tabLabel}`;
    btn.addEventListener('click', ()=> selectType(i));
    nav.appendChild(btn);
  });
}

/* ---------- render: overall ---------- */

function render(){
  renderTabs();
  const t = huidigType();
  document.getElementById('oef-desc').textContent = t.beschrijving;
  document.getElementById('btn-oplossing').textContent = state.showSolution ? 'Terug naar oefening' : 'Toon volledige oplossing';
  const opgaveEl = document.getElementById('opgave-tekst');
  if (t.opgave){
    opgaveEl.style.display = 'block';
    opgaveEl.textContent = t.opgave(state.problem);
  } else {
    opgaveEl.style.display = 'none';
    opgaveEl.textContent = '';
  }
  renderDiagram();
  renderStepsNav();
  if (state.showSolution){
    renderVolledigeOplossing();
  } else if (state.voltooid){
    renderAfgerond();
  } else {
    renderStapInhoud();
  }
}

function renderDiagram(){
  const t = huidigType();
  const revealNow = state.showSolution
    ? Object.assign({}, state.reveal, {pijlen:true, resultant:true, antwoord:true})
    : state.reveal;
  document.getElementById('diagram').innerHTML = t.diagram(state.problem, revealNow);
}

function renderStepsNav(){
  const wrap = document.getElementById('steps-nav');
  wrap.innerHTML = '';
  if (state.showSolution) return;
  state.steps.forEach((st, i)=>{
    const dot = document.createElement('div');
    let cls = 'dot';
    if (i === state.stepIndex && !state.voltooid) cls += ' current';
    if (state.stepStatus[i] === 'goed') cls += ' done';
    if (state.stepStatus[i] === 'opgelost') cls += ' wrong';
    dot.className = cls;
    dot.textContent = (st.stapNr === 1 ? st.onderdeel : (i - firstStap2Index()+1));
    wrap.appendChild(dot);
  });
}
function firstStap2Index(){
  return state.steps.findIndex(s=>s.stapNr===2);
}

/* ---------- render: één stap ---------- */

function renderStapInhoud(){
  const el = document.getElementById('stap-inhoud');
  const step = state.steps[state.stepIndex];
  const status = state.stepStatus[state.stepIndex];

  let html = `<div class="stap-kop"><span class="stap-label">Stap ${step.stapNr} \u2014 ${step.stapNaam}${step.onderdeel && step.stapNr===1 ? ' ('+step.onderdeel+')' : ''}</span></div>`;
  if (step.infoHtml) html += `<div class="info-box">${step.infoHtml}</div>`;
  if (step.vraag) html += `<div class="stap-vraag">${step.vraag}</div>`;

  if (step.kind === 'keuze'){
    step.groups.forEach(g=>{
      if (g.label) html += `<div style="font-size:13.5px; color:var(--muted); font-weight:600; margin:10px 0 6px;">${g.label}</div>`;
      html += '<div class="opties" data-group="'+g.key+'">';
      g.options.forEach(opt=>{
        const inputType = g.multiple ? 'checkbox' : 'radio';
        const name = 'grp-'+g.key;
        html += `<label class="optie" data-value="${opt.value}"><input type="${inputType}" name="${name}" value="${opt.value}">${opt.label}</label>`;
      });
      html += '</div>';
    });
  } else if (step.kind === 'numbers'){
    html += '<div class="veldgroep">';
    step.fields.forEach(f=>{
      html += `<div class="veld-rij" data-field="${f.key}">
        <label>${f.label}</label>
        <input type="text" inputmode="decimal" data-field-input="${f.key}" autocomplete="off">
        <span class="eenheid">${f.unit}</span>
      </div>`;
    });
    html += '</div>';
  }

  html += `<div class="feedback" id="feedback"></div>`;
  html += `<div class="stap-acties">`;
  if (step.kind === 'info'){
    html += `<button class="primary" id="btn-verder">Begrepen, verder</button>`;
  } else {
    html += `<button class="primary" id="btn-controleer">Controleer</button>`;
    html += `<button class="link" id="btn-toon-antwoord">Ik weet het niet \u2014 toon antwoord</button>`;
  }
  html += `</div>`;

  el.innerHTML = html;

  if (step.kind === 'info'){
    document.getElementById('btn-verder').addEventListener('click', ()=>{
      state.stepStatus[state.stepIndex] = 'goed';
      volgendeStap();
    });
  } else {
    document.getElementById('btn-controleer').addEventListener('click', ()=> controleerStap(step));
    document.getElementById('btn-toon-antwoord').addEventListener('click', ()=> toonAntwoordStap(step));
  }

  // als deze stap al eerder correct/opgelost was, herstel visuele status
  if (status === 'goed' || status === 'opgelost'){
    markeerAlleGoed(step);
    toonVolgendeKnop(status);
  }
}

function waardenVanGroep(g){
  const container = document.querySelector('[data-group="'+g.key+'"]');
  const checked = Array.from(container.querySelectorAll('input:checked')).map(i=>i.value);
  return g.multiple ? checked : (checked[0] !== undefined ? checked[0] : null);
}

function controleerStap(step){
  let alleGoed = true;
  const feedbackEl = document.getElementById('feedback');

  if (step.kind === 'keuze'){
    step.groups.forEach(g=>{
      const val = waardenVanGroep(g);
      const correct = g.correct;
      let goed;
      if (g.multiple){
        const a = (val||[]).slice().sort();
        const b = correct.slice().sort();
        goed = a.length===b.length && a.every((v,i)=>v===b[i]);
      } else {
        goed = val === correct;
      }
      const container = document.querySelector('[data-group="'+g.key+'"]');
      container.querySelectorAll('.optie').forEach(lbl=>{
        lbl.classList.remove('correct','fout');
        const isCorrectOpt = g.multiple ? correct.includes(lbl.dataset.value) : lbl.dataset.value === correct;
        const isChecked = lbl.querySelector('input').checked;
        if (isChecked && isCorrectOpt) lbl.classList.add('correct');
        else if (isChecked && !isCorrectOpt) lbl.classList.add('fout');
        else if (!isChecked && isCorrectOpt && !goed) lbl.classList.add('correct');
      });
      if (!goed) alleGoed = false;
    });
  } else if (step.kind === 'numbers'){
    step.fields.forEach(f=>{
      const input = document.querySelector('[data-field-input="'+f.key+'"]');
      const userVal = parseNum(input.value);
      const rij = document.querySelector('[data-field="'+f.key+'"]');
      rij.classList.remove('correct','fout');
      let goed;
      if (isNaN(userVal)){
        goed = false;
      } else if (f.absTol !== undefined){
        goed = Math.abs(userVal - f.correct) <= f.absTol;
      } else {
        goed = withinTol(userVal, f.correct, f.relTol);
      }
      rij.classList.add(goed ? 'correct' : 'fout');
      if (!goed) alleGoed = false;
    });
  }

  if (alleGoed){
    feedbackEl.className = 'feedback goed';
    feedbackEl.innerHTML = '<strong>Juist!</strong>Ga naar de volgende stap.' + (step.uitwerking || '');
    state.stepStatus[state.stepIndex] = 'goed';
    toepassenOnCorrect(step);
    renderDiagram();
    toonVolgendeKnop('goed');
  } else {
    feedbackEl.className = 'feedback slecht';
    feedbackEl.innerHTML = '<strong>Nog niet helemaal juist.</strong>Bekijk de gemarkeerde onderdelen en probeer opnieuw.';
  }
}

function toonAntwoordStap(step){
  if (step.kind === 'keuze'){
    step.groups.forEach(g=>{
      const container = document.querySelector('[data-group="'+g.key+'"]');
      const correctVals = g.multiple ? g.correct : [g.correct];
      container.querySelectorAll('.optie').forEach(lbl=>{
        lbl.classList.remove('fout');
        if (correctVals.includes(lbl.dataset.value)){
          lbl.classList.add('correct');
          lbl.querySelector('input').checked = true;
        } else {
          lbl.querySelector('input').checked = false;
        }
      });
    });
  } else if (step.kind === 'numbers'){
    step.fields.forEach(f=>{
      const input = document.querySelector('[data-field-input="'+f.key+'"]');
      const rij = document.querySelector('[data-field="'+f.key+'"]');
      rij.classList.remove('fout');
      rij.classList.add('correct');
      input.value = fmtSci(f.correct);
    });
  }
  const feedbackEl = document.getElementById('feedback');
  feedbackEl.className = 'feedback goed';
  feedbackEl.innerHTML = '<strong>Antwoord getoond.</strong>Bekijk de oplossing hierboven en ga verder.' + (step.uitwerking || '');
  state.stepStatus[state.stepIndex] = 'opgelost';
  toepassenOnCorrect(step);
  renderDiagram();
  toonVolgendeKnop('opgelost');
}

function markeerAlleGoed(step){
  if (step.kind === 'keuze'){
    step.groups.forEach(g=>{
      const container = document.querySelector('[data-group="'+g.key+'"]');
      const correctVals = g.multiple ? g.correct : [g.correct];
      container.querySelectorAll('.optie').forEach(lbl=>{
        if (correctVals.includes(lbl.dataset.value)){
          lbl.classList.add('correct');
          lbl.querySelector('input').checked = true;
        }
      });
    });
  } else if (step.kind === 'numbers'){
    step.fields.forEach(f=>{
      const input = document.querySelector('[data-field-input="'+f.key+'"]');
      const rij = document.querySelector('[data-field="'+f.key+'"]');
      rij.classList.add('correct');
      input.value = fmtSci(f.correct);
    });
  }
  const feedbackEl = document.getElementById('feedback');
  if (feedbackEl && step.uitwerking){
    feedbackEl.className = 'feedback goed';
    feedbackEl.innerHTML = '<strong>Al beantwoord.</strong>' + step.uitwerking;
  }
}

function toepassenOnCorrect(step){
  if (step.onCorrect && step.onCorrect.reveal){
    state.reveal[step.onCorrect.reveal] = true;
  }
}

function toonVolgendeKnop(status){
  const acties = document.querySelector('.stap-acties');
  if (document.getElementById('btn-volgende')) return;
  const btn = document.createElement('button');
  btn.className = 'primary';
  btn.id = 'btn-volgende';
  btn.textContent = state.stepIndex === state.steps.length-1 ? 'Opgave afronden' : 'Volgende stap';
  btn.addEventListener('click', volgendeStap);
  acties.appendChild(btn);
}

function volgendeStap(){
  if (state.stepIndex >= state.steps.length-1){
    state.voltooid = true;
    render();
    return;
  }
  state.stepIndex += 1;
  render();
}

function renderAfgerond(){
  const el = document.getElementById('stap-inhoud');
  el.innerHTML = `
    <div class="afgerond">
      <span class="vinkje">\u2713</span>
      <h3>Opgave voltooid</h3>
      <p>Goed gedaan! Start een nieuwe opgave om verder te oefenen.</p>
      <button class="primary" id="btn-volgende-opgave">Nieuwe opgave</button>
    </div>
  `;
  document.getElementById('btn-volgende-opgave').addEventListener('click', nieuweOpgave);
}

function renderVolledigeOplossing(){
  const el = document.getElementById('stap-inhoud');
  const p = state.problem;
  let html = '<div class="info-box">';
  state.steps.forEach(step=>{
    html += `<p style="margin:0 0 6px;"><strong>Stap ${step.stapNr} \u2014 ${step.stapNaam}${step.stapNr===1?' ('+step.onderdeel+')':''}:</strong> ${step.vraag||''}</p>`;
    if (step.infoHtml){
      html += `<div style="margin-bottom:8px;">${step.infoHtml}</div>`;
    }
    if (step.kind === 'keuze'){
      step.groups.forEach(g=>{
        const label = g.multiple ? g.correct.join(', ') : g.correct;
        const optLabel = g.options.filter(o => (g.multiple ? g.correct.includes(o.value) : o.value===g.correct)).map(o=>o.label).join(', ');
        html += `<p style="margin:0 0 10px; color:var(--good);">${g.label ? g.label+': ' : ''}<strong>${optLabel}</strong></p>`;
      });
    } else if (step.kind === 'numbers'){
      step.fields.forEach(f=>{
        html += `<p style="margin:0 0 10px; color:var(--good);">${f.label} <strong>${fmtSci(f.correct)} ${f.unit}</strong></p>`;
      });
    }
    if (step.uitwerking){
      html += step.uitwerking;
    }
  });
  html += '</div>';
  html += `<button class="primary" id="btn-nieuw-2">Nieuwe opgave</button>`;
  el.innerHTML = html;
  document.getElementById('btn-nieuw-2').addEventListener('click', nieuweOpgave);
}

/* ---------- top-level knoppen ---------- */

document.getElementById('btn-nieuw').addEventListener('click', nieuweOpgave);
document.getElementById('btn-oplossing').addEventListener('click', ()=>{
  state.showSolution = !state.showSolution;
  render();
});

nieuweOpgave();
</script>
