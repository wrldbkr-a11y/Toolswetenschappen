<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Scheidingsmissie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#f3f7f6; --surface:#ffffff; --surface-2:#e9f1ef; --ink:#13201d; --muted:#53635e; --line:#d3dfdb;
  --accent:#0b6b66; --accent-ink:#ffffff; --accent-soft:#d8eeeb;
  --good:#1d7a3b; --good-soft:#dcf2e2; --bad:#b3261e; --bad-soft:#fbe3e1;
  --proton:#d9443a; --neutron:#8d989c; --elektron:#2f6fb0; --valentie:#e8a400;
  --c-metaal:#c9dcef; --c-nietmetaal:#cdebd3; --c-halfmetaal:#f3e1b0; --c-edelgas:#e3d4f2; --c-bgroep:#e4e8ea;
  --c-alkali:#f4b6a8; --c-aardalkali:#f6d6a1; --c-halogeen:#b9e3c4;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1614; --surface:#16211e; --surface-2:#1c2a26; --ink:#e4eeeb; --muted:#9aaca6; --line:#2b3c37;
  --accent:#5cc7bd; --accent-ink:#06211e; --accent-soft:#183a35;
  --good:#6fd38f; --good-soft:#163524; --bad:#ff8a80; --bad-soft:#3d1a18;
  --proton:#ef5b50; --neutron:#9aa6aa; --elektron:#5b9be0; --valentie:#ffc533;
  --c-metaal:#24384d; --c-nietmetaal:#1f3d29; --c-halfmetaal:#4a3d18; --c-edelgas:#3a2b4d; --c-bgroep:#26302e;
  --c-alkali:#5a2a22; --c-aardalkali:#57401b; --c-halogeen:#1e4a2c;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0e1614; --surface:#16211e; --surface-2:#1c2a26; --ink:#e4eeeb; --muted:#9aaca6; --line:#2b3c37;
  --accent:#5cc7bd; --accent-ink:#06211e; --accent-soft:#183a35;
  --good:#6fd38f; --good-soft:#163524; --bad:#ff8a80; --bad-soft:#3d1a18;
  --proton:#ef5b50; --neutron:#9aa6aa; --elektron:#5b9be0; --valentie:#ffc533;
  --c-metaal:#24384d; --c-nietmetaal:#1f3d29; --c-halfmetaal:#4a3d18; --c-edelgas:#3a2b4d; --c-bgroep:#26302e;
  --c-alkali:#5a2a22; --c-aardalkali:#57401b; --c-halogeen:#1e4a2c;
  color-scheme:dark; }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto;padding-inline:18px;padding-block:28px 64px;display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.2rem;font-weight:600}
p{margin:0;max-width:65ch}
a{color:var(--accent)}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.hero{display:flex;flex-direction:column;gap:10px}
.hero p{color:var(--muted)}
.lpd{font-size:.92rem;color:var(--muted)}

.lesnav{display:grid;grid-template-columns:repeat(var(--tabs,2),1fr);gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px}
.lestab{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.lestab .nr{font-family:var(--f-mono);font-weight:700;font-size:1.15rem;color:var(--accent)}
.lestab .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.lestab b{font-family:var(--f-display);font-size:1rem;line-height:1.2}
.lestab small{color:var(--muted);font-size:.8rem}
.lestab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
@media (max-width:760px){ .lesnav{grid-template-columns:1fr 1fr;position:static} }

.les{display:flex;flex-direction:column;gap:36px}
.doel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.doel .eyebrow{color:var(--accent)}
.doel ul{margin:0;padding-left:20px;font-weight:700;font-size:1.05rem}
.blok{display:flex;flex-direction:column;gap:16px}
.blok-kop{display:flex;gap:12px;align-items:baseline}
.blok-kop .letter{font-family:var(--f-mono);font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:8px;padding:2px 9px;font-size:.95rem}
.tip{background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tip b{font-family:var(--f-display);font-size:1.08rem}
.def{background:var(--surface);border:2px solid var(--accent);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.def .eyebrow{color:var(--accent)}
.def p{font-size:1.12rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.duo,.trio{grid-template-columns:1fr}}
.kaart{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.kaart h3{font-size:1.2rem}
.knop{background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:7px 14px;font-weight:700}
.knop:hover{border-color:var(--accent)}
.knop.hoofd{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.knop[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.knop:disabled{opacity:.45;cursor:default}
.knoppen{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fb{min-height:1.4em}
.fb b{font-family:var(--f-display)}
.ok-t{color:var(--good)} .nok-t{color:var(--bad)}

.oefening{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.oef-kop{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center}
.score{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface-2);border-radius:8px;padding:4px 10px}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.item .zin{font-weight:700}
.item .opties{display:flex;flex-wrap:wrap;gap:6px}
.item .opties button{background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:5px 11px;font-weight:700}
.item .opties button:hover:not(:disabled){border-color:var(--accent)}
.item .opties button:disabled{cursor:default}
.item .opties button.gekozen{border-color:var(--ink)}
.item.juist{border-left-color:var(--good);background:var(--good-soft)}
.item.fout{border-left-color:var(--bad);background:var(--bad-soft)}
.item .uitleg{font-size:.95rem}
.item .uitleg b{font-family:var(--f-display)}
.item.juist .uitleg b{color:var(--good)}
.item.fout .uitleg b{color:var(--bad)}
.item .invul{display:flex;flex-wrap:wrap;gap:8px}
.item .invul input{border:2px solid var(--line);border-radius:8px;padding:5px 10px;background:var(--surface);width:12em;max-width:100%}
.opnieuw{align-self:flex-start}

.tabelwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td b{font-family:var(--f-display)}

.notatie{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-display);font-weight:800;vertical-align:middle}
.notatie .ge{display:inline-flex;flex-direction:column;align-items:flex-end;font-size:.6em;line-height:1.05;font-family:var(--f-mono);font-weight:700}
.notatie .sy{font-size:1.15em}

.linkkaart{display:flex;gap:14px;align-items:center;background:var(--surface);border:2px dashed var(--accent);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--ink)}
.linkkaart:hover{background:var(--accent-soft)}
.linkkaart b{font-family:var(--f-display);font-size:1.1rem}
.linkkaart .pijl{font-size:1.6rem;color:var(--accent);margin-left:auto}

.ikkan{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.ikkan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ikkan li{display:flex;gap:10px;align-items:baseline}
.ikkan .st{font-family:var(--f-mono);font-weight:700;font-variant-numeric:tabular-nums;min-width:5.5em;color:var(--muted)}
.ikkan .st.ok{color:var(--good)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }


.sloten{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.slot-ind{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;background:var(--surface);border:2px solid var(--line);font-size:.78rem;text-align:center;line-height:1.15}
.slot-ind .ic{font-size:1.3rem;line-height:1}
.slot-ind .cijfer{font-family:var(--f-mono);font-weight:700;font-size:1.05rem;min-height:1.2em}
.slot-ind.open{border-color:var(--good);background:var(--good-soft)}
.slot-ind.nu{border-color:var(--accent)}
@media (max-width:560px){.slot-ind .nm{display:none}}
.statusbalk{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-variant-numeric:tabular-nums}
.statusbalk b{font-family:var(--f-mono)}
.rollen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rol{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.rol .wie{font-family:var(--f-display);font-weight:800;font-size:1.05rem}
.rol .wat{font-size:.88rem;color:var(--muted)}
.rol .taak{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
@media (max-width:560px){.rollen{grid-template-columns:1fr}}
.kamer{background:var(--surface);border:2px solid var(--accent);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.kamer h2{font-size:1.5rem}
.kamer .opdr{font-size:1.1rem}
.beeld{background:var(--surface-2);border-radius:12px;padding:8px}
.beeld svg{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.beeld text{font-family:var(--f-body);fill:var(--ink)}
.rij{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;border:1px solid var(--line);border-left:6px solid var(--line);border-radius:12px;padding:8px 10px}
.rij .vr{font-weight:700}
.rij .keuzes{display:flex;flex-wrap:wrap;gap:6px}
.rij .keuzes button{background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:5px 10px;font-weight:700}
.rij .keuzes button[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-soft)}
.rij.ok{border-left-color:var(--good);background:var(--good-soft)}
.rij.nok{border-left-color:var(--bad);background:var(--bad-soft)}
.rij .hint{grid-column:1/-1;font-size:.92rem}
@media (max-width:640px){.rij{grid-template-columns:1fr}}
.kaartjes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.kaartje{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;font-weight:700;text-align:left;display:flex;gap:8px;align-items:center}
.kaartje .vink{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-size:.9rem}
.kaartje[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.kaartje[aria-pressed="true"] .vink{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kaartje.nok{border-color:var(--bad);background:var(--bad-soft)}
.kaartje.ok{border-color:var(--good)}
.volgorde{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.volgorde li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
.volgorde .pos{font-family:var(--f-mono);font-weight:700;width:1.6em;color:var(--muted)}
.volgorde .nm{flex:1;font-weight:700;min-width:0}
.volgorde .nm span{font-weight:400;color:var(--muted)}
.volgorde button{background:var(--surface-2);border:2px solid var(--line);border-radius:8px;width:38px;height:34px;font-weight:700}
.volgorde li.ok{background:var(--good-soft);border-color:var(--good)}
.volgorde li.nok{background:var(--bad-soft);border-color:var(--bad)}
.labels{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.labels li{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.labels .n{font-family:var(--f-mono);font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;flex:none}
.labels select{flex:1;min-width:0;border:2px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--surface)}
.labels li.ok{background:var(--good-soft);border-color:var(--good)}
.labels li.nok{background:var(--bad-soft);border-color:var(--bad)}
.mc{display:grid;gap:8px}
.mc button{background:var(--surface-2);border:2px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;font-weight:700}
.mc button[aria-pressed="true"]{border-color:var(--ink);background:var(--accent-soft)}
.mc button.nok{border-color:var(--bad);background:var(--bad-soft)}
.mc button.ok{border-color:var(--good);background:var(--good-soft)}
.fbk{border-radius:12px;padding:10px 12px;font-weight:700}
.fbk.nok{background:var(--bad-soft);color:var(--bad)}
.fbk.ok{background:var(--good-soft);color:var(--good)}
.fbk span{font-weight:400;color:var(--ink)}
.zeg{background:var(--accent-soft);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.zeg .eyebrow{color:var(--accent)}
.zeg p{font-size:1.15rem;font-family:var(--f-display);font-weight:600;line-height:1.9}
.zeg .gat{display:inline-block;min-width:6.5em;border-bottom:3px solid var(--accent);margin:0 2px}
.zeg .woord{background:var(--surface);border-radius:6px;padding:0 6px;color:var(--good)}
.cijferbeeld{display:flex;align-items:center;gap:14px}
.cijferbeeld .groot{font-family:var(--f-mono);font-weight:700;font-size:2.6rem;background:var(--surface);border:3px solid var(--good);border-radius:14px;width:68px;height:78px;display:grid;place-items:center;color:var(--good)}
.startform{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.startform label{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.95rem}
.startform input{border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface)}
@media (max-width:560px){.startform{grid-template-columns:1fr}}
.codeslot{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.codeslot input{width:3.2rem;height:3.6rem;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:1.8rem;border:3px solid var(--line);border-radius:12px;background:var(--surface)}
.codeslot input:focus{border-color:var(--accent);outline:none}
.kraan .straal{stroke-dasharray:6 6;animation:straal .5s linear infinite}
@keyframes straal{from{stroke-dashoffset:12}to{stroke-dashoffset:0}}
.tech text{font-family:var(--f-body);fill:var(--ink)}
.tech .stroom{stroke-dasharray:6 6;animation:straal .6s linear infinite}
.tech .valt{transform-box:fill-box;animation:valt 1.3s linear infinite}
@keyframes valt{0%{transform:translateY(-6px);opacity:0}20%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.voor{display:inline-block;font-family:var(--f-mono);font-size:.75rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 8px;margin-bottom:2px}
.rij .vr{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.toon-knop{border-style:dashed}
.leerkracht summary{cursor:pointer;font-weight:700}
.leerkracht{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.leerkracht ul{margin:6px 0 0;padding-left:20px}

</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" style="align-self:flex-start;font-weight:700;color:var(--accent);text-decoration:none">← Alle tools</a>
  <header class="hero">
    <span class="eyebrow">Chemie · 3de jaar · mengsels, stofeigenschappen en scheidingstechnieken</span>
    <h1>Scheidingsmissie</h1>
  </header>
  <div id="spel"></div>
</div>
<script>
(function(){
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
const komma = (x,d=1) => x.toFixed(d).replace('.',',');
const scores = {};
let ikkanFn = () => {};
const updateIkKan = () => ikkanFn();

/* tabbladen + #anker */
function tabs(){
  const toon = id => {
    $$('.lestab').forEach(t => t.setAttribute('aria-selected', t.getAttribute('aria-controls')===id?'true':'false'));
    $$('main.les').forEach(m => m.hidden = m.id!==id);
    document.dispatchEvent(new CustomEvent('tab', {detail:id}));
  };
  $$('.lestab').forEach(t => t.addEventListener('click', () => toon(t.getAttribute('aria-controls'))));
  const h = location.hash.slice(1);
  if (h && document.getElementById(h) && document.getElementById(h).matches('main.les')) toon(h);
}

/* sorteeroefening: opties per oefening of per item, antwoord mag een lijst zijn */
function sorteer(el, cfg){
  function render(){
    const items = cfg.vast ? cfg.items : shuffle(cfg.items);
    el.innerHTML = `<div class="oef-kop"><h3>${cfg.titel}</h3><span class="score" data-score>0 / ${items.length}</span></div>
      ${cfg.opdracht?`<p>${cfg.opdracht}</p>`:''}<ul class="items"></ul><button class="knop opnieuw" type="button">↺ Opnieuw</button>`;
    const ul = el.querySelector('.items'); let juist=0, klaar=0;
    scores[cfg.id] = {juist:0,totaal:items.length,klaar:false};
    items.forEach(it => {
      const opties = it.opties || cfg.opties;
      const goed = [].concat(it.antwoord);
      const li = document.createElement('li'); li.className='item';
      li.innerHTML = `<span class="zin">${it.tekst}</span><div class="opties">${(it.opties?shuffle(opties):opties).map(o=>`<button type="button" data-k="${o.k}">${o.label}</button>`).join('')}</div><div class="uitleg" hidden></div>`;
      li.querySelectorAll('.opties button').forEach(b => b.addEventListener('click', () => {
        const ok = goed.includes(b.dataset.k);
        li.classList.add(ok?'juist':'fout'); b.classList.add('gekozen');
        li.querySelectorAll('.opties button').forEach(x => x.disabled=true);
        const lbl = goed.map(k => opties.find(o=>o.k===k).label).join(' of ');
        const u = li.querySelector('.uitleg'); u.hidden=false;
        u.innerHTML = (ok?'<b>Juist!</b> ':`<b>Niet juist.</b> Het is: ${lbl}. `) + (it.uitleg||'');
        klaar++; if(ok) juist++;
        el.querySelector('[data-score]').textContent = `${juist} / ${items.length}`;
        scores[cfg.id] = {juist,totaal:items.length,klaar:klaar===items.length}; updateIkKan();
      }));
      ul.appendChild(li);
    });
    el.querySelector('.opnieuw').addEventListener('click', () => { render(); updateIkKan(); });
  }
  render();
}

/* invuloefening: leerling typt het antwoord */
function invul(el, cfg){
  function render(){
    const pool = typeof cfg.items==='function' ? cfg.items() : cfg.items;
    const items = cfg.vast ? pool : shuffle(pool);
    el.innerHTML = `<div class="oef-kop"><h3>${cfg.titel}</h3><span class="score" data-score>0 / ${items.length}</span></div>
      ${cfg.opdracht?`<p>${cfg.opdracht}</p>`:''}<ul class="items"></ul><button class="knop opnieuw" type="button">↺ ${cfg.opnieuwTekst||'Opnieuw'}</button>`;
    const ul = el.querySelector('.items'); let juist=0, klaar=0;
    scores[cfg.id] = {juist:0,totaal:items.length,klaar:false};
    items.forEach((it,i) => {
      const li = document.createElement('li'); li.className='item';
      li.innerHTML = `<span class="zin">${it.tekst}</span><form class="invul"><input type="text" autocomplete="off" aria-label="antwoord ${i+1}" id="${cfg.id}-in-${i}"><button class="knop" type="submit">Controleer</button></form><div class="uitleg" hidden></div>`;
      li.querySelector('form').addEventListener('submit', e => {
        e.preventDefault();
        const inp = li.querySelector('input'); const v = inp.value.trim(); if(!v) return;
        const res = (it.check || cfg.check || standaardCheck)(v, it);
        const u = li.querySelector('.uitleg'); u.hidden=false;
        if (res.bijna){ u.innerHTML = `<b>Bijna.</b> ${res.bijna}`; return; }
        li.classList.add(res.ok?'juist':'fout'); inp.disabled = true; li.querySelector('button').disabled = true;
        u.innerHTML = (res.ok?'<b>Juist!</b> ':`<b>Niet juist.</b> Het is: ${it.toon||it.antwoord[0]}. `) + (it.uitleg||'');
        klaar++; if(res.ok) juist++;
        el.querySelector('[data-score]').textContent = `${juist} / ${items.length}`;
        scores[cfg.id] = {juist,totaal:items.length,klaar:klaar===items.length}; updateIkKan();
      });
      ul.appendChild(li);
    });
    el.querySelector('.opnieuw').addEventListener('click', () => { render(); updateIkKan(); });
  }
  render();
  return {render};
}
function standaardCheck(v, it){ return {ok: it.antwoord.some(a => norm(a)===norm(v))}; }
function symboolCheck(v, it){
  const s = it.antwoord[0];
  if (v===s) return {ok:true};
  if (v.toLowerCase()===s.toLowerCase()) return {bijna:`Let op de hoofdletters: een symbool begint met een hoofdletter, de tweede letter is klein.`};
  return {ok:false};
}

/* "ik kan"-regel */
function regel(label, s){
  if(!s) return `<li><span class="st">nog niet</span><span>${label}</span></li>`;
  const ok = s.klaar && s.juist/s.totaal>=.8;
  const st = s.klaar ? `${s.juist}/${s.totaal}` : (s.juist?`${s.juist}/${s.totaal} …`:'nog niet');
  return `<li><span class="st ${ok?'ok':''}">${ok?'✓ ':''}${st}</span><span>${label}</span></li>`;
}

/* verdeling elektronen over schillen (eenvoudig: 2, 8, 8, 2) */
function schillen(e){ const max=[2,8,8,2]; const r=[]; let rest=e; for(const m of max){ if(rest<=0) break; const n=Math.min(m,rest); r.push(n); rest-=n; } return r; }

/* schillenmodel tekenen */
function bohrSvg(p, n, e, opt={}){
  const sch = opt.schillen || schillen(e); const R = sch.length>4 ? [0,36,58,80,102,124] : [0,46,72,98,122]; const cx=140, cy=140; const er = sch.length>4 || Math.max(...sch,0)>8 ? 4.5 : 6;
  let s = `<svg viewBox="0 0 280 280" role="img" aria-label="schillenmodel">`;
  for (let i=1;i<=Math.max(sch.length, opt.minSchillen||0);i++) s += `<circle cx="${cx}" cy="${cy}" r="${R[i]}" fill="none" stroke="var(--line)" stroke-width="2"/>`;
  // kern
  const tot = p+n; const kr = tot ? Math.min(sch.length>4?26:30, 10+Math.sqrt(tot)*3.6) : 8;
  s += `<circle cx="${cx}" cy="${cy}" r="${kr}" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/>`;
  const deeltjes = []; for(let i=0;i<p;i++) deeltjes.push('p'); for(let i=0;i<n;i++) deeltjes.push('n');
  // mengen
  const gemengd = []; let ip=0, inn=0; while(ip<p||inn<n){ if(ip<p){gemengd.push('p');ip++;} if(inn<n){gemengd.push('n');inn++;} }
  gemengd.forEach((d,i) => { const a=i*2.39996, r=Math.sqrt(i+0.5)*(kr-5)/Math.sqrt(Math.max(tot,1)); const x=cx+r*Math.cos(a), y=cy+r*Math.sin(a);
    s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${tot>60?2.4:tot>24?3.2:4}" fill="${d==='p'?'var(--proton)':'var(--neutron)'}" stroke="var(--ink)" stroke-width=".5"/>`; });
  sch.forEach((cnt,i) => { const laatste = i===sch.length-1;
    for(let k=0;k<cnt;k++){ const a = -Math.PI/2 + k*2*Math.PI/cnt + i*0.3; const x=cx+R[i+1]*Math.cos(a), y=cy+R[i+1]*Math.sin(a);
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${er}" fill="${laatste&&opt.valentie!==false?'var(--valentie)':'var(--elektron)'}" stroke="var(--ink)" stroke-width="1"/>`; } });
  if (opt.labels) ['K','L','M','N','O'].slice(0,sch.length).forEach((l,i)=>{ s += `<text x="${cx+R[i+1]*0.71+4}" y="${cy-R[i+1]*0.71-4}" font-size="12" font-family="var(--f-mono)" fill="var(--muted)">${l}</text>`; });
  return s + '</svg>';
}

    $('#check').disabled = true;
    P.querySelectorAll('button, select').forEach(x => x.disabled = true);
    $('#verder').addEventListener('click', () => { st.slot++; if (st.slot>=6) st.fase='code'; bewaar(); toon(); window.scrollTo({top:0}); });
  };
  const updStatus = () => { const b = spel.querySelectorAll('.statusbalk b'); if (b[1]) b[1].textContent = st.hints; if (b[2]) b[2].textContent = st.getoond; };
  $('#check').addEventListener('click', () => {
    const {fout, leeg} = controle();
    const fb = $('#fb');
    if (leeg){ fb.innerHTML = `<div class="fbk nok">Nog niet alles ingevuld. <span>Kies bij elke vraag een antwoord.</span></div>`; return; }
    if (fout){ st.hints++; pogingen++; bewaar(); updStatus();
      fb.innerHTML = `<div class="fbk nok">🔒 Het slot blijft dicht. <span>${fout} antwoord${fout>1?'en zijn':' is'} nog niet juist. Lees de hint, overleg en probeer opnieuw.</span></div>
        ${pogingen>=2 ? `<div class="knoppen" style="margin-top:8px"><button class="knop toon-knop" type="button" id="toon">Lukt het niet? Toon het antwoord</button></div>` : `<p style="margin-top:6px;font-size:.92rem;color:var(--muted)">Lukt het na nog één poging niet, dan kan je het antwoord bekijken.</p>`}`;
      $('#toon')?.addEventListener('click', () => { toonAntwoord(); st.getoond++; bewaar(); updStatus(); openSlot(true); });
      return; }
    openSlot(false);
  });
}

function toonCode(){
  spel.innerHTML = kader() + `<div class="kamer">
    <span class="eyebrow">De eindcode</span>
    <h2>Typ de code om ${D().doel} te openen</h2>
    <p>Vul de 6 cijfers in, in de volgorde van de sloten.</p>
    <form class="codeslot" id="codeform">${CODE.map((_,i)=>`<input id="c${i}" inputmode="numeric" maxlength="1" aria-label="cijfer ${i+1}" autocomplete="off">`).join('')}<button class="knop hoofd" type="submit">Open ${D().doel}</button></form>
    <div id="cfb" aria-live="polite"></div></div>`;
  const ins = CODE.map((_,i)=>$('#c'+i));
  ins.forEach((inp,i) => inp.addEventListener('input', () => { inp.value = inp.value.replace(/\D/g,'').slice(0,1); if (inp.value && ins[i+1]) ins[i+1].focus(); }));
  ins[0].focus();
  $('#codeform').addEventListener('submit', e => { e.preventDefault();
    if (ins.map(x=>x.value).join('') === CODE.join('')){ st.fase='klaar'; st.klaar=Date.now(); bewaar(); toon(); }
    else $('#cfb').innerHTML = `<div class="fbk nok">${D().doel[0].toUpperCase()+D().doel.slice(1)} blijft dicht. <span>Controleer de cijfers bij de open sloten bovenaan.</span></div>`; });
}

function toonKlaar(){
  clearInterval(klok);
  spel.innerHTML = `<div class="kamer" style="text-align:center;align-items:center">
    <span class="eyebrow">Missie geslaagd</span>
    <h2>${D().eind}</h2>
    ${st.versie==='B' ? EIND_B : st.versie==='C' ? EIND_C : EIND_A}
    <p style="font-size:1.2rem">Team ${st.namen.filter(Boolean).join(', ') || ''}</p>
    <div class="statusbalk" style="justify-content:center;gap:24px"><span>Versie <b>${st.versie}</b></span><span>Tijd: <b>${tijd()}</b></span><span>Foute pogingen: <b>${st.hints}</b></span><span>Antwoord bekeken: <b>${st.getoond}</b></span></div>
    <p>Toon dit scherm aan je leerkracht.</p>
    <div class="zeg" style="text-align:left;align-self:stretch"><span class="eyebrow">Nog één keer samen</span><p>Soort mengsel → verschil in stofeigenschap → scheidingstechniek.</p></div>
    <div class="knoppen"><button class="knop" type="button" id="reset">↺ Opnieuw beginnen</button></div></div>`;
  $('#reset').addEventListener('click', () => { st = {fase:'start', slot:0, hints:0, getoond:0, start:0, namen:st.namen, klaar:null, versie:null, code:null}; bewaar(); toon(); });
}

function toon(){
  if (st.fase==='start' || !st.code) toonWachtwoord();
  else if (st.fase==='team') toonStart();
  else if (st.fase==='spel'){ toonSlot(); startKlok(); }
  else if (st.fase==='code'){ toonCode(); startKlok(); }
  else toonKlaar();
}
toon();

})();
</script>
</body>
</html>
