<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krachten construeren — samenstellen &amp; ontbinden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF2F5;
    --paper:#FFFFFF;
    --panel-2:#F5F8FB;
    --ink:#1D2A36;
    --ink-soft:#51606E;
    --ink-faint:#8995A2;
    --border:#D3DCE5;
    --border-soft:#E6ECF2;
    --accent:#2F6FB0;
    --accent-dark:#245A91;
    --accent-soft:#E4EEF8;
    --accent-bg:var(--accent-soft);
    --bg-grid:rgba(29,42,54,.05);
    --f1:#2563eb;      /* eerste kracht */
    --f2:#059669;      /* tweede kracht */
    --fr:#dc2626;      /* resultante / eerste component */
    --fb:#7c3aed;      /* tweede component */
    --helper:#94a3b8;  /* hulplijnen */
    --axis:#b7c0d1;
    --radius:12px;
    --radius-sm:8px;
    --font:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .mono{font-family:var(--font);font-variant-numeric:tabular-nums;}

  /* ---------- kop + navigatie (zelfde stijl als de andere tools) ---------- */
  header.top{max-width:1180px;margin:0 auto;padding:36px 24px 0;}
  header.top .eyebrow{font-size:13px;font-weight:700;color:var(--accent-dark);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;}
.top h1{font-size:2rem;font-weight:700;letter-spacing:-0.015em;margin:0 0 8px;}
  header.top .intro{color:var(--ink-soft);max-width:70ch;font-size:15px;line-height:1.6;margin:0;}
  nav{display:flex;flex-wrap:wrap;gap:8px;}
  .catnav{gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--border);}
  .catnav button{
    font-family:var(--font);font-weight:500;font-size:15px;
    background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;
    color:var(--ink-soft);padding:9px 14px;cursor:pointer;
  }
  .catnav button:hover{color:var(--ink);}
  .catnav button.active{color:var(--ink);font-weight:600;border-bottom-color:var(--accent);}
  #topicNav button{
    display:flex;align-items:center;gap:9px;
    font-family:var(--font);font-size:14px;font-weight:500;
    background:var(--paper);border:1px solid var(--border);color:var(--ink-soft);
    padding:9px 14px 9px 10px;border-radius:10px;cursor:pointer;text-align:left;
    transition:border-color .15s, background .15s;
  }
  .nr{
    flex:none;min-width:24px;height:24px;border-radius:12px;padding:0 7px;
    display:inline-flex;align-items:center;justify-content:center;
    background:var(--accent-soft);color:var(--accent-dark);font-size:12px;font-weight:700;
  }
  #topicNav button:hover{border-color:var(--accent);color:var(--ink);}
  #topicNav button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600;}
  #topicNav button.active .nr{background:var(--accent);color:#fff;}

  main.content{max-width:1180px;margin:0 auto;padding:26px 24px 70px;}

  .topic-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap;}
  .topic-head .nr{min-width:34px;height:28px;border-radius:14px;font-size:13px;background:var(--accent);color:#fff;}
  main h2{font-size:1.5rem;font-weight:700;margin:0;letter-spacing:-.01em;}
  .method-tag{
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:600;
    color:var(--accent-dark); background:var(--accent-soft);
    padding:3px 10px; border-radius:100px; margin:8px 0 6px;
  }
  main .intro{color:var(--ink-soft); font-size:15px; line-height:1.55; max-width:75ch; margin:0 0 18px;}

  /* ---------- stage ---------- */
  .stage-wrap{
    display:grid; grid-template-columns:minmax(0,1.35fr) minmax(280px,0.85fr);
    gap:18px; align-items:start;
  }
  .stage-card{
    background:var(--paper); border:1px solid var(--border); border-radius:var(--radius);
    overflow:hidden;
  }
  .stage-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 16px; border-bottom:1px solid var(--border-soft);
  }
  .stage-head .title{font-size:13px; font-weight:600; color:var(--ink-soft); letter-spacing:.04em;}
  .btn{
    font-family:var(--font); font-weight:600; font-size:14px; cursor:pointer;
    border-radius:8px; border:1px solid var(--border); background:#fff; color:var(--ink);
    padding:8px 14px; transition:.15s; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:hover{border-color:var(--accent);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  .btn.primary:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
  .btn:disabled{opacity:.35; cursor:not-allowed;}
  .btn:disabled:hover{border-color:var(--border);}

  svg#stage{width:100%; height:auto; max-height:60vh; display:block; background:
      linear-gradient(var(--bg-grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
    background-size:24px 24px; background-color:#fbfcfe;}

  .legend{display:flex; flex-wrap:wrap; gap:14px; padding:12px 16px; border-top:1px solid var(--border-soft);}
  .legend .item{display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft);}
  .legend .swatch{width:18px; height:3px; border-radius:2px;}
  .legend .swatch.dashed{background:none; border-top:2px dashed var(--helper); width:18px; height:0;}

  /* ---------- step panel ---------- */
  .step-card{
    background:var(--paper); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px 20px; display:flex; flex-direction:column;
    min-height:100%;
  }
  .step-progress{display:flex; align-items:center; gap:8px;}
  .step-progress .dot{width:7px; height:7px; border-radius:50%; background:var(--border);}
  .step-progress .dot.done{background:var(--accent);}
  .step-progress .dot.now{background:var(--fr); transform:scale(1.35);}
  .step-label-row{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .restart-btn{padding:5px 11px; font-size:13px; flex:0 0 auto;}
  .step-label{font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .step-text{font-size:16px; line-height:1.55; color:var(--ink); flex:1; min-height:120px;}
  .step-text b{color:var(--fr);}
  .step-nav{display:flex; gap:8px; margin-top:16px;}
  .step-nav .btn{flex:1; justify-content:center;}

  /* ---------- voorbeelden uit het dagelijks leven ---------- */
  .dagelijks{margin-top:30px;}
  .dagelijks h3{
    font-size:1.2rem; font-weight:700; margin:0 0 6px; padding-left:12px;
    border-left:5px solid var(--accent); line-height:1.4;
  }
  .dagelijks > p{margin:0 0 14px 17px; color:var(--ink-soft); font-size:15px; max-width:75ch;}
  .vb-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px;}
  .vb-card{background:var(--paper); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden;}
  .vb-card svg{display:block; width:100%; height:auto; background:#fbfcfe; border-bottom:1px solid var(--border-soft);}
  .vb-card .txt{padding:12px 16px 14px;}
  .vb-card h4{margin:0 0 4px; font-size:1rem; font-weight:700;}
  .vb-card p{margin:0; font-size:14px; color:var(--ink-soft); line-height:1.55;}
  .vb-card p b{color:var(--ink);}

  .vn{position:relative; display:inline-block; padding-top:0.5em;}
  .vn::before{
    content:'';
    position:absolute; top:0.02em; left:50%;
    width:0.72em; height:0.42em;
    transform:translateX(-50%);
    background:currentColor;
    clip-path: polygon(0% 32%, 62% 32%, 62% 8%, 100% 50%, 62% 92%, 62% 68%, 0% 68%);
  }

  .summary{
    margin-top:14px; padding:14px 16px; border-radius:var(--radius-sm);
    background:var(--accent-bg); border:1px solid #C9DBEE; font-size:14px;
    color:var(--ink); line-height:1.6; display:none;
  }
  .summary.show{display:block;}
  .summary .formula{font-family:var(--font); font-size:15px; color:var(--fr); font-weight:700; display:block; margin-top:4px;}

  /* draw-in animation */
  .appear{animation:fadeUp .5s ease both;}
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(4px);}
    to{opacity:1; transform:translateY(0);}
  }
  .draw-line{stroke-dasharray:800; stroke-dashoffset:800; animation:drawline .6s ease forwards;}
  @keyframes drawline{to{stroke-dashoffset:0;}}

  @media (max-width:880px){
    .stage-wrap{grid-template-columns:1fr;}
    .btn{padding:10px 16px;}
    .restart-btn{padding:9px 14px; font-size:13px;}
    .step-nav .btn{min-height:44px;}
  }
</style>
</head>
<body>

<header class="top">
  <div class="eyebrow">Fysica 3de jaar · Thema 2 · Krachten · hoofdstuk 2</div>
  <h1>Samenstellen &amp; ontbinden van krachten</h1>
  <p class="intro">Volg elke constructie stap voor stap — precies zoals op papier met liniaal en geodriehoek. Hulplijnen staan gestippeld; de gezochte kracht (F<sub>r</sub>, F<sub>x</sub> of F<sub>y</sub>) krijgt telkens een eigen kleur.</p>
  <nav id="catNav" class="catnav"></nav>
  <nav id="topicNav"></nav>
</header>

<main class="content">
    <div class="topic-head"><span class="nr" id="topicBadge"></span><h2 id="topicTitle"></h2></div>
    <div class="method-tag" id="methodTag"></div>
    <p class="intro" id="topicIntro"></p>

    <div class="stage-wrap">
      <div class="stage-card">
        <div class="stage-head">
          <span class="title" id="stageLabel">CONSTRUCTIE</span>
          <button class="btn" id="newExampleBtn">↻ Nieuw voorbeeld</button>
        </div>
        <svg id="stage" viewBox="0 0 620 360" xmlns="http://www.w3.org/2000/svg"></svg>
        <div class="legend" id="legend"></div>
      </div>

      <div class="step-card">
        <div class="step-label-row">
          <div class="step-progress" id="dots"></div>
          <button class="btn restart-btn" id="restartBtn" title="Herbegin deze constructie van nul">↺ Herbegin</button>
        </div>
        <div class="step-label" id="stepLabel">Stap 1</div>
        <div class="step-text" id="stepText"></div>
        <div class="summary" id="summary"></div>
        <div class="step-nav">
          <button class="btn" id="prevBtn">← Vorige</button>
          <button class="btn primary" id="nextBtn">Volgende →</button>
        </div>
      </div>
    </div>

    <section class="dagelijks" id="dagelijks" hidden></section>
</main>

<script>
/* ============================================================
   HELPERS: geometrie & svg
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";
const D2R = Math.PI/180;
function polar(r, deg){ return { x: r*Math.cos(deg*D2R), y: r*Math.sin(deg*D2R) }; }
function add(a,b){ return {x:a.x+b.x, y:a.y+b.y}; }
function sub(a,b){ return {x:a.x-b.x, y:a.y-b.y}; }
function mag(a){ return Math.sqrt(a.x*a.x+a.y*a.y); }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function randChoice(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function fmt(n){ return (Math.round(n*10)/10).toString().replace('.',','); }

function el(tag, attrs={}){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* pixel-canvas setup */
const VB_W = 620, VB_H = 360;
let ORIGIN = { x: VB_W/2, y: VB_H/2 };

function makeScale(maxExtent){
  return Math.max(20, Math.min(46, 300/maxExtent));
}

/* Verzamel alle punten die in de volledige constructie van een onderwerp
   kunnen voorkomen, zodat we de tekening precies kunnen centreren en
   op schaal laten passen binnen het canvas — ongeacht bij welke stap
   de leerling zich bevindt. */
function collectPoints(topic, data){
  const steps = topic.steps(data);
  const pts = [{x:0,y:0}];
  steps.forEach(s=>{
    s.add.forEach(desc=>{
      if(desc.t==='vec' || desc.t==='helper'){ pts.push(desc.from); pts.push(desc.to); }
      else if(desc.t==='point'){ pts.push(desc.at); }
      else if(desc.t==='geo'){ pts.push(desc.through); }
    });
  });
  return pts;
}

function computeLayout(topicId, data){
  const topic = TOPICS[topicId];
  const pts = collectPoints(topic, data);
  let minX=0, maxX=0, minY=0, maxY=0;
  pts.forEach(p=>{
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x);
    minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  });
  const padWorld = 1.1; // ruimte voor labels, hoekbogen en geodriehoek
  minX -= padWorld; maxX += padWorld; minY -= padWorld; maxY += padWorld;
  const w = Math.max(0.5, maxX-minX), h = Math.max(0.5, maxY-minY);
  const PAD_PX = 40;
  const scale = Math.max(16, Math.min(52, Math.min((VB_W-2*PAD_PX)/w, (VB_H-2*PAD_PX)/h)));
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  return { scale, origin: { x: VB_W/2 - cx*scale, y: VB_H/2 + cy*scale } };
}

/* ============================================================
   RENDERING van beschrijvende "descriptors"
   ============================================================ */
function toPx(scale, p){
  return { x: ORIGIN.x + p.x*scale, y: ORIGIN.y - p.y*scale };
}

function ensureMarker(svg, color, id){
  let defs = svg.querySelector('defs');
  if(!defs){ defs = el('defs'); svg.appendChild(defs); }
  if(svg.querySelector('#'+id)) return;
  const m = el('marker', {id, markerWidth:'9', markerHeight:'9', refX:'7', refY:'4', orient:'auto', markerUnits:'userSpaceOnUse'});
  const p = el('path', {d:'M0,0 L8,4 L0,8 Z', fill:color});
  m.appendChild(p); defs.appendChild(m);
}

function renderDescriptor(svg, scale, d, animate){
  ensureMarker(svg, '#16213a', 'arrow-ink');
  const g = el('g', {class: animate ? 'appear' : ''});

  if(d.t === 'vec'){
    ensureMarker(svg, d.color, 'arrow-'+d.colorId);
    const p1 = toPx(scale, d.from), p2 = toPx(scale, d.to);
    const lineAttrs = {
      x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
      stroke:d.color, 'stroke-width':3, 'marker-end':'url(#arrow-'+d.colorId+')',
      'stroke-linecap':'round', class: animate ? 'draw-line':''
    };
    if(d.dashed) lineAttrs['stroke-dasharray'] = '9 6';
    const line = el('line', lineAttrs);
    g.appendChild(line);
    if(d.label){
      const mid = {x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2};
      const side = d.side || 1;
      let nx, ny;
      if(d.normalAngle !== undefined){
        const nrm = polar(1, d.normalAngle+90);
        nx = nrm.x*side; ny = -nrm.y*side;
      } else {
        const dx = p2.x-p1.x, dy = p2.y-p1.y, len = Math.hypot(dx,dy)||1;
        nx = (-dy/len)*side; ny = (dx/len)*side;
      }
      const off = 24;
      const anchorX = mid.x + nx*off, anchorY = mid.y + ny*off;
      const fontSize = 13.5, charW = fontSize*0.615;
      const textWidth = d.label.length*charW;
      const startX = anchorX - textWidth/2;
      const t = el('text', {
        x:startX, y:anchorY, fill:d.color, 'font-family':"Inter, system-ui, sans-serif",
        'font-size':fontSize, 'font-weight':700, 'text-anchor':'start', 'dominant-baseline':'middle',
        stroke:'#fbfcfe', 'stroke-width':4, 'paint-order':'stroke fill'
      });
      t.textContent = d.label;
      g.appendChild(t);
      // getekend vectorteken (pijltje) boven de eerste letter van de naam ("F")
      const ax = startX + charW*0.5, ay = anchorY - fontSize*0.72;
      const aw = charW*0.8, ah = 2.6;
      const bg = el('rect', {x:ax-aw/2-1.5, y:ay-ah-1.5, width:aw+3, height:ah*2+3, fill:'#fbfcfe'});
      g.appendChild(bg);
      const arrow = el('path', {
        d:`M${ax-aw/2},${ay} L${ax+aw/2-2},${ay} M${ax+aw/2-5},${ay-ah} L${ax+aw/2},${ay} L${ax+aw/2-5},${ay+ah}`,
        stroke:d.color, 'stroke-width':1.4, fill:'none', 'stroke-linecap':'round', 'stroke-linejoin':'round'
      });
      g.appendChild(arrow);
    }
  }

  else if(d.t === 'helper'){
    const p1 = toPx(scale, d.from), p2 = toPx(scale, d.to);
    const line = el('line', {
      x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
      stroke:'var(--helper)', 'stroke-width':1.6, 'stroke-dasharray':'6 4'
    });
    g.appendChild(line);
  }

  else if(d.t === 'axis'){
    const dir = polar(1, d.angle);
    const ext = (VB_W+VB_H)/scale; // ruim genoeg om het volledige canvas te overspannen
    const p1 = toPx(scale, {x:-dir.x*ext, y:-dir.y*ext});
    const p2 = toPx(scale, {x:dir.x*ext, y:dir.y*ext});
    const line = el('line', {
      x1:p1.x, y1:p1.y, x2:p2.x, y2:p2.y,
      stroke:'var(--axis)', 'stroke-width':1.4, 'stroke-dasharray':'1 4', 'stroke-linecap':'round'
    });
    g.appendChild(line);
    if(d.label){
      const lp = toPx(scale, polar(d.labelR||6.6, d.angle));
      const t = el('text', {x:lp.x, y:lp.y, fill:'var(--ink-faint)', 'font-family':"Inter, system-ui, sans-serif",
        'font-size':12.5, 'font-weight':700, 'text-anchor':'middle',
        stroke:'#fbfcfe', 'stroke-width':4, 'paint-order':'stroke fill'});
      t.textContent = d.label;
      g.appendChild(t);
    }
  }

  else if(d.t === 'rightangle'){
    const s = 0.4;
    const u1 = polar(s, d.a1), u2 = polar(s, d.a2);
    const pts = [d.at, add(d.at,u1), add(add(d.at,u1),u2), add(d.at,u2)].map(p=>toPx(scale,p));
    const path = el('path', {
      d:`M${pts[0].x},${pts[0].y} L${pts[1].x},${pts[1].y} L${pts[2].x},${pts[2].y} L${pts[3].x},${pts[3].y}`,
      fill:'none', stroke:'var(--ink-soft)', 'stroke-width':1.4
    });
    g.appendChild(path);
  }

  else if(d.t === 'arc'){
    const steps = 18; let dstr = '';
    for(let i=0;i<=steps;i++){
      const a = d.a1 + (d.a2-d.a1)*i/steps;
      const p = toPx(scale, add(d.at, polar(d.r, a)));
      dstr += (i===0?'M':'L') + p.x + ',' + p.y + ' ';
    }
    const path = el('path', {d:dstr, fill:'none', stroke:'var(--ink-faint)', 'stroke-width':1.4});
    g.appendChild(path);
    if(d.label){
      const mid = d.a1 + (d.a2-d.a1)/2;
      const lp = toPx(scale, add(d.at, polar(d.r+0.55, mid)));
      const t = el('text', {x:lp.x, y:lp.y, fill:'var(--ink-soft)', 'font-family':"Inter, system-ui, sans-serif",
        'font-size':12.5, 'font-weight':600, 'text-anchor':'middle',
        stroke:'#fbfcfe', 'stroke-width':4, 'paint-order':'stroke fill'});
      t.textContent = d.label;
      g.appendChild(t);
    }
  }

  else if(d.t === 'geo'){
    // Een geodriehoek is een rechthoekige (meestal gelijkbenige) driehoek:
    // de schuine zijde (hypotenusa) leg je tegen de richting die je wil natekenen.
    const size = d.length || 2.3;               // lengte van de schuine meetzijde
    const dir = polar(1, d.angle), perp = polar(1, d.angle+90);
    const sign = d.side || 1;
    const centerOffset = 0.3;                    // iets van de hulplijn af, zodat ze niet verdwijnt
    const center = add(d.through, {x:perp.x*centerOffset*sign, y:perp.y*centerOffset*sign});
    const h1   = sub(center, {x:dir.x*size*0.5,  y:dir.y*size*0.5});   // uiteinde 1 van de schuine zijde
    const h2   = add(center, {x:dir.x*size*0.5,  y:dir.y*size*0.5});   // uiteinde 2 van de schuine zijde
    const apex = add(center, {x:perp.x*size*0.5*sign, y:perp.y*size*0.5*sign}); // de rechte hoek

    const pxPts = [h1, h2, apex].map(p=>toPx(scale,p));
    const poly = el('polygon', {
      points: pxPts.map(p=>p.x+','+p.y).join(' '),
      fill:'rgba(120,148,196,.16)', stroke:'var(--ink-soft)', 'stroke-width':1.4
    });
    g.appendChild(poly);

    // liniaalstreepjes langs de schuine (meet)zijde
    const n = 8;
    for(let i=1;i<n;i++){
      const t = i/n;
      const pt = { x:h1.x+(h2.x-h1.x)*t, y:h1.y+(h2.y-h1.y)*t };
      const tickLen = (i % 2 === 0) ? 0.13 : 0.075;
      const tickEnd = { x:pt.x + perp.x*tickLen*sign, y:pt.y + perp.y*tickLen*sign };
      const a = toPx(scale,pt), b = toPx(scale,tickEnd);
      g.appendChild(el('line',{x1:a.x,y1:a.y,x2:b.x,y2:b.y,stroke:'var(--ink-soft)','stroke-width':1}));
    }

    // scharniergaatje bij de rechte hoek — typisch voor een geodriehoek
    const apexPx = toPx(scale, apex);
    g.appendChild(el('circle', {cx:apexPx.x, cy:apexPx.y, r:2.6, fill:'#fbfcfe', stroke:'var(--ink-soft)', 'stroke-width':1.1}));

    if(d.label){
      const lp = toPx(scale, add(apex, {x:perp.x*0.55*sign, y:perp.y*0.55*sign}));
      const t = el('text', {x:lp.x, y:lp.y, fill:'var(--ink-soft)', 'font-family':"Inter, system-ui, sans-serif",
        'font-size':10.5, 'font-weight':600, 'text-anchor':'middle',
        stroke:'#fbfcfe', 'stroke-width':3.5, 'paint-order':'stroke fill'});
      t.textContent = d.label;
      g.appendChild(t);
    }
  }

  else if(d.t === 'point'){
    const p = toPx(scale, d.at);
    const c = el('circle', {cx:p.x, cy:p.y, r:3.2, fill:'var(--ink)'});
    g.appendChild(c);
    if(d.label){
      const t = el('text', {x:p.x-10, y:p.y+4, fill:'var(--ink-soft)', 'font-family':"Inter, system-ui, sans-serif",
        'font-size':12.5, 'font-weight':700, 'text-anchor':'end',
        stroke:'#fbfcfe', 'stroke-width':3.5, 'paint-order':'stroke fill'});
      t.textContent = d.label;
      g.appendChild(t);
    }
  }

  return g;
}

/* origin marker + label, always drawn */
function baseOrigin(svg, scale, label){
  const p = toPx(scale, {x:0,y:0});
  const c = el('circle', {cx:p.x, cy:p.y, r:3.6, fill:'var(--ink)'});
  svg.appendChild(c);
  const t = el('text', {x:p.x-10, y:p.y+18, fill:'var(--ink-faint)', 'font-family':"Inter, system-ui, sans-serif",
    'font-size':12.5, 'font-weight':700});
  t.textContent = label || 'O';
  svg.appendChild(t);
}

        add:[ {t:'helper', from:d.pF, to:d.footY}, {t:'geo', through:{x:(d.pF.x+d.footY.x)/2,y:(d.pF.y+d.footY.y)/2}, angle:d.base, side:-1} ] },

'3.2': {
  group:'3', groupTitle:'2.4 · Ontbinden van een kracht', badge:'2.4',
  title:'Niet-loodrecht op elkaar staande componenten',
  method:'Ontbindingsmethode',
  intro:'De kracht F wordt nu ontbonden volgens twee gegeven richtingen a en b die niet loodrecht op elkaar staan — bijvoorbeeld twee touwen of een geleiderail.',
  gen(){
    const F=randInt(4,6), thF=randChoice([35,50,65,115,130,145]);
    const a=thF-randChoice([25,30,35]), b=thF+randChoice([25,30,35]);
    const pF = polar(F, thF);
    const A=a*D2R, B=b*D2R;
    const det = Math.cos(A)*Math.sin(B) - Math.cos(B)*Math.sin(A);
    const Fa = (pF.x*Math.sin(B) - Math.cos(B)*pF.y)/det;
    const Fb = (Math.cos(A)*pF.y - pF.x*Math.sin(A))/det;
    const pA = polar(Fa, a), pB = polar(Fb, b);
    return {F,thF,a,b,pF,Fa,Fb,pA,pB, maxExtent: Math.max(F,Math.abs(Fa),Math.abs(Fb))*1.35};
  },
  steps(d){
    return [
      { text:`Teken de gegeven kracht <b><span class="vn">F</span></b> (${d.F} N) vanuit O, onder een hoek van ${d.thF}°.`,

        add:[ {t:'axis', angle:d.a, label:'a', labelR:d.maxExtent+0.4}, {t:'axis', angle:d.b, label:'b', labelR:d.maxExtent+0.4} ] },

        add:[ {t:'helper', from:d.pF, to:d.pA}, {t:'geo', through:{x:(d.pF.x+d.pA.x)/2,y:(d.pF.y+d.pA.y)/2}, angle:d.b, side:1} ] },
      { text:`Vanaf de <b>kop van <span class="vn">F</span></b>: teken een stippellijn evenwijdig aan richting a, tot ze richting b snijdt, opnieuw met de geodriehoek. Dat snijpunt is de kop van component <b><span class="vn">F</span>b</b>.`,
        add:[ {t:'helper', from:d.pF, to:d.pB}, {t:'geo', through:{x:(d.pF.x+d.pB.x)/2,y:(d.pF.y+d.pB.y)/2}, angle:d.a, side:-1} ] },
      { text:`Teken <b><span class="vn">F</span>a</b> (O tot het snijpunt op a) en <b><span class="vn">F</span>b</b> (O tot het snijpunt op b), elk in een eigen kleur.`,
        add:[ {t:'vec', from:{x:0,y:0}, to:d.pA, color:'var(--fr)', colorId:'fr', label:'Fa'},
              {t:'vec', from:{x:0,y:0}, to:d.pB, color:'var(--fb)', colorId:'fb', label:'Fb'} ] },
      { text:`Controleer grafisch: leg <span class="vn">F</span>a en <span class="vn">F</span>b kop-staart achter elkaar — samen geven ze opnieuw <b><span class="vn">F</span></b> terug.`, add:[] },
    ];
  },
  summary(d){ return `F (${d.F} N) ontbonden volgens a (${d.a.toFixed(0)}°) en b (${d.b.toFixed(0)}°)<span class="formula">Fa = ${fmt(d.Fa)} N &nbsp; Fb = ${fmt(d.Fb)} N</span>`; }
},

  {id:'3', nr:'2.4', title:'Ontbinden', items:['3.1','3.2']},
];
function buildNav(){
  const cur = TOPICS[state.topicId].group;
  const cat = document.getElementById('catNav'); cat.innerHTML='';
  GROUPS.forEach(g=>{
    const b=document.createElement('button');
    b.textContent=g.nr+' · '+g.title;
    b.classList.toggle('active', g.id===cur);
    b.addEventListener('click',()=>selectTopic(g.items[0]));
    cat.appendChild(b);
  });
  const nav = document.getElementById('topicNav'); nav.innerHTML='';
  GROUPS.find(g=>g.id===cur).items.forEach(id=>{
    const b=document.createElement('button');
    b.innerHTML=`<span class="nr">${TOPICS[id].badge}</span>${TOPICS[id].title}`;
    b.classList.toggle('active', id===state.topicId);
    b.addEventListener('click',()=>selectTopic(id));
    nav.appendChild(b);
  });
}

function selectTopic(id){
  state.topicId = id;
  state.data = TOPICS[id].gen();
  state.layout = computeLayout(id, state.data);
  state.stepIdx = 0;
  buildNav();
  renderDagelijks();
  renderHeader();
  renderStep(false);
}

function renderHeader(){
  const topic = TOPICS[state.topicId];
  document.getElementById('topicBadge').textContent = topic.badge;
  document.getElementById('topicTitle').textContent = topic.title;
  document.getElementById('methodTag').textContent = '✎ ' + topic.method;
  document.getElementById('topicIntro').textContent = topic.intro;
}

function buildLegend(){
  const topic = TOPICS[state.topicId];
  const map = {
    '1.1':[['<span class="vn">F</span>₁','var(--f1)'],['<span class="vn">F</span>₂','var(--f2)'],['<span class="vn">F</span>r (resultante)','var(--fr)'],['hulplijn','dashed']],
    '1.2':[['<span class="vn">F</span>₁','var(--f1)'],['<span class="vn">F</span>₂','var(--f2)'],['<span class="vn">F</span>r (resultante)','var(--fr)'],['hulplijn','dashed']],
    '2.1':[['<span class="vn">F</span>₁','var(--f1)'],['<span class="vn">F</span>₂','var(--f2)'],['<span class="vn">F</span>r (resultante)','var(--fr)'],['hulplijn','dashed'],['geodriehoek','geo']],
    '2.2':[['<span class="vn">F</span>₁','var(--f1)'],['<span class="vn">F</span>₂','var(--f2)'],['<span class="vn">F</span>r (resultante)','var(--fr)'],['hulplijn','dashed'],['geodriehoek','geo']],
    '3.1':[['<span class="vn">F</span> (gegeven)','var(--f1)'],['<span class="vn">F</span>x','var(--fr)'],['<span class="vn">F</span>y','var(--fb)'],['hulplijn','dashed'],['geodriehoek','geo']],
    '3.2':[['<span class="vn">F</span> (gegeven)','var(--f1)'],['<span class="vn">F</span>a','var(--fr)'],['<span class="vn">F</span>b','var(--fb)'],['hulplijn','dashed'],['geodriehoek','geo']],
  };
  const legend = document.getElementById('legend'); legend.innerHTML='';
  map[state.topicId].forEach(([label,color])=>{
    const item = document.createElement('div'); item.className='item';
    if(color==='dashed'){
      item.innerHTML = `<span class="swatch dashed"></span>${label}`;
    } else if(color==='geo'){
      item.innerHTML = `<span class="swatch" style="border:1.3px solid var(--ink-soft); background:rgba(120,148,196,.20); height:14px; width:14px; clip-path:polygon(0 100%, 100% 100%, 0 0);"></span>${label}`;
    } else if(color==='dashed-f2'){
      item.innerHTML = `<span class="swatch dashed" style="border-top-color:var(--f2)"></span>${label}`;
    } else {
      item.innerHTML = `<span class="swatch" style="background:${color}"></span>${label}`;
    }
    legend.appendChild(item);
  });
}

function renderStep(animate){
  const topic = TOPICS[state.topicId];
  const steps = topic.steps(state.data);
  const scale = state.layout.scale;
  ORIGIN = state.layout.origin;

  // draw svg
  const svg = document.getElementById('stage');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${VB_W} ${VB_H}`);
  baseOrigin(svg, scale, 'O');
  for(let i=0;i<=state.stepIdx;i++){
    steps[i].add.forEach(desc=>{
      if(desc.t === 'geo' && i !== state.stepIdx) return; // geodriehoek is een tijdelijk hulpmiddel, geen blijvend element
      svg.appendChild(renderDescriptor(svg, scale, desc, animate && i===state.stepIdx));
    });
  }

  // step text
  document.getElementById('stepLabel').textContent = `Stap ${state.stepIdx+1} van ${steps.length}`;
  document.getElementById('stepText').innerHTML = steps[state.stepIdx].text;

  // dots
  const dots = document.getElementById('dots'); dots.innerHTML='';
  steps.forEach((s,i)=>{
    const dot = document.createElement('span');
    dot.className = 'dot' + (i<state.stepIdx?' done':'') + (i===state.stepIdx?' now':'');
    dots.appendChild(dot);
  });

  // summary
  const summary = document.getElementById('summary');
  if(state.stepIdx === steps.length-1){
    summary.innerHTML = topic.summary(state.data);
    summary.classList.add('show');
  } else {
    summary.classList.remove('show');
  }

  document.getElementById('prevBtn').disabled = state.stepIdx===0;
  document.getElementById('nextBtn').disabled = state.stepIdx===steps.length-1;
  document.getElementById('nextBtn').textContent = state.stepIdx===steps.length-2 ? 'Laatste stap →' : 'Volgende →';

  buildLegend();
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(state.stepIdx>0){ state.stepIdx--; renderStep(false); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  const steps = TOPICS[state.topicId].steps(state.data);
  if(state.stepIdx<steps.length-1){ state.stepIdx++; renderStep(true); }
});
document.getElementById('newExampleBtn').addEventListener('click', ()=>{
  state.data = TOPICS[state.topicId].gen();
  state.layout = computeLayout(state.topicId, state.data);
  state.stepIdx = 0;
  renderStep(false);
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  state.stepIdx = 0;
  renderStep(false);
});

/* ================= VOORBEELDEN UIT HET DAGELIJKS LEVEN (ontbinden) ================= */
const VB = {
  '3.1': [
    {type:'trek', titel:'Een koffer met wieltjes trekken',
     tekst:'Je trekt <b>schuin omhoog</b> aan het handvat. Alleen F<sub>x</sub> trekt de koffer <b>vooruit</b>. F<sub>y</sub> tilt de koffer een beetje <b>op</b>. Hoe schuiner je trekt, hoe kleiner F<sub>x</sub>.'},
    {type:'duw', titel:'Een grasmaaier duwen',
     tekst:'Je duwt <b>schuin naar beneden</b> langs de stang. F<sub>x</sub> duwt de maaier <b>vooruit</b>. F<sub>y</sub> drukt hem <b>tegen de grond</b>: dat helpt niet om vooruit te gaan.'},
    {type:'helling', titel:'Een slee op een helling',
     tekst:'De zwaartekracht F<sub>z</sub> wijst recht naar beneden. Je ontbindt ze <b>langs de helling</b> (F<sub>∥</sub>: de slee glijdt naar beneden) en <b>loodrecht op de helling</b> (F<sub>⊥</sub>: de slee drukt tegen de helling). Hoe steiler de helling, hoe groter F<sub>∥</sub>.'},
  ],
  '3.2': [
    {type:'lamp', titel:'Een lamp aan twee kabels',
     tekst:'Het gewicht F<sub>z</sub> van de lamp wordt verdeeld over de <b>twee kabels</b>. Je ontbindt F<sub>z</sub> in de richting van elke kabel. De kabel die het <b>steilst</b> hangt, moet het <b>meest</b> dragen.'},
    {type:'waslijn', titel:'Natte was aan een waslijn',
     tekst:'Hangt de waslijn bijna <b>horizontaal</b>, dan zijn de krachten in de lijn <b>veel groter</b> dan het gewicht van de was. Daarom kan een strak gespannen waslijn knappen. Laat je ze meer doorhangen, dan worden de krachten kleiner.'},
  ],
};

function vbSvg(type){
  const NS='http://www.w3.org/2000/svg';
  const W=300,H=190;
  let o='';
  const C={f:'#2563eb',a:'#dc2626',b:'#7c3aed',h:'#94a3b8',ink:'#1D2A36',grond:'#cfd8e2'};
  const arrow=(x1,y1,x2,y2,col,lab,lx,ly,w=3)=>{
    const ang=Math.atan2(y2-y1,x2-x1), s=9;
    const p1=[x2-s*Math.cos(ang-0.4),y2-s*Math.sin(ang-0.4)], p2=[x2-s*Math.cos(ang+0.4),y2-s*Math.sin(ang+0.4)];
    return `<line x1="${x1}" y1="${y1}" x2="${x2-5*Math.cos(ang)}" y2="${y2-5*Math.sin(ang)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`+
      `<polygon points="${x2},${y2} ${p1[0]},${p1[1]} ${p2[0]},${p2[1]}" fill="${col}"/>`+
      (lab?`<text x="${lx}" y="${ly}" fill="${col}" font-size="14" font-weight="700" font-family="Inter, sans-serif">${lab}</text>`:'');
  };
  const dash=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${C.h}" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  // ontbind vector F (vanuit P) volgens eenheidsrichtingen a en b
  const ontbind=(P,F,a,b)=>{
    const det=a[0]*b[1]-a[1]*b[0];
    const al=(F[0]*b[1]-F[1]*b[0])/det, be=(a[0]*F[1]-a[1]*F[0])/det;
    return {A:[P[0]+al*a[0],P[1]+al*a[1]], B:[P[0]+be*b[0],P[1]+be*b[1]], T:[P[0]+F[0],P[1]+F[1]]};
  };
  if(type==='trek' || type==='duw'){
    const g=150;
    o+=`<line x1="10" y1="${g}" x2="290" y2="${g}" stroke="${C.grond}" stroke-width="3"/>`;
    if(type==='trek'){
      // koffer
      o+=`<rect x="40" y="${g-62}" width="58" height="50" rx="7" fill="#e8eef6" stroke="${C.ink}" stroke-width="2"/>`+
         `<circle cx="52" cy="${g-6}" r="6" fill="${C.ink}"/><circle cx="86" cy="${g-6}" r="6" fill="${C.ink}"/>`;
      const P=[98,g-58], ang=-35*Math.PI/180, L=120;
      o+=`<line x1="${P[0]}" y1="${P[1]}" x2="${P[0]+38*Math.cos(ang)}" y2="${P[1]+38*Math.sin(ang)}" stroke="${C.ink}" stroke-width="3"/>`;
      const F=[L*Math.cos(ang),L*Math.sin(ang)], r=ontbind(P,F,[1,0],[0,-1]);
      o+=dash(r.A[0],r.A[1],r.T[0],r.T[1])+dash(r.B[0],r.B[1],r.T[0],r.T[1]);
      o+=arrow(P[0],P[1],r.A[0],r.A[1],C.a,'Fx',r.A[0]-8,r.A[1]+20)+arrow(P[0],P[1],r.B[0],r.B[1],C.b,'Fy',P[0]-26,r.B[1]+8)+arrow(P[0],P[1],r.T[0],r.T[1],C.f,'F',r.T[0]+6,r.T[1]+4,3.4);
    } else {
      // grasmaaier: stang naar linksboven, duwkracht naar rechtsonder
      o+=`<rect x="150" y="${g-34}" width="90" height="26" rx="6" fill="#e3f0e5" stroke="${C.ink}" stroke-width="2"/>`+
         `<circle cx="164" cy="${g-6}" r="7" fill="${C.ink}"/><circle cx="226" cy="${g-6}" r="7" fill="${C.ink}"/>`+
         `<line x1="152" y1="${g-30}" x2="70" y2="${g-100}" stroke="${C.ink}" stroke-width="3"/>`;
      // de kracht grijpt aan bij de handen (bovenaan de stang) en wijst langs de stang naar rechtsonder
      const S=[70,g-100], ang=Math.atan2(70,82), L=92;
      const F=[L*Math.cos(ang),L*Math.sin(ang)];
      const r=ontbind(S,F,[1,0],[0,1]);
      o+=`<circle cx="${S[0]}" cy="${S[1]}" r="7" fill="#f3d9c4" stroke="${C.ink}" stroke-width="1.5"/>`;
      o+=dash(r.A[0],r.A[1],r.T[0],r.T[1])+dash(r.B[0],r.B[1],r.T[0],r.T[1]);
      o+=arrow(S[0],S[1],r.A[0],r.A[1],C.a,'Fx',r.A[0]+4,r.A[1]+4)+arrow(S[0],S[1],r.B[0],r.B[1],C.b,'Fy',S[0]-30,r.B[1])+arrow(S[0],S[1],r.T[0],r.T[1],C.f,'F',r.T[0]+8,r.T[1]+10,3.4);
    }
  } else if(type==='helling'){
    const A=[20,170], B=[280,170], T=[20,55];
    o+=`<polygon points="${A} ${B} ${T}" fill="#eef2f6" stroke="${C.grond}" stroke-width="2"/>`;
    const ang=Math.atan2(B[1]-T[1],B[0]-T[0]); // helling daalt naar rechts
    const u=[Math.cos(ang),Math.sin(ang)], n=[Math.sin(ang),-Math.cos(ang)]; // langs helling (naar beneden), normaal (naar buiten)
    const M=[T[0]+0.42*(B[0]-T[0]), T[1]+0.42*(B[1]-T[1])];
    const P=[M[0]+n[0]*16, M[1]+n[1]*16];
    o+=`<g transform="translate(${P[0]},${P[1]}) rotate(${ang*180/Math.PI})"><rect x="-26" y="-16" width="52" height="32" rx="5" fill="#fde8d8" stroke="${C.ink}" stroke-width="2"/></g>`;
    const F=[0,92], r=ontbind(P,F,u,[-n[0],-n[1]]);
    o+=dash(r.A[0],r.A[1],r.T[0],r.T[1])+dash(r.B[0],r.B[1],r.T[0],r.T[1]);
    o+=arrow(P[0],P[1],r.A[0],r.A[1],C.a,'F∥',r.A[0]+4,r.A[1]-4)+arrow(P[0],P[1],r.B[0],r.B[1],C.b,'F⊥',r.B[0]-30,r.B[1]+6)+arrow(P[0],P[1],r.T[0],r.T[1],C.f,'Fz',r.T[0]+6,r.T[1]);
    o+=`<circle cx="${P[0]}" cy="${P[1]}" r="3" fill="${C.ink}"/>`;
  } else if(type==='lamp' || type==='waslijn'){
    const plafY=22;
    let L1,L2,P,Fl;
    if(type==='lamp'){ L1=[70,plafY]; L2=[250,plafY]; P=[140,92]; Fl=78; }
    else { L1=[14,40]; L2=[286,40]; P=[150,60]; Fl=40; }
    o+=(type==='lamp'
        ? `<line x1="10" y1="${plafY}" x2="290" y2="${plafY}" stroke="${C.ink}" stroke-width="3"/>`
        : `<rect x="8" y="30" width="8" height="150" fill="${C.grond}"/><rect x="284" y="30" width="8" height="150" fill="${C.grond}"/>`);
    o+=`<line x1="${L1[0]}" y1="${L1[1]}" x2="${P[0]}" y2="${P[1]}" stroke="${C.ink}" stroke-width="2"/><line x1="${L2[0]}" y1="${L2[1]}" x2="${P[0]}" y2="${P[1]}" stroke="${C.ink}" stroke-width="2"/>`;
    o+= type==='lamp'
        ? `<path d="M${P[0]-16},${P[1]+18} L${P[0]+16},${P[1]+18} L${P[0]+8},${P[1]} L${P[0]-8},${P[1]} Z" fill="#fff3c4" stroke="${C.ink}" stroke-width="2"/>`
        : `<rect x="${P[0]-14}" y="${P[1]}" width="28" height="30" rx="3" fill="#dbeafe" stroke="${C.ink}" stroke-width="2"/>`;
    // richtingen: verlengde van elke kabel voorbij het ophangpunt (kabel wordt uitgerekt)
    const n1=Math.hypot(P[0]-L1[0],P[1]-L1[1]), n2=Math.hypot(P[0]-L2[0],P[1]-L2[1]);
    const a=[(P[0]-L1[0])/n1,(P[1]-L1[1])/n1], b=[(P[0]-L2[0])/n2,(P[1]-L2[1])/n2];
    const r=ontbind(P,[0,Fl],a,b);
    o+=dash(r.A[0],r.A[1],r.T[0],r.T[1])+dash(r.B[0],r.B[1],r.T[0],r.T[1]);
    const clip=(Q)=>[Math.max(4,Math.min(296,Q[0])),Q[1]];
    const A=clip(r.A), B=clip(r.B);
    o+=arrow(P[0],P[1],A[0],A[1],C.a,'Fa',A[0]+(A[0]>P[0]?-26:4),A[1]+16)+arrow(P[0],P[1],B[0],B[1],C.b,'Fb',B[0]+(B[0]>P[0]?-26:6),B[1]+16)+arrow(P[0],P[1],r.T[0],r.T[1],C.f,'Fz',r.T[0]+6,r.T[1]);
    if(type==='waslijn') o+=`<text x="150" y="182" text-anchor="middle" fill="${C.ink}" font-size="12" font-family="Inter, sans-serif">Fa en Fb zijn veel groter dan Fz</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="${NS}" role="img">${o}</svg>`;
}

function renderDagelijks(){
  const box=document.getElementById('dagelijks');
  const lijst=VB[state.topicId];
  if(!lijst){ box.hidden=true; box.innerHTML=''; return; }
  box.hidden=false;
  box.innerHTML=`<h3>Ontbinden in het dagelijks leven</h3><p>Vaak werkt maar één component van een kracht mee. Kijk welk deel van de kracht nuttig is.</p>`+
    `<div class="vb-grid">`+lijst.map(v=>`<div class="vb-card">${vbSvg(v.type)}<div class="txt"><h4>${v.titel}</h4><p>${v.tekst}</p></div></div>`).join('')+`</div>`;
}
