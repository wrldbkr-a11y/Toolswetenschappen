<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remediëring – wetenschappen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--paper:#fff;--ink:#1D2A36;--muted:#51606E;--line:#CBD5DE;--acc:#1F4E79;--groen:#1F7A4A;--geel:#FFF4D6;
  --fysica:#2F6FB0;--chemie:#D46A1A;--biologie:#3E8E41}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,Arial,sans-serif;font-size:1.0625rem;line-height:1.5}
main{max-width:46rem;margin:0 auto;padding:2rem 1.1rem 4rem}
a{color:var(--acc)}
h1{font-size:clamp(1.7rem,5vw,2.2rem);line-height:1.15;margin:.2rem 0 .5rem}
.sub{color:var(--muted);margin:0 0 1.5rem}
.terug{display:inline-block;margin-bottom:.8rem;font-weight:700;text-decoration:none}
/* overzicht */
.groep{margin-top:1.8rem}
.groep h2{font-size:1.2rem;margin:0 0 .6rem;padding-left:.6rem;border-left:6px solid var(--c)}
.knoppen{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.6rem}
.knoppen a{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.75rem .9rem;text-decoration:none;color:var(--ink);font-weight:700;min-height:44px}
.knoppen a:hover{border-color:var(--c)}
/* kaart */
.stap{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin:1rem 0}
.stap h2{font-size:1.15rem;margin:0 0 .5rem;display:flex;gap:.6rem;align-items:baseline}
.stap h2 .nr{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--acc);color:#fff;display:inline-grid;place-items:center;font-size:1rem}
.strat{display:inline-block;background:#E4ECF4;color:var(--acc);font-weight:700;border-radius:4px;padding:.05rem .45rem;font-size:.95rem}
.wat{color:var(--muted);font-style:italic;margin:.2rem 0 .5rem}
.zin{background:var(--geel);border-left:4px solid #9A5B00;padding:.5rem .8rem;margin:.6rem 0;border-radius:0 4px 4px 0}
.zin b{display:block;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:#6B4A00}
.blok{border-top:1px dashed var(--line);margin-top:.8rem;padding-top:.8rem}
.links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.links a,.knop{display:inline-flex;align-items:center;gap:.35rem;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;padding:.5rem .85rem;border-radius:4px;min-height:44px;border:0;font:inherit;font-weight:700;cursor:pointer}
.links a.licht,.knop.licht{background:#E4ECF4;color:var(--acc)}
.knop[disabled]{background:#cbd5de;color:#51606E;cursor:default}
ul.check{list-style:none;padding:0;margin:.4rem 0}
ul.check li{padding-left:1.7rem;position:relative;margin:.3rem 0}
ul.check li::before{content:"☐";position:absolute;left:0;font-size:1.2rem;line-height:1.2}
ol.oef li{margin:.15rem 0}
.schaal{font-weight:700;letter-spacing:.05em}
details.extra{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.8rem 1.1rem;margin:1rem 0}
details.extra summary{font-weight:700;cursor:pointer}
dl.woorden{margin:.4rem 0;display:grid;gap:.45rem}
dl.woorden dt{font-weight:700}
dl.woorden dd{margin:0 0 0 .9rem}
dl.woorden dd i{color:var(--muted)}
.vraag{border-top:1px solid var(--line);padding:.8rem 0}
.vraag .dok{display:inline-block;font-size:.8rem;font-weight:700;border-radius:4px;padding:0 .4rem;margin-right:.4rem;background:#E7F3EC;color:var(--groen)}
.vraag .dok.d3{background:#FDE8D7;color:#9A4A0B}
.opts{display:grid;gap:.4rem;margin:.5rem 0}
.opts button{text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:.5rem .7rem;cursor:pointer;min-height:44px}
.opts button.juist{border-color:var(--groen);background:#E7F3EC}
.opts button.fout{border-color:#b3261e;background:#FBE9E7}
.fb{margin:.3rem 0;color:var(--muted)}
.antw{background:#F3F6F9;border-radius:6px;padding:.5rem .8rem;margin-top:.4rem}
h3.niv{font-size:1.05rem;margin:1.2rem 0 .2rem}
.keuze{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.4rem 0 1rem}
.keuze>div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;color:var(--muted)}
.keuze b{color:var(--ink)}
.modus{display:flex;gap:.5rem;margin:.6rem 0 0;flex-wrap:wrap}
.modus a{flex:1 1 12rem;text-align:center;text-decoration:none;font-weight:700;padding:.6rem .8rem;border-radius:6px;border:2px solid var(--acc);color:var(--acc);background:#fff;min-height:44px}
.modus a.aan{background:var(--acc);color:#fff}
.lk{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem}
.ok{color:var(--groen);font-weight:700;margin-left:.5rem}
@media print{.links,.lk,.terug,details.extra{display:none}.stap{break-inside:avoid}}
</style>
</head>
<body>
<main id="app"></main>
<footer style="max-width:900px;margin:0 auto;padding:16px 24px 40px;color:#6b7280;font-size:12px">Gemaakt door de vakgroep wetenschappen · Maria Assumpta Lyceum · ontwikkeld met hulp van AI · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.nl">CC BY-NC-SA 4.0</a></footer>
<script>
/* ===== Vul hier de link(s) naar BookWidgets in. Eén link voor alles, of één per groep. ===== */
const BOOKWIDGETS = {
  'alles': '',                 // bv. 'https://www.bookwidgets.com/play/XXXXXX'
  'Chemie 3de jaar': '',
  'Fysica 3de jaar': '',
  'Fysica 4de jaar': '',
  'Fysica 5de jaar': '',
  'Biologie 3de jaar': ''
};
/* ============================================================================================ */
const KAARTEN = /*KAARTEN*/;
const STRAT = /*STRAT*/;
const ZIN = /*ZIN*/;
const KLEUR = g => g.startsWith('Chemie') ? 'var(--chemie)' : g.startsWith('Biologie') ? 'var(--biologie)' : 'var(--fysica)';
const app = document.getElementById('app');
const e = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sNaam = k => `<span class="strat">${STRAT[k][0]}</span>`;

let vnr = 0;
const f = t => e(t).replace(/([A-Za-zρ])_([A-Za-z]+)/g, '$1<sub>$2</sub>');
const open_ = v => { const id = 'a' + (++vnr); return `<div class="vraag"><span class="dok${v.dok === 3 ? ' d3' : ''}">DOK ${v.dok}</span>${f(v.v)}
  <div><button class="knop licht" data-toon="${id}">Toon het antwoord</button></div><div class="antw" id="${id}" hidden>${f(v.a)}</div></div>`; };
const mc_ = v => `<div class="vraag" data-j="${v.j}"><span class="dok d3">DOK 3</span>${f(v.v)}
  <div class="opts">${v.o.map((o, i) => `<button data-i="${i}">${'ABCD'[i]}. ${f(o)}</button>`).join('')}</div><div class="fb" data-u="${f(v.u).replace(/"/g, '&quot;')}" hidden></div></div>`;
function overzicht(){
  document.title = 'Remediëring – wetenschappen';
  const groepen = [...new Set(KAARTEN.map(k => k.groep))];
  app.innerHTML = `<h1>Remediëring</h1>
  <p class="sub">Kies het hoofdstuk. Daarna kies je:</p>
  <div class="keuze"><div><b>📅 Voor de toets</b><br>Je bereidt je voor in 2 korte stukken en levert je voorbereiding in.</div><div><b>🔁 Na de toets</b><br>Je had een lage score. Je leert uit je fouten en levert je werk in.</div></div>
  ${groepen.map(g => `<div class="groep" style="--c:${KLEUR(g)}"><h2>${g}</h2><div class="knoppen">${
    KAARTEN.filter(k => k.groep === g).map(k => `<a href="#${k.id}/voor">${e(k.titel)}</a>`).join('')}</div></div>`).join('')}`;
  window.scrollTo(0, 0);
}

function kaart(k, modus){
  const na = modus === 'na';
  document.title = 'Remediëring – ' + k.titel;
  const bw = BOOKWIDGETS[k.groep] || BOOKWIDGETS['alles'];
  const z = ZIN[k.strat] || [];
  app.innerHTML = `<a class="terug" href="#">← Alle hoofdstukken</a>
  <div style="color:${KLEUR(k.groep)};font-weight:700">${k.groep}</div>
  <h1>${e(k.titel)}</h1>
  <div class="modus"><a href="#${k.id}/voor" class="${na ? '' : 'aan'}">📅 Voor de toets</a><a href="#${k.id}/na" class="${na ? 'aan' : ''}">🔁 Na de toets</a></div>
  <p class="sub" style="margin-top:.8rem">${na
    ? `Je werkt op papier, in <b>2 korte stukken van ongeveer een half uur</b>. Doe ze op twee verschillende dagen: dan onthoud je meer (${sNaam('spreiden')}). Neem je verbeterde toets en je cursus erbij.`
    : `Je werkt op papier, in <b>2 korte stukken van ongeveer een half uur</b>. Doe ze op twee verschillende dagen: dan onthoud je meer (${sNaam('spreiden')}). Begin een paar dagen voor de toets. Neem je cursus erbij.`}</p>

  <section class="stap"><h2><span class="nr">1</span>Lees de doelen</h2>
    <p>${sNaam('doelen')} <span class="wat">${STRAT.doelen[1]}</span></p>
    <ul>${k.doelen.map(d => `<li>${d}</li>`).join('')}</ul>
    <p>Schrijf bovenaan je blad de nummers 1 tot ${k.doelen.length}. Zet bij elk doel: <span class="schaal">✓</span> ik kan dit · <span class="schaal">~</span> een beetje · <span class="schaal">✗</span> nog niet.</p>
  </section>

  <details class="extra" open><summary>Woorden die je nodig hebt (${k.woorden.length})</summary>
    <p>Gebruik deze woorden in al je antwoorden. Lees ook de voorbeeldzin.</p>
    <dl class="woorden">${k.woorden.map(([w, u, z]) => `<dt>${e(w)}</dt><dd>${e(u)}${z ? `<br><i>${e(z)}</i>` : ''}</dd>`).join('')}</dl>
  </details>

  <section class="stap"><h2><span class="nr">2</span>Deel 1 <span style="font-weight:400;color:var(--muted);font-size:1rem">· ± 30 minuten</span></h2>
    ${na ? `<p>${sNaam('fouten')} <span class="wat">${STRAT.fouten[1]}</span></p>
    <p>Neem je toets. Schrijf bij elke fout over dit hoofdstuk:</p>
    <div class="zin"><b>Zinsbouwers</b>Dit is fout omdat … · Het juiste antwoord is … want …</div>`
    : k.strat === 'toets' ? '' : `<p>${sNaam('toets')} <span class="wat">${STRAT.toets[1]}</span></p>
    <p>Neem een leeg blad. Schrijf bij elk doel van stap 1 op wat je erover weet, met je cursus dicht. Kijk daarna na in je cursus en vul aan in het groen.</p>
    <div class="zin"><b>Zinsbouwers</b>Ik weet nog: … · Ik was vergeten dat …</div>`}
    <div class="blok">
      <p>${sNaam(k.strat)} <span class="wat">${STRAT[k.strat][1]}</span></p>
      <p>${e(k.opdr)}</p>
      ${z.length ? `<div class="zin"><b>Zinsbouwers</b>${z.map(e).join(' · ')}</div>` : ''}
      ${k.strat === 'redenering' ? '<p>Leg het daarna <b>hardop</b> uit aan iemand: een klasgenoot of iemand thuis. Die persoon vraagt telkens: <i>"Waarom?"</i></p>' : ''}
      <p>Twijfel je? Herhaal eerst in je cursus of in de tool.</p>
      <div class="links"><a href="${k.cursus}" target="_blank" rel="noopener">📘 Cursus</a><a class="licht" href="${k.tool[0]}" target="_blank" rel="noopener">🧪 ${e(k.tool[1])}</a></div>
    </div>
  </section>

  <section class="stap"><h2><span class="nr">3</span>Deel 2 <span style="font-weight:400;color:var(--muted);font-size:1rem">· ± 30 minuten, op een andere dag</span></h2>
    <p>${sNaam('elkaar')} <span class="wat">${STRAT.elkaar[1]}</span></p>
    <p>Maak deze oefeningen uit de cursus, <b>met je cursus dicht</b>:</p>
    <ul>${k.oef.map(([n, t]) => `<li>Oefening ${n} · ${e(t)}</li>`).join('')}</ul>
    <p>Kijk daarna na met de oplossingen in de cursus. Verbeter <b>in het groen</b>.</p>
    ${na ? '' : `<p>${sNaam('fouten')} Had je een oefening fout? Schrijf er in het groen bij <b>waarom</b> het fout was. Bv. <i>Ik had fout omdat …</i> of <i>Ik vergat dat …</i></p>`}
    <div class="links"><a href="${k.cursus}#oefeningen" target="_blank" rel="noopener">📘 Oefeningen in de cursus</a></div>
    <div class="blok"><p>Lees de doelen van stap 1 opnieuw. Zet er nog eens <span class="schaal">✓ ~ ✗</span> naast, in het groen.</p></div>
  </section>

  <section class="stap"><h2><span class="nr">4</span>Inleveren</h2>
    ${na ? '' : `<p>Kijk naar je doelen van deel 2. Nog een <span class="schaal">~</span> of <span class="schaal">✗</span>? Oefen dat doel nog met de extra vragen hieronder. De dag voor de toets herhaal je nog eens kort: ${sNaam('toets')}.</p>`}
    <p>Neem duidelijke foto's van:</p>
    <ul class="check">
      <li>je doelen met <span class="schaal">✓ ~ ✗</span> van deel 1 en deel 2</li>
      ${na ? '<li>je verbeterde toetsvragen</li>' : k.strat === 'toets' ? '' : '<li>je blad van <i>Toets jezelf</i>, met je aanvullingen in het groen</li>'}
      <li>je opdracht van deel 1 (${STRAT[k.strat][0].toLowerCase()})</li>
      <li>je oefeningen van deel 2, met de verbetering${na ? '' : ' en de reden van je fouten'} in het groen</li>
    </ul>
    <p>Kies in BookWidgets: <b>${e(k.titel)}</b> · <b>${na ? 'na de toets' : 'voor de toets'}</b>. Laad je foto's op${na ? '' : ', ten laatste de dag voor de toets'}.</p>
    <div class="links">${bw ? `<a href="${bw}" target="_blank" rel="noopener">📤 Naar BookWidgets</a>` : `<button class="knop" disabled>📤 Link naar BookWidgets volgt</button>`}</div>
  </section>

  <details class="extra"><summary>Extra oefenen: vragen op niveau DOK 2 en DOK 3</summary>
    <p>Dit hoef je niet in te leveren. Schrijf je antwoord eerst zelf op papier. Kijk daarna pas naar het antwoord.</p>
    <h3 class="niv">DOK 2 · Toepassen</h3>
    <div class="zin"><b>Zinsbouwers</b>Ik gebruik de formule … · Het verschil tussen … en … is dat … · … is een voorbeeld van … omdat …</div>
    ${k.vragen.filter(v => v.t === 'open' && v.dok === 2).map(open_).join('')}
    <h3 class="niv">DOK 3 · Redeneren</h3>
    <div class="zin"><b>Zinsbouwers</b>Ik ben (niet) akkoord, want … · Dat komt doordat … · Als …, dan … Daardoor …</div>
    ${k.vragen.filter(v => v.t === 'open' && v.dok === 3).map(open_).join('')}
    <h3 class="niv">DOK 3 · Meerkeuze</h3>
    <p>Kies een antwoord. Schrijf daarna bij elk fout antwoord waarom het fout is: <i>"… is fout omdat …"</i></p>
    ${k.vragen.filter(v => v.t === 'mc').map(mc_).join('')}
    <h3 class="niv">Nog meer oefenen</h3>
    ${k.rest.length ? `<p>Oefeningen uit de cursus die je nog niet maakte:</p><ul>${k.rest.map(([n, t]) => `<li>Oefening ${n} · ${e(t)}</li>`).join('')}</ul>` : ''}
    <div class="links"><a class="licht" href="${k.extra[0]}" target="_blank" rel="noopener">🧪 ${e(k.extra[1])}</a></div>
  </details>

  <div class="lk">Voor de leerkracht: <button class="knop licht" id="kopieer">🔗 Kopieer de link (${na ? 'na' : 'voor'} de toets)</button><span class="ok" id="ok" hidden>Gekopieerd</span></div>`;
  app.querySelectorAll('[data-toon]').forEach(b => b.onclick = () => { const a = document.getElementById(b.dataset.toon); a.hidden = !a.hidden; b.textContent = a.hidden ? 'Toon het antwoord' : 'Verberg het antwoord'; });
  app.querySelectorAll('.vraag[data-j]').forEach(q => q.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
    const j = +q.dataset.j, i = +b.dataset.i;
    q.querySelectorAll('.opts button').forEach(x => x.classList.remove('juist', 'fout'));
    b.classList.add(i === j ? 'juist' : 'fout');
    const fb = q.querySelector('.fb'); fb.hidden = false;
    fb.innerHTML = i === j ? '<b style="color:var(--groen)">Juist.</b> ' + fb.dataset.u : '<b style="color:#b3261e">Nog niet.</b> Waarom is dit fout? Probeer opnieuw.';
  }));
  document.getElementById('kopieer').onclick = async () => {
    try { await navigator.clipboard.writeText(location.href.split('#')[0] + '#' + k.id + '/' + (na ? 'na' : 'voor')); document.getElementById('ok').hidden = false; }
    catch (x) { prompt('Kopieer deze link:', location.href); }
  };
  window.scrollTo(0, 0);
}

function route(){
  const [id, m] = decodeURIComponent(location.hash.slice(1)).split('/');
  const k = KAARTEN.find(k => k.id === id);
  k ? kaart(k, m === 'na' ? 'na' : 'voor') : overzicht();
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
