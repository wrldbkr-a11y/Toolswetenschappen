<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITEL}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F5; --panel:#FFFFFF; --panel-2:#F5F8FB; --line:#D3DCE5;
  --text:#1D2A36; --text-dim:#51606E;
  --accent:#2F6FB0; --accent-dark:#245A91; --accent-soft:#E4EEF8;
  --ok:#1F7A4A; --ok-bg:#E3F3E9; --warn:#9A5B00; --warn-bg:#FFF4D6;
  --font:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font);}
body{-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px;}
.top{max-width:900px;margin:0 auto;padding:36px 24px 0;}
.top .eyebrow{font-size:13px;font-weight:700;color:var(--accent-dark);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px;}
.top h1{font-size:2rem;font-weight:700;letter-spacing:-0.015em;margin:0 0 8px;line-height:1.2;}
.top .intro{color:var(--text-dim);font-size:15px;margin:0;}
.inhoud{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 0;padding-bottom:14px;border-bottom:1px solid var(--line);}
.inhoud a{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:500;text-decoration:none;color:var(--text-dim);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;}
.inhoud a:hover{border-color:var(--accent);color:var(--text);}
.inhoud a .nr{min-width:22px;height:22px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-dark);font-size:12px;font-weight:700;padding:0 6px;}
.inhoud a.slot{opacity:.55;}
main{max-width:900px;margin:0 auto;padding:22px 24px 80px;}
section.blok{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:22px;scroll-margin-top:16px;}
section.blok > h2{font-size:1.45rem;margin:0 0 12px;display:flex;align-items:center;gap:10px;letter-spacing:-0.01em;}
section.blok > h2 .nr{min-width:30px;height:30px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-size:14px;font-weight:700;padding:0 8px;}
h3{font-size:1.1rem;margin:22px 0 8px;}
p{margin:0 0 12px;}
ul.doelen{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
ul.doelen li{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 12px 9px 40px;position:relative;}
ul.doelen li::before{content:'✓';position:absolute;left:14px;top:9px;color:var(--accent);font-weight:700;}
.figuur{margin:12px 0 16px;text-align:center;}
.figuur svg{max-width:100%;height:auto;background:#fbfcfe;border:1px solid var(--line);border-radius:10px;}
.figuur figcaption{font-size:13px;color:var(--text-dim);margin-top:4px;}
.kader{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;padding:12px 16px;margin:14px 0;}
.kader .kop{font-weight:700;color:var(--accent-dark);margin-bottom:4px;}
.kader p:last-child{margin-bottom:0;}
.formule{display:inline-block;font-size:19px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 14px;margin:4px 0 8px;}
.toolknop{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:14px;color:var(--accent-dark);background:#fff;border:1px solid var(--accent);border-radius:8px;padding:8px 14px;margin:6px 8px 10px 0;}
.toolknop:hover{background:var(--accent-soft);}
.denk{border:1px solid var(--line);border-radius:10px;margin:16px 0;overflow:hidden;}
.denk .vraag{background:var(--warn-bg);padding:12px 16px;}
.denk .vraag .kop{font-size:12px;font-weight:700;color:var(--warn);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;}
.denk .vraag p:last-child{margin:0;}
.denk .onder{padding:10px 16px;background:#fff;}
.denk button,.knop{font-family:var(--font);font-size:14px;font-weight:600;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:8px;padding:8px 14px;cursor:pointer;}
.denk button:hover,.knop:hover{background:var(--accent-dark);}
.knop.licht{background:#fff;color:var(--text);border-color:var(--line);}
.knop.licht:hover{border-color:var(--accent);background:#fff;}
.slotje{color:var(--text-dim);font-size:14px;}
.redenering{margin-top:10px;}
.redenering ol{margin:0;padding-left:0;list-style:none;counter-reset:st;}
.redenering ol li{counter-increment:st;position:relative;padding:8px 0 8px 40px;border-top:1px dashed var(--line);}
.redenering ol li:first-child{border-top:none;}
.redenering ol li::before{content:counter(st);position:absolute;left:4px;top:8px;width:24px;height:24px;border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;}
.redenering .stap{font-weight:700;}
.redenering .besluit{background:var(--ok-bg);border-radius:8px;padding:8px 12px;margin-top:6px;color:var(--ok);font-weight:600;}
.oef{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;}
.oef .titel{font-weight:700;margin-bottom:4px;}
.oef .titel .nr{display:inline-flex;min-width:26px;height:26px;border-radius:13px;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-dark);font-size:13px;margin-right:8px;}
.oef ol.deelvragen{margin:6px 0 4px;padding-left:22px;}
.gesloten-deel{color:var(--text-dim);font-size:15px;display:flex;align-items:center;gap:10px;}
.stappenplan{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px;}
.stappenplan span{background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;}
table.vb{border-collapse:collapse;margin:6px 0 12px;font-size:15px;}
table.vb td{padding:3px 12px 3px 0;vertical-align:top;}
table.vb td:first-child{font-weight:700;color:var(--accent-dark);white-space:nowrap;}
.leerkracht-banner{background:#7c3aed;color:#fff;text-align:center;font-size:14px;font-weight:600;padding:6px;}
footer{max-width:900px;margin:0 auto;padding:0 24px 40px;color:var(--text-dim);font-size:12px;}
/* ---------- afdrukken ---------- */
.printblad{display:none;}
@media print{
  @page{size:A4;margin:16mm 15mm;}
  body{background:#fff;font-size:12pt;}
  body.print-oef > *:not(#print-oef), body.print-cornell > *:not(#print-cornell){display:none !important;}
  body.print-oef #print-oef, body.print-cornell #print-cornell{display:block;}
  .printblad h1{font-size:16pt;margin:0 0 2mm;}
  .printblad .naam{display:flex;gap:10mm;font-size:11pt;margin:0 0 5mm;}
  .printblad .oef{border:none;border-top:1px solid #999;border-radius:0;padding:3mm 0;margin:0;break-inside:avoid;}
  .printblad table.cornell{width:100%;border-collapse:collapse;}
  .printblad table.cornell td{border:1px solid #555;vertical-align:top;padding:2mm 3mm;font-size:11pt;}
  .printblad table.cornell td.v{width:32%;font-weight:600;}
  .printblad .samenv{border:1px solid #555;height:38mm;margin-top:4mm;padding:2mm 3mm;font-weight:600;}
  /* volledige cursus afdrukken */
  body:not(.print-oef):not(.print-cornell) #banner, body:not(.print-oef):not(.print-cornell) nav.inhoud,
  body:not(.print-oef):not(.print-cornell) .toolknop, body:not(.print-oef):not(.print-cornell) button,
  body:not(.print-oef):not(.print-cornell) .onder, body:not(.print-oef):not(.print-cornell) footer{display:none !important;}
  body:not(.print-oef):not(.print-cornell) .blok{box-shadow:none;border:none;padding:0;margin:0 0 6mm;}
  body:not(.print-oef):not(.print-cornell) figure, body:not(.print-oef):not(.print-cornell) .kader, body:not(.print-oef):not(.print-cornell) .denk, body:not(.print-oef):not(.print-cornell) .oef{break-inside:avoid;}
  body:not(.print-oef):not(.print-cornell) .schrijflijnen{display:block;}
}
.schrijflijnen{display:none;}
.schrijflijnen div{border-bottom:1px solid #999;height:9mm;}
</style>
</head>
<body>
<div id="banner"></div>
<header class="top">
  <div class="eyebrow">{{EYEBROW}}</div>
  <h1>{{TITEL}}</h1>
  <p class="intro">{{INTRO}}</p>
  <p><button class="knop licht" onclick="window.print()">🖨 Druk de cursus af</button></p>
  <nav class="inhoud" id="inhoud"></nav>
</header>
<main id="cursus">
{{INHOUD}}
</main>
<footer>{{FOOTER}}</footer>

<div class="printblad" id="print-oef"></div>
<div class="printblad" id="print-cornell"></div>

<script>
/* =====================================================================
   VRIJGAVE — hier zet de leerkracht onderdelen open of dicht.
   true  = zichtbaar voor de leerlingen
   false = nog gesloten (de leerling ziet een slotje)
   Tip: met ?leerkracht achter de link zie je als leerkracht alles,
        bv. .../{{BESTAND}}?leerkracht
   ===================================================================== */
const VRIJGAVE = {
{{VRIJGAVE}}
};

/* ===================================================================== */
const LK = new URLSearchParams(location.search).has('leerkracht');
const open = id => LK || VRIJGAVE[id] === true;
if(LK) document.getElementById('banner').innerHTML='<div class="leerkracht-banner">Leerkrachtweergave: alles is zichtbaar, ook wat voor leerlingen nog gesloten is.</div>';

// delen open of dicht
document.querySelectorAll('section.blok[data-vrij]').forEach(el=>{
  if(open(el.dataset.vrij)) return;
  const kop=el.querySelector(':scope > h2');
  [...el.children].forEach(c=>{ if(c!==kop) c.style.display='none'; });
  const m=document.createElement('p'); m.className='gesloten-deel'; m.innerHTML='🔒 Dit deel wordt opengesteld wanneer we het in de les behandelen.';
  el.appendChild(m);
});

// denkvragen: redenering pas tonen na vrijgave
document.querySelectorAll('.denk').forEach(d=>{
  const id=d.dataset.vrij, red=d.querySelector('.redenering'), onder=d.querySelector('.onder');
  red.hidden=true;
  if(open(id)){
    const b=document.createElement('button'); b.textContent='Toon de redenering';
    b.onclick=()=>{ red.hidden=!red.hidden; b.textContent=red.hidden?'Toon de redenering':'Verberg de redenering'; };
    onder.prepend(b);
  } else {
    onder.innerHTML='<span class="slotje">💬 Denk eerst zelf na. We bespreken dit samen in de les; daarna verschijnt hier de redenering.</span>';
  }
});

// oplossingen van oefeningen
document.querySelectorAll('.oef[data-vrij]').forEach(o=>{
  const id=o.dataset.vrij, opl=o.querySelector('.redenering'), onder=o.querySelector('.onder');
  opl.hidden=true;
  if(open(id)){
    const b=document.createElement('button'); b.className='knop licht'; b.textContent='Toon de oplossing';
    b.onclick=()=>{ opl.hidden=!opl.hidden; b.textContent=opl.hidden?'Toon de oplossing':'Verberg de oplossing'; };
    onder.appendChild(b);
  } else onder.innerHTML='<span class="slotje">🔒 De oplossing verschijnt nadat we de oefening besproken hebben.</span>';
});

// inhoudstafel
const inh=document.getElementById('inhoud');
document.querySelectorAll('section.blok').forEach(s=>{
  const a=document.createElement('a'); a.href='#'+s.id;
  const nr=s.querySelector('h2 .nr'); const tekst=s.querySelector('h2').textContent.replace(nr?nr.textContent:'','').trim();
  a.innerHTML=(nr?'<span class="nr">'+nr.textContent+'</span>':'')+tekst;
  if(s.dataset.vrij && !open(s.dataset.vrij)) a.classList.add('slot');
  inh.appendChild(a);
});

// afdrukbare bladen
function vulPrint(){
  const oefs=[...document.querySelectorAll('#oefeningen .oef')].map(o=>{ const k=o.cloneNode(true); k.querySelectorAll('.redenering,.onder').forEach(x=>x.remove()); k.removeAttribute('data-vrij'); return k.outerHTML; }).join('');
  document.getElementById('print-oef').innerHTML=`<h1>{{TITEL}} · oefeningen</h1><div class="naam"><span>Naam: ______________________</span><span>Klas: ______</span><span>Datum: __________</span></div><p>Maak elke oefening in je schrift. Gebruik telkens: gegeven · gevraagd · formule · oplossing · antwoord met eenheid.</p>`+oefs;
  const vragen=CORNELL.map(v=>`<tr><td class="v">${v[0]}</td><td style="height:${Math.round((v[1]||32)*1.35)}mm"></td></tr>`).join('');
  document.getElementById('print-cornell').innerHTML=`<h1>{{TITEL}} · Cornellblad</h1><div class="naam"><span>Naam: ______________________</span><span>Klas: ______</span></div><table class="cornell"><tr><td class="v">Vragen</td><td><b>Notities</b> (samen opgebouwd in de les)</td></tr>${vragen}</table><div class="samenv">Samenvatting in mijn eigen woorden:</div>`;
}
const CORNELL = {{CORNELL}};
function druk(soort){ vulPrint(); document.body.classList.add('print-'+soort); setTimeout(()=>{ window.print(); document.body.classList.remove('print-'+soort); },50); }
document.querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>druk(b.dataset.print));
</script>
</body>
</html>
