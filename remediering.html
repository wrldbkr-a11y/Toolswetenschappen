kunnen worden uitgewisseld met de omgeving.", "Een goed geïsoleerde thermosfles benadert een geïsoleerd systeem: de warmte kan er bijna niet uit."], ["de energie", "Het vermogen van een systeem om arbeid te verrichten of om iets te veranderen; energie kan van vorm veranderen maar niet verloren gaan.", "Om te fietsen heb je energie nodig, die je haalt uit je voeding."], ["de calorie", "Een oudere eenheid van energie. 1 calorie is de energie die nodig is om 1 gram water 1 graad Celsius op te warmen.", "Op voedingsetiketten wordt de energiewaarde soms nog in calorieën aangeduid."], ["de joule", "De eenheid waarin energie wordt uitgedrukt. Symbool: J.", "Om een appel van 100 gram 1 meter op te tillen, heb je ongeveer 1 joule nodig."], ["de kinetische energie", "De energie die een voorwerp heeft doordat het beweegt.", "Hoe sneller een auto rijdt, hoe groter zijn kinetische energie."], ["de thermische energie", "De energie die opgeslagen zit in de bewegende deeltjes van een stof; hoe warmer een stof, hoe meer thermische energie ze bevat.", "Als je water verwarmt, neemt de thermische energie van het water toe."], ["de potentiële energie", "De energie die een systeem heeft dankzij zijn positie of toestand, en die kan omgezet worden in andere vormen van energie.", "Een steen die hoog op een muur ligt, heeft potentiële energie."], ["de potentiële elastische energie", "De energie die opgeslagen zit in een voorwerp dat vervormd is (samengedrukt, uitgerekt of gebogen) en zijn oorspronkelijke vorm probeert terug te krijgen.", "Een opgespannen veer bevat potentiële elastische energie."], ["de elektrische energie", "De energie die geleverd wordt door elektrische stroom of ladingen.", "De lamp brandt dankzij elektrische energie uit het stopcontact."], ["de potentiële gravitationele energie", "De energie die een voorwerp heeft dankzij zijn hoogte in het zwaartekrachtveld van de aarde.", "Hoe hoger je een voorwerp optilt, hoe groter zijn potentiële gravitationele energie."], ["de chemische energie", "De energie die opgeslagen zit in de chemische bindingen van stoffen, en die vrijkomt bij een chemische reactie.", "Bij het verbranden van hout komt de chemische energie vrij als warmte en licht."], ["de kernenergie", "De energie die vrijkomt bij veranderingen in de kern van een atoom.", "In een kerncentrale wordt kernenergie omgezet in elektrische energie."], ["de stralingsenergie", "De energie die door straling (zoals licht) wordt getransporteerd, zonder dat er materie nodig is als tussenpersoon.", "Zonnepanelen zetten de stralingsenergie van de zon om in elektrische energie."], ["het behoud van energie", "De wet die zegt dat de totale hoeveelheid energie in een geïsoleerd systeem altijd gelijk blijft; energie kan enkel van vorm veranderen.", "Dankzij het behoud van energie weten we dat energie die verdwijnt uit de ene vorm, ergens anders terug opduikt."], ["de energiebalans", "Een overzicht van alle vormen van energie die een systeem binnenkomen en verlaten.", "In de energiebalans van een auto zie je hoeveel energie naar beweging gaat en hoeveel er verloren gaat als warmte."], ["de energiedissipatie", "Het proces waarbij bruikbare energie (zoals kinetische of elektrische energie) wordt omgezet in warmte, die meestal niet meer nuttig gebruikt kan worden.", "Door wrijving treedt er energiedissipatie op, waardoor een fietser moet blijven trappen om op snelheid te blijven."], ["de energieopslag", "Het bewaren van energie in een bepaalde vorm, zodat ze later gebruikt kan worden.", "Een batterij is een vorm van energieopslag: ze bewaart elektrische energie voor later gebruik."]], "vragen": [{"t": "open", "dok": 2, "v": "Een bal van 0,50 kg ligt op 3,0 m hoogte. Bereken de gravitatie-energie. Hoe groot is de kinetische energie net voor hij de grond raakt (zonder wrijving)?", "a": "E_p = m · g · h = 0,50 · 9,81 · 3,0 = 14,7 J. Zonder wrijving wordt alles kinetische energie: E_k = 14,7 J."}, {"t": "open", "dok": 2, "v": "Is een gesloten thermosfles met warme thee een open, gesloten of geïsoleerd systeem? En een pot soep op het vuur zonder deksel?", "a": "Thermosfles: (bijna) geïsoleerd: geen massa en (bijna) geen energie gaat in of uit. Soep zonder deksel: open systeem: damp (massa) en warmte gaan eruit, energie komt erin."}, {"t": "open", "dok": 3, "v": "In een pompcentrale pompt men 's nachts water naar een hoog bekken en laat men het overdag terugstromen door turbines. Waarom is dat nuttig, hoewel je minder energie terugkrijgt dan je erin stak?", "a": "'s Nachts is er stroom over (lage vraag). Die elektrische energie wordt opgeslagen als gravitatie-energie van het water. Overdag, als de vraag groot is, wordt ze terug elektrische energie. Er gaat energie verloren (wrijving, warmte), maar je kan energie verschuiven naar het moment dat je ze nodig hebt."}, {"t": "mc", "dok": 3, "v": "Een tram vertrekt aan een halte en rijdt steeds sneller op een vlakke weg. Welke energieomzetting gebeurt vooral?", "o": ["kinetische energie → elektrische energie", "elektrische energie → kinetische energie (en warmte)", "gravitatie-energie → kinetische energie", "chemische energie → elektrische energie"], "j": 1, "u": "De motor zet elektrische energie om in kinetische energie. Een deel wordt warmte door wrijving."}, {"t": "mc", "dok": 3, "v": "Je verdubbelt de snelheid van een fiets. Wat gebeurt er met de kinetische energie?", "o": ["Ze verdubbelt.", "Ze wordt 4 keer zo groot.", "Ze blijft gelijk.", "Ze wordt de helft."], "j": 1, "u": "E_k = ½ · m · v². Verdubbelt v, dan wordt v² vier keer zo groot."}]}, {"id": "arbeid", "groep": "Fysica 4de jaar", "titel": "Arbeid en vermogen", "cursus": "cursus-arbeid-vermogen.html", "strat": "redenering", "opdr": "Leg uit wanneer een kracht arbeid levert en wanneer niet. Geef bij elk een voorbeeld. Leg daarna uit wat vermogen is, met een voorbeeld van twee toestellen.", "tool": ["energie-vermogen.html", "Energie, vermogen en rendement"], "oef": [[1, "Kar duwen"], [3, "Geen arbeid?"], [6, "De trap op"], [7, "Waterkoker"]], "rest": [[2, "Valies onder een hoek"], [4, "Kracht berekenen"], [5, "Arbeid-energietheorema"], [8, "Ledlamp"], [9, "De lift"], [10, "Tekenen: kracht ontbinden bij een valies"], [11, "Tekenen: een doos optillen en dragen"], [12, "Van pijlen naar zinnen"]], "extra": ["formuleredeneertool.html", "Oefen de formules omvormen"], "doelen": ["Ik kan het begrip arbeid geleverd door een kracht op een voorwerp omschrijven", "Ik kan de formule voor arbeid gebruiken en omvormen om de kracht en de verplaatsing te berekenen", "Ik kan de formule van het arbeid-energietheorema noteren en met een voorbeeld illustreren", "Ik kan het begrip vermogen omschrijven", "Ik kan de formule voor vermogen gebruiken en omvormen om het tijdsverloop en de hoeveelheid energie te berekenen"], "woorden": [["de arbeid", "De energie die wordt overgedragen op een voorwerp wanneer een kracht het voorwerp over een bepaalde afstand verplaatst.", "Als je een kast over de vloer duwt, verricht je arbeid op de kast."], ["het arbeid-energietheorema", "Het verband dat zegt dat de arbeid die op een voorwerp wordt verricht, gelijk is aan de verandering van zijn kinetische energie.", "Met het arbeid-energietheorema kan je berekenen hoe snel een voorwerp gaat na een bepaalde kracht."], ["het vermogen", "De hoeveelheid energie die per seconde wordt geleverd of omgezet.", "Een krachtige motor heeft een groot vermogen, omdat hij snel veel energie kan omzetten."], ["de watt", "De eenheid waarin vermogen wordt uitgedrukt. Symbool: W. 1 watt is gelijk aan 1 joule per seconde.", "Een lamp van 60 watt verbruikt 60 joule energie per seconde."], ["het rendement", "De verhouding tussen de nuttige energie die je uit een systeem haalt en de energie die je erin stopt, vaak uitgedrukt in procent.", "Een gloeilamp heeft een laag rendement, want het grootste deel van de energie gaat verloren als warmte."]], "vragen": [{"t": "open", "dok": 2, "v": "Je duwt een kar 15 m ver met een kracht van 40 N in de bewegingsrichting. Bereken de arbeid. Je doet het in 30 s: bereken het vermogen.", "a": "W = F · Δx = 40 N · 15 m = 600 J. P = W / t = 600 J / 30 s = 20 W."}, {"t": "open", "dok": 2, "v": "Een waterkoker van 2000 W werkt 3,0 minuten. Hoeveel elektrische energie zet hij om?", "a": "E = P · t = 2000 W · 180 s = 360 000 J = 360 kJ."}, {"t": "open", "dok": 3, "v": "Een leerling draagt zijn boekentas van 8 kg horizontaal 50 m ver door de gang. Zijn klasgenoot zegt: \"Hij levert geen arbeid op de boekentas.\" Klopt dat? Leg uit met de definitie van arbeid.", "a": "Ja, (bijna) geen arbeid op de boekentas. Hij oefent een kracht omhoog uit (om de tas te dragen), maar de verplaatsing is horizontaal: de kracht staat loodrecht op de verplaatsing, dus W = F · Δx · cos 90° = 0. Zijn spieren gebruiken wel energie, maar die wordt warmte."}, {"t": "mc", "dok": 3, "v": "Twee leerlingen lopen dezelfde trap op. Ze zijn even zwaar. Ali doet het in 10 s, Sara in 20 s. Welke uitspraak klopt?", "o": ["Ali levert meer arbeid.", "Ze leveren evenveel arbeid; Ali heeft het grootste vermogen.", "Ze leveren evenveel arbeid en hebben hetzelfde vermogen.", "Sara heeft het grootste vermogen, want ze werkt langer."], "j": 1, "u": "Arbeid = F · Δx: zelfde gewicht, zelfde hoogte. Vermogen = W / t: wie sneller is, heeft een groter vermogen."}, {"t": "mc", "dok": 3, "v": "Een bal valt. De zwaartekracht levert arbeid. Wat zegt het arbeid-energietheorema?", "o": ["De arbeid is gelijk aan de toename van de kinetische energie (zonder wrijving).", "De arbeid is altijd nul.", "De arbeid is gelijk aan het vermogen.", "De arbeid maakt de massa groter."], "j": 0, "u": "De arbeid van de resulterende kracht is gelijk aan de verandering van de kinetische energie."}]}, {"id": "ladingen", "groep": "Fysica 5de jaar", "titel": "Ladingen", "cursus": "cursus-ladingen.html", "strat": "schema", "opdr": "Teken een geleidende bol en een geladen staaf die in de buurt komt. Teken de ladingen in de bol (influentie). Teken ook wat er gebeurt als je de bol aardt.", "tool": ["ladingen.html#l5", "Ladingen · influentie en polarisatie"], "oef": [[2, "Kan dit?"], [4, "Contact"], [6, "Laden door influentie"], [7, "Polarisatie"]], "rest": [[1, "Elementaire lading"], [3, "Tribo-elektrische reeks"], [5, "Aarding"], [8, "Toepassingen"], [9, "Onweer boven Brussel"], [10, "Tekenen: aarding"], [11, "Tekenen: influentie"], [12, "Van pijlen naar zinnen"]], "extra": ["elektrostatica.html", "Oefen influentie in de tool Elektrostatische inductie"], "doelen": ["Ik kan Een atoom bestaat uit een kern met protonen en neutronen, en elektronen rond de kern", "Ik kan Gelijke ladingen stoten elkaar af, tegengestelde ladingen trekken elkaar aan", "Ik kan Machten van tien: 10⁻⁹ = 0,000 000 001 en het voorvoegsel nano (n) betekent 10⁻⁹"], "woorden": [["de elektrische lading", "Een eigenschap van een deeltje waardoor het andere deeltjes aantrekt of afstoot. Lading kan positief of negatief zijn.", "Een elektron heeft een negatieve elektrische lading."], ["de elementaire lading", "De kleinste hoeveelheid lading die bestaat. Elke lading is altijd een veelvoud van deze kleinste hoeveelheid.", "De lading van één elektron is gelijk aan één elementaire lading."], ["de geleider", "Een materiaal waarin ladingen (elektronen) vrij kunnen bewegen. Metalen zijn goede geleiders.", "Koper is een geleider, daarom gebruikt men het in elektrische snoeren."], ["de isolator", "Een materiaal waarin ladingen niet vrij kunnen bewegen. Plastic en glas zijn isolatoren.", "Het snoer is met plastic omhuld omdat plastic een isolator is."], ["de aarding", "Het verbinden van een voorwerp met de grond, zodat overtollige lading kan wegvloeien.", "Dankzij de aarding kan een teveel aan lading veilig wegvloeien naar de grond."]], "vragen": [{"t": "open", "dok": 2, "v": "Een voorwerp heeft een lading van −4,8 · 10⁻¹⁸ C. Heeft het elektronen te veel of te weinig? Hoeveel? (e = 1,6 · 10⁻¹⁹ C)", "a": "Negatief: elektronen te veel. n = 4,8 · 10⁻¹⁸ / 1,6 · 10⁻¹⁹ = 30 elektronen."}, {"t": "open", "dok": 2, "v": "Waarom kan je een metalen staaf die je in je hand houdt niet laden door wrijving, en een plastic staaf wel?", "a": "Metaal is een geleider: de lading stroomt via je hand (en je lichaam) weg naar de aarde. Plastic is een isolator: de lading blijft zitten waar ze ontstaat."}, {"t": "open", "dok": 3, "v": "Je brengt een negatief geladen staaf bij een neutrale metalen bol, zonder te raken. Je raakt de bol even met je vinger aan, haalt je vinger weg en daarna de staaf. Welke lading heeft de bol op het einde? Leg elke stap uit.", "a": "Door influentie gaan elektronen in de bol weg van de staaf, naar de andere kant. Via je vinger (aarding) stromen die elektronen weg. Je haalt eerst je vinger weg: de bol houdt elektronen te weinig. Daarna verdelen de ladingen zich: de bol is positief geladen."}, {"t": "mc", "dok": 3, "v": "Een geladen ballon blijft hangen aan een neutrale muur. Wat verklaart dat?", "o": ["De muur is ook geladen.", "De ballon polariseert de muur: tegengestelde ladingen komen dichter bij de ballon en trekken harder aan dan de gelijke ladingen afstoten.", "De ballon kleeft door wrijving.", "De muur geleidt de lading naar de aarde."], "j": 1, "u": "In een isolator verschuiven de ladingen een beetje (polarisatie). De aantrekkende ladingen zitten dichter bij de ballon, dus de aantrekking wint."}, {"t": "mc", "dok": 3, "v": "Je wrijft een glazen staaf met zijde. Het glas wordt positief. Wat gebeurt er met de zijde?", "o": ["Ze blijft neutraal.", "Ze wordt even sterk negatief geladen.", "Ze wordt ook positief.", "Ze krijgt protonen van het glas."], "j": 1, "u": "Bij wrijving gaan elektronen van het glas naar de zijde. Lading wordt niet gemaakt maar verplaatst: de zijde krijgt evenveel negatieve lading als het glas positieve."}]}, {"id": "coulomb", "groep": "Fysica 5de jaar", "titel": "Krachten tussen ladingen", "cursus": "cursus-coulomb.html", "strat": "schema", "opdr": "Teken drie ladingen op één lijn. Teken op de middelste lading de twee coulombkrachten, met het aangrijpingspunt op de lading. Teken de resulterende kracht.", "tool": ["krachten-op-ladingen.html", "Krachten op ladingen"], "oef": [[1, "Basis"], [3, "Redeneren"], [5, "Op één lijn"], [7, "Niet op één lijn"]], "rest": [[2, "Afstand berekenen"], [4, "Tegenstrijdig?"], [6, "Waar is de kracht nul?"], [8, "Twee ballonnen"], [9, "Tekenen: twee ladingen"], [10, "Tekenen: de resulterende kracht"], [11, "Van pijlen naar zinnen"]], "extra": ["krachten-op-ladingen.html", "Nieuwe oefeningen in de tool Krachten op ladingen"], "doelen": ["Ik kan Gelijke ladingen stoten elkaar af, tegengestelde ladingen trekken elkaar aan (hoofdstuk 1)", "Ik kan Een kracht is een vector: aangrijpingspunt, richting, zin en grootte. De kracht begint op het voorwerp waarop ze werkt", "Ik kan Krachten samenstellen: kop-staartmethode, parallellogrammethode en de stelling van Pythagoras", "Ik kan Voorvoegsels: μ (micro) = 10⁻⁶, n (nano) = 10⁻⁹, m (milli) = 10⁻³. Afstanden in m"], "woorden": [["de elektrische influentie", "Het verschijnsel waarbij een geladen voorwerp, zonder het aan te raken, ladingen in een nabije geleider laat verschuiven.", "Door elektrische influentie verschuiven de vrije elektronen in de geleider naar de kant het verst van het geladen voorwerp."], ["de polarisatie", "Het verschijnsel waarbij een geladen voorwerp de ladingen binnenin een isolator een heel klein beetje doet verschuiven, zonder dat ze echt kunnen bewegen.", "Door polarisatie wordt een klein stukje papier aangetrokken door een geladen voorwerp, ook al is papier een isolator."], ["de veldkracht", "De kracht die een veld (bijvoorbeeld een elektrisch veld) uitoefent op iets dat zich in dat veld bevindt.", "De veldkracht op de lading hangt af van hoe sterk het elektrisch veld is op die plaats."], ["de coulombkracht", "De aantrekkings- of afstotingskracht tussen twee elektrische ladingen.", "Twee positieve ladingen stoten elkaar af door de coulombkracht."]], "vragen": [{"t": "open", "dok": 2, "v": "Twee ladingen van 2,0 µC staan 0,30 m uit elkaar. Bereken de coulombkracht (k = 9,0 · 10⁹ N·m²/C²). Trekken ze aan of stoten ze af?", "a": "F = k · q₁ · q₂ / r² = 9,0 · 10⁹ · (2,0 · 10⁻⁶)² / 0,30² = 0,40 N. Gelijke ladingen: ze stoten af."}, {"t": "open", "dok": 2, "v": "Wat gebeurt er met de coulombkracht als je de afstand tussen twee ladingen verdubbelt? En als je één lading verdubbelt?", "a": "Afstand × 2 → kracht ÷ 4 (omgekeerd evenredig met r²). Eén lading × 2 → kracht × 2."}, {"t": "open", "dok": 3, "v": "Drie ladingen staan op één lijn: +q links, een proeflading in het midden, +4q rechts, met gelijke afstanden. Is de resulterende kracht op de middelste lading nul? Zo niet, waar zou je de middelste lading moeten zetten? Leg uit.", "a": "Niet nul: de lading +4q duwt vier keer harder. De kracht is nul waar k·q/x² = k·4q/(d−x)², dus waar d − x = 2x: op een derde van de afstand, vanaf de lading +q (dichter bij de kleinste lading)."}, {"t": "mc", "dok": 3, "v": "Twee ladingen trekken elkaar aan met 12 N. Je maakt de afstand 3 keer zo groot. Hoe groot wordt de kracht?", "o": ["4 N", "36 N", "1,3 N", "108 N"], "j": 2, "u": "F is omgekeerd evenredig met r²: 12 N / 9 ≈ 1,3 N."}, {"t": "mc", "dok": 3, "v": "Een kleine lading +q en een grote lading +10q stoten elkaar af. Welke uitspraak klopt?", "o": ["De grote lading oefent een 10 keer grotere kracht uit op de kleine dan omgekeerd.", "Beide krachten zijn even groot en tegengesteld.", "Alleen de grote lading oefent een kracht uit.", "De kleine lading oefent een grotere kracht uit."], "j": 1, "u": "In de formule staan q₁ en q₂ allebei: de kracht van A op B is even groot als die van B op A, met een tegengestelde zin (actie en reactie)."}]}, {"id": "veld", "groep": "Fysica 5de jaar", "titel": "Elektrisch veld", "cursus": "cursus-elektrisch-veld.html", "strat": "schema", "opdr": "Teken de veldlijnen van een positieve lading, een negatieve lading, twee tegengestelde ladingen en een homogeen veld tussen twee platen. Schrijf bij elke tekening één kenmerk van de veldlijnen.", "tool": ["elektrisch-veld.html", "Elektrisch veld"], "oef": [[1, "Veldsterkte meten"], [3, "Veld of kracht?"], [4, "Veldlijnen tekenen"], [5, "Geleidende bol"]], "rest": [[2, "Radiaal veld"], [6, "Brussel · regendruppel onder een onweerswolk"], [7, "Kooi van Faraday"], [8, "Veld op een veldlijn"], [9, "Tekenen: een homogeen veld"], [10, "Tekenen: een radiaal veld"], [11, "Van pijlen naar zinnen"]], "extra": ["elektrisch-veld.html", "Oefen in de tool Elektrisch veld"], "doelen": ["Ik kan De wet van Coulomb: F = k · |Q₁| · |Q₂| / r² (hoofdstuk 2)", "Ik kan Geleiders hebben vrije elektronen; in isolatoren treedt polarisatie op (hoofdstuk 1)", "Ik kan Het zwaarteveld: elke massa ondervindt bij het aardoppervlak een kracht F = m · g, met g = 9,81 N/kg"], "woorden": [["het elektrisch veld", "De ruimte rond een geladen voorwerp waarin een andere lading een kracht ondervindt.", "Rond elke geladen bol bevindt zich een elektrisch veld."], ["de elektrische veldsterkte", "Een maat voor hoe sterk het elektrisch veld is op een bepaalde plaats: de kracht die er werkt per eenheid van lading.", "Hoe dichter bij de lading, hoe groter de elektrische veldsterkte."], ["de elektrische veldlijn", "Een denkbeeldige lijn die toont in welke richting een positieve lading een kracht zou ondervinden in een elektrisch veld.", "De elektrische veldlijnen lopen van de positieve naar de negatieve lading."], ["het radiaal veld", "Het elektrisch veld rond één puntlading, waarbij de veldlijnen recht van (of naar) dat punt weglopen, zoals de stralen van een zon.", "Rond een enkele geladen bol krijg je een radiaal veld."], ["het dipool veld", "Het elektrisch veld rond twee tegengestelde ladingen die dicht bij elkaar liggen.", "Tussen een positieve en een negatieve lading naast elkaar ontstaat een dipool veld."], ["het homogeen veld", "Een elektrisch veld waarbij de veldlijnen evenwijdig lopen en overal even ver van elkaar liggen, zodat de veldsterkte overal gelijk is.", "Tussen twee evenwijdige, tegengesteld geladen platen ontstaat een homogeen veld."]], "vragen": [{"t": "open", "dok": 2, "v": "In een punt werkt een kracht van 0,012 N op een proeflading van 3,0 µC. Bereken de elektrische veldsterkte.", "a": "E = F / q = 0,012 N / 3,0 · 10⁻⁶ C = 4000 N/C."}, {"t": "open", "dok": 2, "v": "Noem drie kenmerken van elektrische veldlijnen.", "a": "Ze vertrekken bij + en eindigen bij −. Ze snijden elkaar nooit. Hoe dichter bij elkaar, hoe sterker het veld. De raaklijn geeft de richting van het veld."}, {"t": "open", "dok": 3, "v": "Je zit in een auto tijdens onweer aan de Ring van Brussel. Waarom ben je veilig? Gebruik het gedrag van een geleider in een elektrisch veld.", "a": "De metalen carrosserie is een geleider die je omringt: een kooi van Faraday. De ladingen verplaatsen zich in het metaal tot het veld binnenin nul is. Een blikseminslag loopt via de buitenkant naar de grond."}, {"t": "mc", "dok": 3, "v": "Je verdubbelt de proeflading in een punt van een elektrisch veld. Wat gebeurt er?", "o": ["De veldsterkte verdubbelt.", "De kracht verdubbelt, de veldsterkte blijft gelijk.", "De kracht blijft gelijk.", "De veldsterkte halveert."], "j": 1, "u": "E hangt af van de bronlading en de plaats, niet van de proeflading. F = q · E verdubbelt."}, {"t": "mc", "dok": 3, "v": "Tussen twee evenwijdige geladen platen is het veld homogeen. Wat betekent dat?", "o": ["Het veld is overal even sterk en heeft overal dezelfde richting.", "Het veld is nul tussen de platen.", "Het veld is het sterkst in het midden.", "De veldlijnen lopen in cirkels."], "j": 0, "u": "Homogeen veld: evenwijdige veldlijnen op gelijke afstand, overal dezelfde grootte, richting en zin."}]}, {"id": "potentiaal", "groep": "Fysica 5de jaar", "titel": "Potentiaal", "cursus": "cursus-potentiaal.html", "strat": "redenering", "opdr": "Leg de vergelijking uit tussen een massa in het zwaarteveld en een lading in een homogeen elektrisch veld. Wat is potentiële energie, wat is potentiaal, wat is spanning? Gebruik een tabel met twee kolommen.", "tool": ["potentiaal.html", "Potentiaal"], "oef": [[1, "Potentiële energie"], [2, "Potentiaal"], [4, "Energie en snelheid"], [5, "Tekens"]], "rest": [[3, "Grafieken"], [6, "Brussel · de metro"], [7, "Analogie"], [8, "Arbeid van het veld"], [9, "Tekenen: equipotentiaalvlakken"], [10, "Tekenen: een elektron en een proton tussen de platen"], [11, "Van pijlen naar zinnen"]], "extra": ["formuleredeneertool.html", "Oefen de formules omvormen"], "doelen": ["Ik kan Potentiële gravitationele energie: E<sub>pot</sub> = m·g·h; kinetische energie: E<sub>kin</sub> = ½·m·v²", "Ik kan Arbeid: W = F·s als kracht en verplaatsing dezelfde zin hebben", "Ik kan Behoud van energie: valt een voorwerp, dan wordt potentiële energie omgezet in kinetische energie", "Ik kan Homogeen veld tussen twee platen; F = |q|·E (hoofdstuk 3)"], "woorden": [["de potentiële elektrische energie", "De energie die een lading heeft dankzij de plaats waar ze zich bevindt in een elektrisch veld.", "Hoe dichter je twee gelijke ladingen bij elkaar brengt, hoe groter hun potentiële elektrische energie wordt."], ["de elektrische potentiaal", "De potentiële elektrische energie die één eenheid van lading zou hebben op een bepaalde plaats.", "De elektrische potentiaal is het hoogst dichtbij een positieve lading."], ["de elektrische spanning", "Het verschil in elektrische potentiaal tussen twee punten.", "De elektrische spanning tussen de twee polen van de batterij bedraagt 1,5 volt."]], "vragen": [{"t": "open", "dok": 2, "v": "Een lading van 2,0 µC verplaatst zich tussen twee punten met een spanning van 150 V. Hoeveel verandert haar potentiële energie?", "a": "ΔE_p = q · U = 2,0 · 10⁻⁶ C · 150 V = 3,0 · 10⁻⁴ J."}, {"t": "open", "dok": 2, "v": "Wat is het verschil tussen potentiële elektrische energie en potentiaal?", "a": "Potentiële energie (J) hangt af van de lading die er staat. Potentiaal (V) is de potentiële energie per coulomb: V = E_p / q. Die hangt alleen af van de plaats in het veld."}, {"t": "open", "dok": 3, "v": "Vergelijk een massa die valt in het zwaarteveld met een positieve lading die vrij beweegt in een homogeen elektrisch veld. Wat komt overeen met de hoogte, met g en met m?", "a": "Hoogte ↔ positie ten opzichte van de negatieve plaat (potentiaal). g ↔ E (veldsterkte). m ↔ q. De massa valt naar lage hoogte; de positieve lading beweegt naar lage potentiaal. In beide gevallen wordt potentiële energie kinetische energie."}, {"t": "mc", "dok": 3, "v": "Een elektron wordt versneld over een spanning van 1 V. Hoeveel energie krijgt het?", "o": ["1 J", "1 eV = 1,6 · 10⁻¹⁹ J", "1,6 · 10⁻¹⁹ eV", "1 V"], "j": 1, "u": "Per definitie is 1 eV de energie die een elementaire lading krijgt over 1 V: 1,6 · 10⁻¹⁹ J."}, {"t": "mc", "dok": 3, "v": "Je beweegt een lading langs een equipotentiaalvlak. Hoeveel arbeid levert de elektrische kracht?", "o": ["Nul, want de potentiaal verandert niet.", "Evenveel als bij een verplaatsing langs een veldlijn.", "Altijd positief.", "Het hangt af van de snelheid."], "j": 0, "u": "Op een equipotentiaalvlak is de potentiaal overal gelijk: U = 0, dus W = q · U = 0. De kracht staat loodrecht op de verplaatsing."}]}, {"id": "schakelingen", "groep": "Fysica 5de jaar", "titel": "Gemengde schakelingen", "cursus": "cursus-schakelingen.html", "strat": "elkaar", "opdr": "Teken de schakeling R1 + (R2 // R3) met U = 12 V, R1 = 4 Ω, R2 = 6 Ω en R3 = 12 Ω. Los ze stap voor stap op met het stappenplan: eerst van binnen naar buiten, dan van buiten naar binnen. Controleer aan het einde of de stromen en spanningen kloppen.", "tool": ["schakelingen.html#gemengd", "Gemengde schakelingen · stap voor stap"], "oef": [[2, "Serie"], [3, "Parallel"], [4, "Gemengd: (R₁ + R₂) // R₃"], [7, "Redeneren: een lamp erbij"]], "rest": [[1, "Wet van Ohm"], [5, "Gemengd: R₁ + (R₂ // (R₃ + R₄))"], [6, "Gemengd: (R₁ // R₂) + (R₃ // R₄)"], [8, "Brussel · de kerstverlichting"], [9, "Tekenen: een schakelschema"], [10, "Tekenen: twee takken met elk twee weerstanden"], [11, "Van pijlen naar zinnen"]], "extra": ["schakelingen.html#oefenen", "Nieuwe opgaven in de tool"], "doelen": ["Ik kan de wet van Ohm kennen en gebruiken in oefeningen over gemengde schakelingen", "Ik kan de formules van de substitutieweerstand gebruiken om de substitutieweerstand van een gemengde schakeling te bepalen", "Ik kan de formules van de stroom- en spanningsverdeling bij serie- en parallelschakelingen gebruiken om U, I en R te bepalen van weerstanden in een gemengde schakeling"], "woorden": [["de wet van Ohm", "Bij een ohmse weerstand is de spanning gelijk aan weerstand maal stroomsterkte: U = R · I.", "Met de wet van Ohm bereken je de stroom door een weerstand."], ["de serieschakeling", "Onderdelen staan na elkaar: overal loopt dezelfde stroom.", "In een serieschakeling verdeelt de spanning zich over de weerstanden."], ["de parallelschakeling", "Onderdelen staan in aparte takken naast elkaar: over elke tak staat dezelfde spanning.", "De toestellen in huis staan in een parallelschakeling."], ["de substitutieweerstand", "De ene weerstand die een groep weerstanden kan vervangen zonder dat de stroom uit de bron verandert.", "De substitutieweerstand van twee parallelle weerstanden is kleiner dan de kleinste."], ["de gemengde schakeling", "Een schakeling met zowel serie- als paralleldelen.", "Een gemengde schakeling los je op van binnen naar buiten."]], "vragen": [{"t": "open", "dok": 2, "v": "Twee weerstanden van 10 Ω en 15 Ω staan in serie op 10 V. Bereken de stroom en de spanning over elke weerstand.", "a": "R_s = 25 Ω; I = 10 / 25 = 0,40 A; U₁ = 10 · 0,40 = 4,0 V; U₂ = 15 · 0,40 = 6,0 V."}, {"t": "open", "dok": 2, "v": "Drie weerstanden van 30 Ω staan parallel. Bereken de substitutieweerstand. Hoeveel stroom loopt er uit een bron van 6,0 V?", "a": "1/R_s = 3/30, dus R_s = 10 Ω. I = 6,0 / 10 = 0,60 A (0,20 A per tak)."}, {"t": "open", "dok": 3, "v": "In een schakeling R1 + (R2 // R3) wordt R3 vervangen door een draad zonder weerstand (kortsluiting). Voorspel wat er gebeurt met de stroom door R1 en door R2. Verantwoord.", "a": "Het paralleldeel wordt 0 Ω: de stroom kiest de weg zonder weerstand. Door R2 loopt dan geen stroom meer. R_s wordt alleen R1, dus kleiner: de stroom door R1 wordt groter, en over R1 staat nu de volle bronspanning."}, {"t": "mc", "dok": 3, "v": "Je zet een extra weerstand parallel over een weerstand die al in de schakeling staat. Wat gebeurt er altijd met de substitutieweerstand van dat deel?", "o": ["Ze wordt groter.", "Ze wordt kleiner.", "Ze blijft gelijk.", "Dat hangt af van de bronspanning."], "j": 1, "u": "Een extra tak is een extra weg voor de stroom: de substitutieweerstand van het paralleldeel daalt, onafhankelijk van de spanning."}, {"t": "mc", "dok": 3, "v": "In een serieschakeling van 2 Ω en 8 Ω op 10 V: over welke weerstand staat de grootste spanning?", "o": ["over 2 Ω, want daar is de stroom het grootst", "over 8 Ω, want de stroom is overal gelijk en U = R · I", "over allebei 5 V", "dat kan je niet weten zonder ampèremeter"], "j": 1, "u": "In serie is I overal gelijk (1 A). U = R · I: 2 V over 2 Ω en 8 V over 8 Ω."}]}, {"id": "water-planten", "groep": "Biologie 3de jaar", "titel": "Waterhuishouding in planten", "cursus": "cursus-waterhuishouding-planten.html", "strat": "schema", "opdr": "Teken een plant met wortel, stengel en blad. Teken met pijlen de weg van het water (houtvaten, opwaarts) en van de assimilaten (zeefvaten). Schrijf bij elk deel welk weefsel het werk doet.", "tool": ["biologie-prikkels.html#p6", "Water, prikkels en reacties · transport"], "oef": [[2, "Het blad"], [5, "Welk weefsel?"], [7, "Huidmondjes: juist of fout?"], [8, "Transport in de plant"]], "rest": [[1, "Plantenorganen"], [3, "De stengel"], [4, "De wortel"], [6, "Tekenen: houtvaten en zeefvaten"], [9, "Assimilaten"], [10, "Feedback"], [11, "Van pijlen naar zinnen"]], "extra": ["biologie-prikkels.html#p2", "Oefen de weefsels in de tool"], "doelen": ["Ik kan uitleggen wat waterhuishouding bij planten inhoudt", "Ik kan wortel, stengel, blad en bloem benoemen als plantenorganen", "Ik kan de plantenweefsels deelweefsel, vaatbundels, dekweefsel, huidmondjes, houtvaten, zeefvaten, sluitcellen, cellen van het vulweefsel en cortex benoemen, herkennen en hun functie geven", "Ik kan uitleggen hoe de gasuitwisseling via de huidmondjes gebeurt, met de woorden vacuole, turgor en openen of sluiten", "Ik kan verwoorden dat assimilaten (eindproducten van de fotosynthese) bestaan uit glucose, zetmeel, eiwitten en vetten", "Ik kan uitleggen hoe het water- en assimilatentransport verloopt, met de woorden wortelhaartjes, houtvaten, zeefvaten, huidmondjes en opwaarts en neerwaarts transport", "Ik kan tekeningen maken van houtvaten, zeefvaten en deelweefsel in stengel en wortel", "Ik kan uitleggen hoe de plant haar waterhuishouding in evenwicht houdt met een negatief feedbacksysteem"], "woorden": [["het systeem", "Een geheel van onderdelen die op elkaar inwerken en samen een functie vervullen.", "Het menselijk lichaam is een systeem waarin allerlei processen op elkaar inspelen."], ["de prikkel", "Een verandering in de omgeving of in het lichaam die een reactie kan uitlokken.", "Een daling van de temperatuur is een prikkel waarop het lichaam kan reageren."], ["de homeostase", "Het in stand houden van een stabiele interne toestand, ondanks veranderingen in de omgeving.", "Dankzij homeostase blijft de lichaamstemperatuur van een mens vrij constant."], ["het feedbacksysteem", "Een systeem waarbij het resultaat van een proces teruggekoppeld wordt om dat proces bij te sturen.", "Een feedbacksysteem zorgt ervoor dat een verstoring van de homeostase weer wordt hersteld."], ["het negatief feedbacksysteem", "Een feedbacksysteem waarbij de reactie de oorspronkelijke verandering tegenwerkt, zodat het evenwicht hersteld wordt.", "Bij een negatief feedbacksysteem zorgt een stijging voor een reactie die de waarde weer doet dalen."], ["het positief feedbacksysteem", "Een feedbacksysteem waarbij de reactie de oorspronkelijke verandering juist versterkt.", "Bij een positief feedbacksysteem zorgt een kleine verandering voor een steeds grotere verandering in dezelfde richting."], ["het waslaagje", "Een laagje was op het dekweefsel van een blad, dat waterverlies door verdamping tegengaat.", "Het waslaagje zorgt ervoor dat een blad niet te snel uitdroogt."], ["het huidmondje", "Een kleine opening in het dekweefsel van een blad waarlangs gassen (zoals CO2, O2 en waterdamp) uitgewisseld worden.", "Via de huidmondjes neemt het blad CO2 op voor de fotosynthese."], ["de turgor", "De stevigheid/spanning van een plantencel doordat de celinhoud tegen de celwand duwt.", "Bij voldoende turgor staat een plant stevig recht."], ["het vulweefsel", "Een weefsel opgebouwd uit min of meer ronde cellen, dat de ruimtes tussen andere weefsels opvult.", "Het vulweefsel vormt de vulling van het blad tussen de nerven."], ["het deelweefsel", "Een weefsel met cellen die zich nog kunnen delen, waardoor de plant kan groeien.", "Het deelweefsel aan de top van de wortel zorgt voor de lengtegroei."], ["het dekweefsel", "De buitenste cellaag van een plantenorgaan, die het orgaan beschermt.", "Het dekweefsel van het blad is langs de buitenkant bedekt met een waslaagje."], ["de waterhuishouding", "Het geheel van opname, transport en afgifte van water in een plant.", "Bij droogte raakt de waterhuishouding van een plant verstoord."], ["de wortelhaartjes", "Kleine uitstulpingen van wortelcellen die het opnemend oppervlak van de wortel vergroten.", "Via de wortelhaartjes neemt de plant water en mineralen op uit de bodem."], ["het wortelmutsje", "Een beschermend laagje cellen aan de top van de wortel, dat het delend weefsel eronder beschermt.", "Het wortelmutsje beschermt de wortel wanneer die door de bodem groeit."], ["de cortex", "De schorslaag van de wortel of stengel, gelegen tussen het dekweefsel en de centrale cilinder.", "Water beweegt door de cortex op weg naar de vaatbundels."], ["de vaatbundel", "Een bundel van transportweefsel (houtvaten en zeefvaten samen) in een plant.", "Doorheen de vaatbundel worden water en voedingsstoffen doorheen de plant vervoerd."], ["het houtvat", "Een buisvormig weefsel dat water en opgeloste mineralen van de wortel naar de rest van de plant transporteert.", "Via de houtvaten stijgt water op van de wortel naar de bladeren."], ["het zeefvat", "Een buisvormig weefsel dat assimilaten (voedingsstoffen) doorheen de plant transporteert.", "Via de zeefvaten worden de suikers uit het blad naar de rest van de plant vervoerd."], ["de assimilaten", "De voedingsstoffen (vooral suikers) die de plant zelf aanmaakt via fotosynthese.", "De assimilaten uit het blad worden via de zeefvaten naar de wortel getransporteerd."]], "vragen": [{"t": "open", "dok": 2, "v": "Wat is het verschil tussen houtvaten en zeefvaten? Noem voor elk wat ze vervoeren en in welke richting.", "a": "Houtvaten: water en mineralen, van de wortel omhoog (opwaarts). Zeefvaten: assimilaten (o.a. suikers), vanuit het blad naar de rest van de plant (vooral neerwaarts)."}, {"t": "open", "dok": 2, "v": "Waarom heeft een blad een waslaagje op het dekweefsel?", "a": "Het waslaagje laat bijna geen water door: zo verdampt er weinig water via het oppervlak van het blad."}, {"t": "open", "dok": 3, "v": "Op een hete, droge dag sluiten de huidmondjes. Leg uit hoe dat gebeurt (vacuole, turgor) en waarom dat de plant helpt. Wat is het nadeel?", "a": "Bij watertekort verliezen de sluitcellen water: hun vacuole krimpt, de turgor daalt en de sluitcellen worden slap, waardoor het huidmondje sluit. De plant verliest zo minder water. Nadeel: er komt ook minder CO₂ binnen, dus de fotosynthese vertraagt."}, {"t": "mc", "dok": 3, "v": "Je zet een witte bloem in water met blauwe kleurstof. Na een dag zijn de nerven van de bloemblaadjes blauw. Welke weefsels transporteerden de kleurstof?", "o": ["zeefvaten", "houtvaten", "sluitcellen", "het waslaagje"], "j": 1, "u": "Water met opgeloste stoffen gaat van onder naar boven via de houtvaten."}, {"t": "mc", "dok": 3, "v": "Een plant verliest water via de huidmondjes. Wat is het gevolg voor het transport in de plant?", "o": ["Het transport van water stopt.", "Er wordt water opgezogen door de houtvaten, van de wortel naar het blad.", "Water gaat via de zeefvaten naar beneden.", "De wortels geven water af aan de grond."], "j": 1, "u": "Het verdampen van water in het blad zorgt ervoor dat water via de houtvaten van onder naar boven wordt aangevoerd."}]}, {"id": "bio-homeostase", "groep": "Biologie 3de jaar", "titel": "Homeostase en feedbacksystemen", "cursus": "cursus-homeostase.html", "strat": "schema", "opdr": "Teken het schema prikkel → receptor → verwerking → effector → effect voor zweten bij warmte. Teken daarna een grafiek van negatieve feedback (lichaamstemperatuur) en een grafiek van positieve feedback (bevalling).", "tool": ["biologie-prikkels.html#f2", "Water, prikkels en reacties · feedback"], "oef": [[1, "Intern of extern milieu?"], [3, "Definities"], [5, "Negatief of positief?"], [6, "Redeneren: waarom negatief?"]], "rest": [[2, "Het schema invullen"], [4, "Grafiek tekenen"], [7, "Redeneren: de thermostaat"], [8, "Van pijlen naar zinnen"]], "extra": ["biologie-prikkels.html#f1", "Oefen: intern of extern milieu"], "doelen": ["Ik kan verwoorden dat planten en dieren als een systeem werken: ze vangen prikkels op, verwerken ze en reageren erop", "Ik kan de definitie van prikkel noteren en 4 voorbeelden geven uit het intern of het extern milieu", "Ik kan de definitie van homeostase noteren en 3 voorbeelden in ons lichaam geven", "Ik kan een feedbacksysteem schematisch en in eigen woorden voorstellen", "Ik kan uitleggen hoe een negatief en een positief feedbacksysteem werken en er een grafiek van tekenen", "Ik kan 3 voorbeelden van feedbacksystemen bij planten en dieren geven"], "woorden": [["het systeem", "Een geheel van onderdelen die op elkaar inwerken en samen een functie vervullen.", "Het menselijk lichaam is een systeem waarin allerlei processen op elkaar inspelen."], ["de prikkel", "Een verandering in de omgeving of in het lichaam die een reactie kan uitlokken.", "Een daling van de temperatuur is een prikkel waarop het lichaam kan reageren."], ["de homeostase", "Het in stand houden van een stabiele interne toestand, ondanks veranderingen in de omgeving.", "Dankzij homeostase blijft de lichaamstemperatuur van een mens vrij constant."], ["het feedbacksysteem", "Een systeem waarbij het resultaat van een proces teruggekoppeld wordt om dat proces bij te sturen.", "Een feedbacksysteem zorgt ervoor dat een verstoring van de homeostase weer wordt hersteld."], ["het negatief feedbacksysteem", "Een feedbacksysteem waarbij de reactie de oorspronkelijke verandering tegenwerkt, zodat het evenwicht hersteld wordt.", "Bij een negatief feedbacksysteem zorgt een stijging voor een reactie die de waarde weer doet dalen."], ["het positief feedbacksysteem", "Een feedbacksysteem waarbij de reactie de oorspronkelijke verandering juist versterkt.", "Bij een positief feedbacksysteem zorgt een kleine verandering voor een steeds grotere verandering in dezelfde richting."]], "vragen": [{"t": "open", "dok": 2, "v": "Geef 2 prikkels uit het extern milieu en 2 uit het intern milieu. Noem bij elke prikkel een reactie.", "a": "Extern: fel licht → de pupil wordt kleiner; kou → rillen. Intern: te weinig water → dorst; veel suiker in het bloed na het eten → de alvleesklier maakt insuline. Andere juiste voorbeelden zijn ook goed."}, {"t": "open", "dok": 2, "v": "Wat is het verschil tussen een negatief en een positief feedbacksysteem? Geef van elk een voorbeeld.", "a": "Negatief: de reactie werkt de verandering tegen, de waarde gaat terug naar de norm (bv. zweten bij warmte). Positief: de reactie versterkt de verandering, tot iets het stopt (bv. weeën bij een bevalling)."}, {"t": "open", "dok": 3, "v": "Iemand heeft hoge koorts (40 °C) en zweet niet meer. Waarom is dat gevaarlijk? Gebruik de woorden homeostase en negatieve feedback.", "a": "Zweten is de reactie van een negatief feedbacksysteem dat de temperatuur doet dalen. Als dat niet meer werkt, wordt de verandering niet tegengewerkt: de temperatuur kan verder stijgen. De homeostase is verstoord en organen kunnen beschadigd raken."}, {"t": "mc", "dok": 3, "v": "Na een maaltijd stijgt de suiker in je bloed. De alvleesklier maakt insuline en de suiker daalt weer. Wat is dit?", "o": ["positieve feedback, want er wordt een stof gemaakt", "negatieve feedback, want de reactie werkt de stijging tegen", "geen feedback, want suiker is geen prikkel", "positieve feedback, want de suiker verandert"], "j": 1, "u": "De reactie (insuline) zorgt dat de waarde terugkeert naar de norm: dat is negatieve feedback en zorgt voor homeostase."}, {"t": "mc", "dok": 3, "v": "Welke grafiek past bij homeostase?", "o": ["een lijn die steeds steiler stijgt", "een lijn die schommelt rond een normwaarde, tussen twee grenzen", "een rechte horizontale lijn die nooit verandert", "een lijn die naar nul daalt"], "j": 1, "u": "Homeostase is een dynamisch evenwicht: de waarde schommelt een beetje, maar blijft tussen de onder- en bovengrens."}]}, {"id": "bio-receptoren", "groep": "Biologie 3de jaar", "titel": "Receptoren bij de mens", "cursus": "cursus-receptoren.html", "strat": "toets", "opdr": "Schrijf met je cursus dicht de 5 soorten receptoren op, met de prikkel en een voorbeeld. Schrijf daarna de definitie van prikkeldrempel, prikkelgewenning en prikkelfilter, met telkens een voorbeeld. Kijk na en verbeter in het groen.", "tool": ["biologie-prikkels.html#r1", "Water, prikkels en reacties · receptoren"], "oef": [[1, "Welke receptor?"], [3, "Drempel of gewenning?"], [5, "Redeneren: gasgeur"], [6, "Redeneren: verschil"]], "rest": [[2, "Definities"], [4, "Grafiek lezen"], [7, "Van pijlen naar zinnen"]], "extra": ["biologie-prikkels.html#r2", "Experimenteer met de prikkeldrempel"], "doelen": ["Ik kan uitleggen welke receptoren welke prikkels opvangen en omzetten: foto-, mechano-, thermo-, chemo- en pijnreceptoren", "Ik kan met 2 voorbeelden uitleggen wat een prikkeldrempel is", "Ik kan met 2 voorbeelden uitleggen wat prikkelgewenning is en wat het effect is op de prikkeldrempel", "Ik kan uitleggen wat een prikkelfilter is"], "woorden": [["de prikkel", "Een verandering in de omgeving of in het lichaam die een reactie kan uitlokken.", "Een daling van de temperatuur is een prikkel waarop het lichaam kan reageren."], ["de receptor", "Een cel of orgaan dat gevoelig is voor een bepaalde prikkel en die kan omzetten in een zenuwsignaal.", "Je oog bevat receptoren die gevoelig zijn voor licht."], ["de mechanoreceptor", "Een receptor die gevoelig is voor mechanische prikkels, zoals druk, aanraking of trilling.", "In je huid zitten mechanoreceptoren die aanraking waarnemen."], ["de thermoreceptor", "Een receptor die gevoelig is voor temperatuur.", "Dankzij thermoreceptoren in je huid voel je of iets warm of koud is."], ["de chemoreceptor", "Een receptor die gevoelig is voor chemische stoffen.", "In je neus en tong zitten chemoreceptoren die geur- en smaakstoffen waarnemen."], ["de pijnreceptor", "Een receptor die gevoelig is voor prikkels die weefselschade kunnen veroorzaken.", "Pijnreceptoren in je huid waarschuwen je wanneer je jezelf verbrandt."], ["de prikkeldrempelwaarde", "De minimale sterkte die een prikkel moet hebben om door een receptor waargenomen te worden.", "Een zeer zwakke prikkel ligt onder de prikkeldrempelwaarde en wordt niet opgemerkt."], ["de prikkelgewenning", "Het verschijnsel waarbij een receptor minder gevoelig wordt voor een prikkel die lang aanhoudt.", "Door prikkelgewenning merk je na een tijdje de geur in een ruimte niet meer op."], ["de prikkelfilter", "Het proces waarbij de hersenen bepaalde prikkels bewust negeren, zodat je je kan concentreren op belangrijkere informatie.", "Dankzij een prikkelfilter hoor je het getik van de klok meestal niet meer."]], "vragen": [{"t": "open", "dok": 2, "v": "Welke receptoren gebruik je als je een warme, geurige pizza eet? Noem minstens drie soorten, met de prikkel.", "a": "Thermoreceptoren (warmte), chemoreceptoren (geur en smaak), mechanoreceptoren (de pizza in je mond voelen), fotoreceptoren (de pizza zien)."}, {"t": "open", "dok": 2, "v": "Wat is de prikkeldrempel? Leg uit met een voorbeeld waarom je een prikkel soms niet waarneemt.", "a": "De kleinste sterkte van een prikkel die een impuls geeft. Een heel zacht geluid (bv. een fluisterende klasgenoot achteraan) is zwakker dan de drempel: er komt geen impuls, je hoort het niet."}, {"t": "open", "dok": 3, "v": "Een bakker ruikt de geur van vers brood niet meer, maar klanten ruiken het meteen. Leg uit waarom. Gaat het om prikkelgewenning of de prikkelfilter? Verantwoord.", "a": "Prikkelgewenning: de bakker staat de hele dag in de geur. Zijn chemoreceptoren wennen eraan en de prikkeldrempel stijgt. De klanten komen net binnen: voor hen is de drempel nog laag. Het gebeurt in de receptor, niet in de hersenen, dus het is geen prikkelfilter."}, {"t": "mc", "dok": 3, "v": "Je zet je bril op en voelt die na een paar minuten niet meer. Wat is er gebeurd?", "o": ["De bril oefent geen kracht meer uit.", "De prikkeldrempel van de mechanoreceptoren is gestegen.", "De prikkeldrempel is gedaald.", "Je pijnreceptoren zijn beschadigd."], "j": 1, "u": "Bij prikkelgewenning stijgt de drempel: dezelfde prikkel geeft geen impuls meer."}, {"t": "mc", "dok": 3, "v": "Je studeert in de bib en hoort de airco niet meer, maar wel meteen je gsm trillen. Wat verklaart dit het best?", "o": ["De gsm is luider dan de airco.", "De prikkelfilter: je hersenen laten alleen belangrijke impulsen door tot je bewustzijn.", "Je hebt geen mechanoreceptoren voor de airco.", "De prikkeldrempel voor de gsm is hoger."], "j": 1, "u": "Beide geluiden geven impulsen, maar je hersenen filteren het onbelangrijke geluid weg."}]}, {"id": "bio-oog", "groep": "Biologie 3de jaar", "titel": "Bouw en werking van het oog", "cursus": "cursus-oog.html", "strat": "schema", "opdr": "Teken een doorsnede van het oog en schrijf de namen van de delen erbij. Teken met pijlen de weg van het licht tot op het netvlies. Schrijf bij 4 delen de functie.", "tool": ["biologie-prikkels.html#r3", "Water, prikkels en reacties · bouw van het oog"], "oef": [[1, "Delen van het oog"], [3, "De weg van het licht"], [5, "Staafje of kegeltje?"], [6, "Redeneren: een ster zien"]], "rest": [[2, "Functies"], [4, "Het netvlies"], [7, "Redeneren: optische illusie"], [8, "Kleuren zien"], [9, "Van pijlen naar zinnen"]], "extra": ["biologie-prikkels.html#r5", "Oefen: staafje of kegeltje"], "doelen": ["Ik kan de inwendige delen van het oog benoemen, herkennen en hun functie geven", "Ik kan de delen van het netvlies benoemen en herkennen: zenuwcellen, fotoreceptoren, pigmentcellen", "Ik kan op tekeningen de weg van het licht in het oog aanduiden", "Ik kan staafjes en kegeltjes vergelijken: vorm, aantal, plaats, waarneming en werking", "Ik kan uitleggen hoe de fotoreceptoren beelden en kleuren opvangen", "Ik kan uitleggen dat het beeld in de hersenen verwerkt wordt en wat een optische illusie is"], "woorden": [["de pupilreflex", "De automatische aanpassing van de grootte van de pupil aan de hoeveelheid licht.", "Bij fel licht zorgt de pupilreflex ervoor dat je pupil kleiner wordt."], ["de iris", "Het gekleurde, ringvormige deel van het oog dat de grootte van de pupil regelt.", "De iris bepaalt de oogkleur en regelt hoeveel licht er binnenvalt."], ["het harde oogvlies", "De stevige, witte buitenste laag van de oogbol die het oog zijn vorm geeft en beschermt.", "Het harde oogvlies noemen we ook wel het 'wit van het oog'."], ["het hoornvlies", "Het doorzichtige voorste deel van het harde oogvlies, waardoor het licht het oog binnenkomt.", "Het hoornvlies breekt het licht al voordat het de ooglens bereikt."], ["de oogspier", "Een spier die het oog kan bewegen of laten draaien in de oogkas.", "Dankzij de oogspieren kan je je ogen naar links en rechts bewegen."], ["het glasachtig lichaam", "De doorzichtige, gelei-achtige massa die de ruimte achter de ooglens opvult en de vorm van het oog mee bepaalt.", "Het glasachtig lichaam zorgt ervoor dat de oogbol zijn ronde vorm behoudt."], ["het oogvocht", "De heldere vloeistof tussen het hoornvlies en de ooglens.", "Het oogvocht voedt het hoornvlies, dat zelf geen bloedvaten heeft."], ["de ooglens", "Het doorzichtige, bolle onderdeel van het oog dat het licht verder breekt en scherpstelt op het netvlies.", "De ooglens kan van vorm veranderen om zowel dichtbij als veraf scherp te zien."], ["het netvlies", "De binnenste laag van het oog met de fotoreceptoren, waarop het beeld scherpgesteld wordt.", "Op het netvlies ontstaat een omgekeerd beeld van wat je bekijkt."], ["het vaatvlies", "De middelste laag van het oog, rijk aan bloedvaten, die het netvlies van voedingsstoffen voorziet.", "Het vaatvlies ligt tussen het harde oogvlies en het netvlies."], ["de oogzenuw", "De zenuw die de signalen van het netvlies naar de hersenen doorstuurt.", "Via de oogzenuw worden de signalen van de fotoreceptoren naar de hersenen gestuurd."], ["de lichtbreking", "Het verschijnsel waarbij een lichtstraal van richting verandert wanneer ze van de ene naar de andere doorschijnende stof gaat.", "Doordat het hoornvlies en de ooglens het licht breken, ontstaat er een scherp beeld op het netvlies."], ["de accommodatie", "Het aanpassen van de vorm van de ooglens om zowel op korte als op lange afstand scherp te kunnen zien.", "Bij het kijken naar iets dichtbij wordt de ooglens door accommodatie boller."], ["het lensbandje", "Een van de dunne bandjes die de ooglens vasthouden en die de vorm van de lens mee bepalen.", "Wanneer de lensbandjes verslappen, wordt de ooglens boller."], ["het straallichaam", "De ringvormige spier rond de ooglens die de spanning op de lensbandjes regelt en zo de lens van vorm laat veranderen.", "Door samen te trekken zorgt het straallichaam ervoor dat de ooglens boller wordt."], ["het nabijheidspunt", "Het dichtstbijzijnde punt waarop het oog nog net scherp kan stellen.", "Bij ouder worden komt het nabijheidspunt steeds verder van het oog te liggen."], ["de fotoreceptor", "Een receptor in het netvlies die gevoelig is voor licht.", "Het netvlies bevat twee soorten fotoreceptoren: staafjes en kegeltjes."], ["de pigmentcel", "Een cel met kleurstof die het invallende licht helpt absorberen, zodat het beeld scherper wordt.", "De pigmentcellen achter de fotoreceptoren zorgen ervoor dat licht niet ongecontroleerd verstrooid wordt in het oog."], ["het staafje", "Een fotoreceptor die erg gevoelig is voor licht, maar geen kleuren kan onderscheiden; belangrijk bij schemer of duisternis.", "Dankzij de staafjes kan je ook bij weinig licht nog iets zien, zij het niet in kleur."], ["het kegeltje", "Een fotoreceptor die minder gevoelig is voor licht, maar wel kleuren kan onderscheiden.", "De kegeltjes zorgen ervoor dat je bij voldoende licht kleuren kan zien."], ["de gele vlek", "De plaats op het netvlies met de meeste kegeltjes, waar je het scherpst en in kleur ziet.", "Als je recht naar iets kijkt, valt het beeld op de gele vlek."], ["de blinde vlek", "De plaats op het netvlies waar de oogzenuw het oog verlaat en waar geen fotoreceptoren zitten.", "In de blinde vlek kan je niets waarnemen, omdat daar geen fotoreceptoren aanwezig zijn."], ["de nawerking", "Het verschijnsel waarbij je nog even een beeld blijft 'zien' nadat de prikkel al gestopt is.", "Door de nawerking van het licht lijkt een snel bewegende sterretjeslamp een doorlopende lichtcirkel te vormen."], ["de optische illusie", "Een waarneming die niet overeenkomt met de werkelijkheid, doordat de hersenen het beeld verkeerd interpreteren.", "Bij een optische illusie lijken twee even lange lijnen door de tekening rondom toch verschillend lang."]], "vragen": [{"t": "open", "dok": 2, "v": "Zet de delen in de volgorde waarin het licht ze doorloopt, en geef bij elk deel de functie: lens, hoornvlies, netvlies, pupil.", "a": "Hoornvlies (breekt het licht) → pupil (laat licht binnen) → lens (breekt het licht tot een scherp beeld) → netvlies (fotoreceptoren vangen het licht op)."}, {"t": "open", "dok": 2, "v": "Vergelijk staafjes en kegeltjes op 3 punten.", "a": "Staafjes: ± 120 miljoen, aan de rand, werken bij weinig licht, geen kleuren. Kegeltjes: ± 6 miljoen, in de gele vlek, werken bij veel licht, kleuren en scherp."}, {"t": "open", "dok": 3, "v": "Iemand mist één soort kegeltjes (de rode). Voorspel wat die persoon anders ziet. Verklaar met hoe de hersenen kleuren maken.", "a": "De hersenen maken kleuren door de impulsen van de drie soorten kegeltjes te combineren. Zonder rode kegeltjes ontbreekt één signaal: rood en groen (en kleuren die daaruit bestaan, zoals geel en bruin) worden moeilijk uit elkaar te houden. De persoon is kleurenblind voor rood-groen."}, {"t": "mc", "dok": 3, "v": "Je komt een donkere zaal binnen. Na een paar minuten zie je meer, maar geen kleuren. Waarom?", "o": ["De kegeltjes werken nu beter.", "De staafjes werken bij weinig licht, maar zien geen kleuren.", "De lens wordt groter.", "De blinde vlek wordt kleiner."], "j": 1, "u": "Bij weinig licht nemen de staafjes het over. Die zijn gevoelig voor zwak licht, maar geven alleen grijstinten."}, {"t": "mc", "dok": 3, "v": "Op het netvlies staat het beeld omgekeerd. Toch zie je de wereld rechtop. Wat verklaart dat?", "o": ["De lens draait het beeld een tweede keer om.", "De hersenen verwerken het beeld en draaien het om.", "Het hoornvlies spiegelt het beeld.", "Het beeld staat eigenlijk niet omgekeerd."], "j": 1, "u": "De ogen vangen het licht op, maar het beeld dat je ziet, maken je hersenen."}]}, {"id": "bio-organismen", "groep": "Biologie 3de jaar", "titel": "Receptoren bij andere organismen", "cursus": "cursus-receptoren-organismen.html", "strat": "redenering", "opdr": "Kies 3 dieren en 2 planten uit de cursus. Leg voor elk uit welke prikkel ze opvangen en waarom dat nuttig is om te overleven.", "tool": ["biologie-prikkels.html#r8", "Water, prikkels en reacties · andere organismen"], "oef": [[1, "Welke prikkel?"], [2, "Welke receptor?"], [3, "Fototropie of geotropie?"], [4, "Redeneren: de venusvliegenval"]], "rest": [[5, "Van pijlen naar zinnen"]], "extra": ["biologie-prikkels.html#r8", "Bekijk de voorbeelden in de tool"], "doelen": ["Ik kan verschillende receptoren bij dieren herkennen aan de hand van voorbeelden", "Ik kan verschillende receptoren bij planten herkennen aan de hand van voorbeelden"], "woorden": [["de receptor", "Een cel of groep cellen die één soort prikkel opvangt en omzet in een impuls.", "De snorharen van een kat zijn verbonden met receptoren voor aanraking."], ["de echolocatie", "Een dier stoot geluid uit en vangt de echo op om de weg of een prooi te vinden.", "Een vleermuis vindt insecten in het donker met echolocatie."], ["de fototropie", "Een plant groeit naar het licht toe.", "Door fototropie buigt de kamerplant naar het raam."], ["de geotropie", "Een plant groeit volgens de zwaartekracht: de wortel naar beneden, de stengel naar boven.", "Door geotropie groeit de wortel van een boon altijd naar beneden."]], "vragen": [{"t": "open", "dok": 2, "v": "Welke prikkel vangt een vleermuis op als ze een insect zoekt in het donker? Welke soort receptor gebruikt ze?", "a": "De echo van haar eigen hoge geluiden (echolocatie). Ze gebruikt mechanoreceptoren in haar oren."}, {"t": "open", "dok": 2, "v": "Wat is het verschil tussen fototropie en geotropie? Geef van elk een voorbeeld.", "a": "Fototropie: groeien naar het licht toe (een kamerplant buigt naar het raam). Geotropie: groeien volgens de zwaartekracht (de wortel van een kiemende boon groeit naar beneden)."}, {"t": "open", "dok": 3, "v": "Een slang jaagt 's nachts. Waarom heeft ze meer aan haar warmtegevoelige putjes dan aan haar ogen? Gebruik de woorden prikkel en receptor.", "a": "'s Nachts is er weinig licht: de fotoreceptoren in de ogen krijgen weinig prikkels. Een muis geeft wel warmte af. De thermoreceptoren in de putjes vangen die prikkel op, ook in het donker. Zo vindt de slang toch haar prooi."}, {"t": "mc", "dok": 3, "v": "Een bij vindt nectar dankzij patronen op bloemen die wij niet zien. Welke prikkel is dat?", "o": ["warmte", "ultraviolet licht", "geluid", "een elektrisch veld"], "j": 1, "u": "Bijen hebben fotoreceptoren die uv-licht opvangen. Wij kunnen uv-licht niet zien."}, {"t": "mc", "dok": 3, "v": "Je legt een kiemende boon horizontaal. Na een dag buigt de wortel naar beneden. Welke prikkel vangt de plant op?", "o": ["licht", "aanraking", "de zwaartekracht", "warmte"], "j": 2, "u": "De wortel groeit volgens de zwaartekracht: geotropie. Ook in het donker gebeurt dit."}]}, {"id": "bio-reageren", "groep": "Biologie 3de jaar", "titel": "De mens reageert op prikkels", "cursus": "cursus-reageren.html", "strat": "schema", "opdr": "Vul het schema prikkel → receptor → verwerking → effector → effect in voor 4 situaties uit je eigen dag: 2 met een spier en 2 met een klier. Schrijf er telkens bij of de reactie bewust of onbewust is.", "tool": ["biologie-prikkels.html#e1", "Water, prikkels en reacties · reageren"], "oef": [[1, "Schema invullen"], [2, "Spier of klier?"], [3, "Redeneren: reflex"], [4, "Eigen voorbeeld"]], "rest": [[5, "Van pijlen naar zinnen"]], "extra": ["biologie-prikkels.html#e1", "Vul het schema in de tool in"], "doelen": ["Ik kan voor eigen voorbeelden het schema prikkel → receptor → verwerking → effector → effect invullen en noteren of de reactie bewust of onbewust is", "Ik kan uitleggen hoe je via spieren of klieren, bewust of onbewust, op prikkels reageert"], "woorden": [["de effector", "Een orgaan dat een reactie uitvoert als antwoord op een signaal van het zenuwstelsel of van hormonen, zoals een spier of een klier.", "Spieren en klieren zijn voorbeelden van effectoren."], ["de excretie", "Het afvoeren van afvalstoffen uit het lichaam.", "Via de nieren gebeurt een groot deel van de excretie van afvalstoffen."], ["de secretie", "Het afscheiden van een nuttige stof (zoals een hormoon of een enzym) door een klier.", "Bij secretie geeft een klier een stof af die het lichaam nog kan gebruiken."], ["de exocriene klier", "Een klier die haar afscheidingsproduct via een afvoerbuisje naar buiten of naar een holte afgeeft.", "Zweetklieren zijn exocriene klieren, want ze geven zweet af via een buisje naar het huidoppervlak."], ["de endocriene klier", "Een klier die haar afscheidingsproduct (een hormoon) rechtstreeks in het bloed afgeeft.", "De schildklier is een endocriene klier die een hormoon rechtstreeks in het bloed afgeeft."], ["het hormoon", "Een stof die door een klier wordt aangemaakt en die via het bloed een effect heeft op andere delen van het lichaam.", "Insuline is een hormoon dat de bloedsuikerspiegel regelt."]], "vragen": [{"t": "open", "dok": 2, "v": "Vul het schema in voor: je ziet een bal op je afkomen en je vangt hem. Is de reactie bewust of onbewust?", "a": "Licht → fotoreceptoren (ogen) → hersenen → spieren van armen en handen → je vangt de bal. Bewust."}, {"t": "open", "dok": 2, "v": "Wat is het verschil tussen een spier en een klier als effector? Geef van elk een voorbeeld.", "a": "Een spier zorgt voor beweging (bv. je beenspieren als je wegloopt). Een klier maakt een stof (bv. zweetklieren maken zweet, speekselklieren maken speeksel)."}, {"t": "open", "dok": 3, "v": "Je ruikt eten en je mond wordt nat. Een klasgenoot zegt: \"Dat kies je zelf.\" Ga je akkoord? Vul het schema in en verantwoord.", "a": "Niet akkoord. Geur → chemoreceptoren → hersenen → speekselklieren → speeksel. Je denkt er niet over na: het gebeurt vanzelf. Het is een onbewuste reactie via een klier."}, {"t": "mc", "dok": 3, "v": "Bij schrik slaat je hart sneller. Welke effector zorgt hiervoor?", "o": ["de beenspieren", "een klier die adrenaline maakt", "de fotoreceptoren", "het ruggenmerg"], "j": 1, "u": "D const STRAT = {"doelen": ["Vertrek van doelen", "Lees de doelen. Wat moet ik kennen, wat moet ik kunnen?"], "fouten": ["Leer uit je fouten", "Kijk je toets na: wat is fout en waarom?"], "spreiden": ["Spreiden", "Leer in korte stukken, op meerdere dagen."], "toets": ["Toets jezelf", "Cursus dicht. Schrijf op wat je nog weet. Kijk dan na."], "redenering": ["Leg de redenering uit", "Zeg in eigen woorden waarom en hoe."], "schema": ["Schema of tekening", "Zet de leerstof om in een tekening of schema met woorden erbij."], "elkaar": ["Oefen door elkaar", "Maak oefeningen van verschillende soorten door elkaar."]};

let vnr = 0;

const open_ = v => { const id = 'a' + (++vnr); return `<div class="vraag"><span class="dok${v.dok === 3 ? ' d3' : ''}">DOK ${v.dok}</span>${f(v.v)}

const mc_ = v => `<div class="vraag" data-j="${v.j}"><span class="dok d3">DOK 3</span>${f(v.v)}

function overzicht(){
  document.title = 'Remediëring – wetenschappen';

function kaart(k, modus){

  document.title = 'Remediëring – ' + k.titel;

  const z = ZIN[k.strat] || [];

    <p>Neem een leeg blad. Schrijf bij elk doel van stap 1 op wat je erover weet, met je cursus dicht. Kijk daarna na in je cursus en vul aan in het groen.</p>
    <div class="zin"><b>Zinsbouwers</b>Ik weet nog: … · Ik was vergeten dat …</div>`}
    <div class="blok">
      <p>${sNaam(k.strat)} <span class="wat">${STRAT[k.strat][1]}</span></p>
      <p>${e(k.opdr)}</p>
      ${z.length ? `<div class="zin"><b>Zinsbouwers</b>${z.map(e).join(' · ')}</div>` : ''}
      ${k.strat === 'redenering' ? '<p>Leg het daarna <b>hardop</b> uit aan iemand: een klasgenoot of iemand thuis. Die persoon vraagt telkens: <i>"Waarom?"</i></p>' : ''}

    <div class="links"><a href="${k.cursus}#oefeningen" target="_blank" rel="noopener">📘 Oefeningen in de cursus</a></div>
    <div class="blok"><p>Lees de doelen van stap 1 opnieuw. Zet er nog eens <span class="schaal">✓ ~ ✗</span> naast, in het groen.</p></div>

  <section class="stap"><h2><span class="nr">4</span>Inleveren</h2>
    ${na ? '' : `<p>Kijk naar je doelen van deel 2. Nog een <span class="schaal">~</span> of <span class="schaal">✗</span>? Oefen dat doel nog met de extra vragen hieronder. De dag voor de toets herhaal je nog eens kort: ${sNaam('toets')}.</p>`}

    <p>Kies in BookWidgets: <b>${e(k.titel)}</b> · <b>${na ? 'na de toets' : 'voor de toets'}</b>. Laad je foto's op${na ? '' : ', ten laatste de dag voor de toets'}.</p>
    <div class="links">${bw ? `<a href="${bw}" target="_blank" rel="noopener">📤 Naar BookWidgets</a>` : `<button class="knop" disabled>📤 Link naar BookWidgets volgt</button>`}</div>
  </section>

  <details class="extra"><summary>Extra oefenen: vragen op niveau DOK 2 en DOK 3</summary>
    <p>Dit hoef je niet in te leveren. Schrijf je antwoord eerst zelf op papier. Kijk daarna pas naar het antwoord.</p>

  app.querySelectorAll('[data-toon]').forEach(b => b.onclick = () => { const a = document.getElementById(b.dataset.toon); a.hidden = !a.hidden; b.textContent = a.hidden ? 'Toon het antwoord' : 'Verberg het antwoord'; });

    const j = +q.dataset.j, i = +b.dataset.i;
    q.querySelectorAll('.opts button').forEach(x => x.classList.remove('juist', 'fout'));
    b.classList.add(i === j ? 'juist' : 'fout');

  };
  window.scrollTo(0, 0);
}

function route(){
  const [id, m] = decodeURIComponent(location.hash.slice(1)).split('/');
  const k = KAARTEN.find(k => k.id === id);
  k ? kaart(k, m === 'na' ? 'na' : 'voor') : overzicht();
}
addEventListener('hashchange', route);
route();
</script>
