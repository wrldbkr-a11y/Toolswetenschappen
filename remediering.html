<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remediëring – wetenschappen</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF2F5;--paper:#fff;--ink:#1D2A36;--muted:#51606E;--line:#CBD5DE;--acc:#1F4E79;--groen:#1F7A4A;--geel:#FFF4D6;
  --fysica:#2F6FB0;--chemie:#D46A1A;--biologie:#3E8E41}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,Arial,sans-serif;font-size:1.0625rem;line-height:1.5}
main{max-width:46rem;margin:0 auto;padding:2rem 1.1rem 4rem}
a{color:var(--acc)}
h1{font-size:clamp(1.7rem,5vw,2.2rem);line-height:1.15;margin:.2rem 0 .5rem}
.sub{color:var(--muted);margin:0 0 1.5rem}
.terug{display:inline-block;margin-bottom:.8rem;font-weight:700;text-decoration:none}
/* overzicht */
.groep{margin-top:1.8rem}
.groep h2{font-size:1.2rem;margin:0 0 .6rem;padding-left:.6rem;border-left:6px solid var(--c)}
.knoppen{display:grid;grid-template-columns:repeat(auto-fill,minmax(13rem,1fr));gap:.6rem}
.knoppen a{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:.75rem .9rem;text-decoration:none;color:var(--ink);font-weight:700;min-height:44px}
.knoppen a:hover{border-color:var(--c)}
/* kaart */
.stap{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1rem 1.1rem;margin:1rem 0}
.stap h2{font-size:1.15rem;margin:0 0 .5rem;display:flex;gap:.6rem;align-items:baseline}
.stap h2 .nr{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--acc);color:#fff;display:inline-grid;place-items:center;font-size:1rem}
.strat{display:inline-block;background:#E4ECF4;color:var(--acc);font-weight:700;border-radius:4px;padding:.05rem .45rem;font-size:.95rem}
.wat{color:var(--muted);font-style:italic;margin:.2rem 0 .5rem}
.zin{background:var(--geel);border-left:4px solid #9A5B00;padding:.5rem .8rem;margin:.6rem 0;border-radius:0 4px 4px 0}
.zin b{display:block;font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:#6B4A00}
.blok{border-top:1px dashed var(--line);margin-top:.8rem;padding-top:.8rem}
.links{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.6rem}
.links a,.knop{display:inline-flex;align-items:center;gap:.35rem;background:var(--acc);color:#fff;text-decoration:none;font-weight:700;padding:.5rem .85rem;border-radius:4px;min-height:44px;border:0;font:inherit;font-weight:700;cursor:pointer}
.links a.licht,.knop.licht{background:#E4ECF4;color:var(--acc)}
.knop[disabled]{background:#cbd5de;color:#51606E;cursor:default}
ul.check{list-style:none;padding:0;margin:.4rem 0}
ul.check li{padding-left:1.7rem;position:relative;margin:.3rem 0}
ul.check li::before{content:"☐";position:absolute;left:0;font-size:1.2rem;line-height:1.2}
ol.oef li{margin:.15rem 0}
.schaal{font-weight:700;letter-spacing:.05em}
details.extra{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.8rem 1.1rem;margin:1rem 0}
details.extra summary{font-weight:700;cursor:pointer}
dl.woorden{margin:.4rem 0;display:grid;gap:.45rem}
dl.woorden dt{font-weight:700}
dl.woorden dd{margin:0 0 0 .9rem}
dl.woorden dd i{color:var(--muted)}
.vraag{border-top:1px solid var(--line);padding:.8rem 0}
.vraag .dok{display:inline-block;font-size:.8rem;font-weight:700;border-radius:4px;padding:0 .4rem;margin-right:.4rem;background:#E7F3EC;color:var(--groen)}
.vraag .dok.d3{background:#FDE8D7;color:#9A4A0B}
.opts{display:grid;gap:.4rem;margin:.5rem 0}
.opts button{text-align:left;font:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:.5rem .7rem;cursor:pointer;min-height:44px}
.opts button.juist{border-color:var(--groen);background:#E7F3EC}
.opts button.fout{border-color:#b3261e;background:#FBE9E7}
.fb{margin:.3rem 0;color:var(--muted)}
.antw{background:#F3F6F9;border-radius:6px;padding:.5rem .8rem;margin-top:.4rem}
h3.niv{font-size:1.05rem;margin:1.2rem 0 .2rem}
.keuze{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin:.4rem 0 1rem}
.keuze>div{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.7rem .9rem;color:var(--muted)}
.keuze b{color:var(--ink)}
.modus{display:flex;gap:.5rem;margin:.6rem 0 0;flex-wrap:wrap}
.modus a{flex:1 1 12rem;text-align:center;text-decoration:none;font-weight:700;padding:.6rem .8rem;border-radius:6px;border:2px solid var(--acc);color:var(--acc);background:#fff;min-height:44px}
.modus a.aan{background:var(--acc);color:#fff}
.lk{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem}
.ok{color:var(--groen);font-weight:700;margin-left:.5rem}
@media print{.links,.lk,.terug,details.extra{display:none}.stap{break-inside:avoid}}
</style>
</head>

 de vlam betekent dat een stof brandbaar is."]], "vragen": [{"t": "open", "dok": 2, "v": "Brood bakken en boter smelten gebeuren allebei in de keuken. Welk van de twee is een chemisch verschijnsel? Geef twee kenmerken waaraan je dat ziet.", "a": "Brood bakken is chemisch: de kleur verandert (bruine korst), er ontstaat een nieuwe geur, en het gaat niet meer terug. Boter smelten is fysisch: gestolde boter is nog altijd boter."}, {"t": "open", "dok": 2, "v": "Op een fles staan twee zinnen: \"Veroorzaakt ernstige oogirritatie\" en \"Draag oogbescherming\". Welke is een H-zin en welke een P-zin? Waarom?", "a": "De eerste is een H-zin (gevaar: wat de stof doet). De tweede is een P-zin (voorzorg: wat jij moet doen)."}, {"t": "open", "dok": 3, "v": "Een klasgenoot zegt: \"Als water kookt, ontstaan er bubbels. Bubbels betekenen een nieuwe stof, dus koken is chemisch.\" Klopt die redenering? Leg uit.", "a": "Nee. De bubbels zijn waterdamp: dat is nog altijd water, alleen gasvormig. Een gas is een teken van een nieuwe stof, maar je moet nagaan of het echt een andere stof is. Hier gaat het terug (damp wordt weer water), dus het is fysisch."}, {"t": "mc", "dok": 3, "v": "Bij welk verschijnsel ontstaat er zeker een nieuwe stof?", "o": ["Suiker lost op in warme thee.", "Een ijzeren hek wordt bruin en brokkelig.", "Glas breekt in stukken.", "Water in de vriezer wordt ijs."], "j": 1, "u": "Roesten geeft een nieuwe stof met een andere kleur die niet meer terug wordt. De andere drie zijn fysisch: de stof blijft dezelfde."}, {"t": "mc", "dok": 3, "v": "Een spuitbus heeft het symbool met de vlam en het symbool met de gasfles. Welke P-zin past het best?", "o": ["Veroorzaakt ernstige brandwonden.", "Giftig bij inslikken.", "Niet doorboren of verbranden, ook niet na gebruik.", "Zeer giftig voor in het water levende organismen."], "j": 2, "u": "Een P-zin zegt wat jij moet doen. Een bus met gas onder druk die ontvlambaar is, mag je niet doorboren of verbranden. A, B en D zijn H-zinnen."}]}, {"id": "chemie-mengsels", "groep": "Chemie 3de jaar", "titel": "Zuivere stoffen en mengsels", "cursus": "cursus-chemie-mengsels.html", "strat": "schema", "opdr": "Maak een schema: materie → zuivere stof of mengsel → homogeen of heterogeen → de soorten mengsels. Schrijf bij elk vakje één voorbeeld uit je eigen leven.", "tool": ["chemie-mengsels.html#les22", "Mengsels en stofeigenschappen"], "oef": [[1, "Zuivere stof of mengsel?"], [3, "Welk soort mengsel?"], [4, "Stofeigenschap of voorwerpseigenschap?"], [5, "Redeneren: bestanddelen"]], "rest": [[2, "Deeltjesmodel lezen"], [6, "Redeneren: het Atomium"], [7, "Van pijlen naar zinnen"]], "extra": ["chemie-mengsels.html", "Sorteeroefeningen in de tool"], "doelen": ["Ik kan de begrippen zuivere stof, bestanddeel en mengsel onderscheiden", "Ik kan uitleggen waarom een mengsel homogeen of heterogeen is", "Ik kan de soorten mengsels onderscheiden op basis van de aggregatietoestand van hun bestanddelen", "Ik kan beschrijven wat een stofeigenschap is en voorbeelden noteren", "Ik kan het onderscheid maken tussen een stofeigenschap en een voorwerpseigenschap"], "woorden": [["de zuivere stof", "Een stof die volledig uit één soort deeltjes bestaat en niet verder gescheiden kan worden in andere stoffen.", "Gedestilleerd water is een zuivere stof."], ["het mengsel", "Een combinatie van twee of meer zuivere stoffen die niet chemisch met elkaar reageren.", "Leidingwater is een mengsel van water en opgeloste stoffen."], ["het bestanddeel van een mengsel", "Een van de zuivere stoffen waaruit een mengsel is opgebouwd.", "Zout en water zijn de twee bestanddelen van zout water."], ["het heterogeen mengsel", "Een mengsel waarin je de verschillende bestanddelen nog met het blote oog of onder de microscoop kan onderscheiden.", "Een mengsel van zand en water is een heterogeen mengsel."], ["het homogeen mengsel", "Een mengsel dat er overal hetzelfde uitziet, waarbij je de bestanddelen niet meer afzonderlijk kan waarnemen.", "Suikerwater is een  de vloeibare fase.", "IJs heeft een smeltpunt van 0°C."], ["het stolpunt", "De temperatuur waarbij een vloeistof overgaat naar de vaste fase.", "Bij een zuivere stof liggen het smeltpunt en het stolpunt bij dezelfde temperatuur."]], "vragen": [{"t": "open", "dok": 2, "v": "Vergelijk kraantjeswater en gedestilleerd water. Welk is een zuivere stof? Hoe kan je dat met de kooktemperatuur aantonen?", "a": "Gedestilleerd water is een zuivere stof: het kookt bij precies 100 °C en de temperatuur blijft constant. Kraantjeswater is een mengsel (opgeloste zouten): het kookt bij een iets andere temperatuur en die verandert tijdens het koken."}, {"t": "open", "dok": 2, "v": "Geef van elk mengsel de naam en de aggregatietoestand van de bestanddelen: scheerschuim, mist boven het Ter Kamerenbos, brons.", "a": "Scheerschuim: schuim (gas in vloeistof). Mist: nevel (vloeistof in gas). Brons: legering (vast in vast, homogeen)."}, {"t": "open", "dok": 3, "v": "Een leerling zegt: \"De massa van een blok ijzer is een stofeigenschap, want het is ijzer.\" Ga akkoord of niet, en leg uit met een tegenvoorbeeld.", "a": "Niet akkoord. Massa hangt af van hoeveel ijzer je hebt: een spijker en een brug zijn allebei ijzer maar hebben een andere massa. Massa is een voorwerpseigenschap. De massadichtheid (7,87 g/cm³) is wel een stofeigenschap."}, {"t": "mc", "dok": 3, "v": "Je bekijkt melk onder een microscoop en ziet kleine bolletjes vet in water. Wat besluit je?", "o": ["Melk is een zuivere stof, want het ziet er gelijk uit.", "Melk is een homogeen mengsel, want je ziet met het blote oog geen bestanddelen.", "Melk is een heterogeen mengsel, want je ziet de bestanddelen met een microscoop.", "Melk is een oplossing van vet in water."], "j": 2, "u": "Een mengsel is heterogeen als je de bestanddelen kan zien, met het oog of met een microscoop."}, {"t": "mc", "dok": 3, "v": "Welke eigenschap kan je gebruiken om te bewijzen dat een onbekend metaal goud is?", "o": ["de massa van het stuk", "het volume van het stuk", "de massadichtheid", "de temperatuur van het stuk"], "j": 2, "u": "De massadichtheid is een stofeigenschap: ze is voor goud altijd 19,3 g/cm³, hoe groot het stuk ook is. Massa, volume en temperatuur zijn voorwerpseigenschappen."}]}, {"id": "chemie-scheiding", "groep": "Chemie 3de jaar", "titel": "Scheidingstechnieken", "cursus": "cursus-chemie-scheidingstechnieken.html", "strat": "schema", "opdr": "Teken de opstelling van filtreren en van destilleren. Schrijf de namen van alle onderdelen erbij. Schrijf onder elke tekening op welke stofeigenschap je gebruikt.", "tool": ["chemie-scheidingstechnieken.html#les32", "Scheidingstechnieken · werking en onderdelen"], "oef": [[2, "Onderdelen: filtreren"], [3, "Onderdelen: destilleren"], [5, "Welke techniek?"], [6, "Redeneren: een mengsel in stappen scheiden"]], "rest": [[1, "Definitie"], [4, "Onderdelen: uitdampen"], [7, "Redeneren: Brussel-Noord"], [8, "Van pijlen naar zinnen"]], "extra": ["chemie-scheidingstechnieken.html#lesov", "Test jezelf: onderdelen en voorbeelden"], "doelen": ["Ik kan de definitie van scheidingstechniek noteren", "Ik kan het principe van zeven, decanteren, filtreren en centrifugeren uitleggen met een tekening en de stofeigenschap noteren", "Ik kan het principe van uitdampen, destilleren, extraheren en adsorberen uitleggen met een tekening en de stofeigenschap noteren", "Ik kan de onderdelen van elke opstelling benoemen", "Ik kan bij een voorbeeld uit het dagelijks leven de gebruikte scheidingstechniek noteren"], "woorden": [["de scheidingstechniek", "Een methode om de bestanddelen van een mengsel van elkaar te scheiden.", "Filtreren is een scheidingstechniek om een vaste stof uit een vloeistof te halen."], ["het zeven", "Een scheidingstechniek waarbij vaste stoffen met verschillende korrelgrootte gescheiden worden met een zeef.", "Door te zeven scheid je grove kiezels van fijn zand."], ["het decanteren", "Een scheidingstechniek waarbij je de bovenstaande vloeistof voorzichtig afgiet van een bezonken vaste stof.", "Na het bezinken kan je het heldere water decanteren van het bezinksel."], ["het filtreren", "Een scheidingstechniek waarbij je een mengsel door een filter giet, zodat de vaste stof wordt tegengehouden en de vloeistof erdoor loopt.", "Door te filtreren scheid je het zand van het water."], ["het residu", "De vaste stof die achterblijft op het filter na het filtreren.", "Het zand dat op het filterpapier achterblijft, is het residu."], ["het filtraat", "De vloeistof die door het filter loopt bij het filtreren.", "Het heldere water dat door het filter loopt, is het filtraat."], ["het centrifugeren", "Een scheidingstechniek waarbij een mengsel snel ronddraait, zodat de zwaarste bestanddelen naar buiten/onderaan gedreven worden.", "In het labo gebruikt men centrifugeren om kleine deeltjes sneller te laten bezinken."], ["het uitdampen", "Een scheidingstechniek waarbij een vloeistof verdampt, zodat de opgeloste vaste stof achterblijft.", "Door zout water te laten uitdampen, houd je de zoutkristallen over."], ["het destilleren", "Een scheidingstechniek waarbij je een homogeen mengsel scheidt op basis van een verschil in kookpunt, door te verdampen en daarna weer te condenseren.", "Door destilleren kan je alcohol scheiden van water."], ["het destillaat", "De vloeistof die je overhoudt nadat de damp bij het destilleren weer gecondenseerd is.", "Het destillaat dat je opvangt, bevat vooral de stof met het laagste kookpunt."], ["het extraheren", "Een scheidingstechniek waarbij een stof met behulp van een oplosmiddel uit een mengsel gehaald wordt.", "Door extraheren kan je een kleurstof uit plantenblaadjes halen."], ["het extractiemiddel", "Het oplosmiddel dat gebruikt wordt om een stof uit een mengsel te extraheren.", "Bij het extraheren van cafeïne gebruikt men water als extractiemiddel."], ["het adsorberen", "Een scheidingstechniek waarbij bepaalde stoffen aan het oppervlak van een ander materiaal blijven kleven.", "Actieve kool kan geurstoffen uit de lucht adsorberen."], ["het adsorptiemiddel", "Het materiaal waaraan stoffen blijven kleven bij het adsorberen.", "Actieve kool wordt vaak gebruikt als adsorptiemiddel."]], "vragen": [{"t": "open", "dok": 2, "v": "Waarom kan je zout niet uit zout water halen door te filtreren? Welke techniek gebruik je wel, en op welke stofeigenschap is die gebaseerd?", "a": "Zout is opgelost: de deeltjes zijn zo klein dat ze door het filtreerpapier gaan. Je gebruikt uitdampen (of destilleren), gebaseerd op een verschil in kooktemperatuur."}, {"t": "open", "dok": 2, "v": "Bij destilleren stroomt het koelwater onderaan de koeler in en bovenaan eruit. Wat is de taak van de koeler?", "a": "In de koeler wordt de damp afgekoeld, zodat ze condenseert tot vloeistof: het destillaat, dat je opvangt in de erlenmeyer."}, {"t": "open", "dok": 3, "v": "Je krijgt een mengsel van zand, suiker en olie. Ontwerp een plan in stappen om de drie stoffen apart terug te krijgen. Noteer bij elke stap de techniek en de stofeigenschap.", "a": "Voeg water toe: de suiker lost op, het zand niet, de olie drijft. 1) Decanteer de olie af (massadichtheid; olie mengt niet met water). 2) Filtreer: het zand blijft op het filter (deeltjesgrootte). 3) Damp het filtraat uit: de suiker blijft over (kooktemperatuur). Andere goede volgordes zijn mogelijk als je ze verantwoordt."}, {"t": "mc", "dok": 3, "v": "In de waterzuivering van Vivaqua blijven resten van pesticiden hangen aan actieve kool. Waarom is gewoon filtreren niet genoeg?", "o": ["De pesticiden zijn zwaarder dan water.", "De pesticiden zijn opgelost: het is een homogeen mengsel en de deeltjes zijn te klein voor filtreerpapier.", "De pesticiden koken bij een lagere temperatuur dan water.", "Filtreren werkt alleen bij gassen."], "j": 1, "u": "Opgeloste stoffen gaan door een filter. Actieve kool houdt ze vast aan haar oppervlak: dat is adsorberen."}, {"t": "mc", "dok": 3, "v": "Twee vloeistoffen mengen goed. De ene kookt bij 78 °C, de andere bij 100 °C. Welke techniek scheidt ze het best?", "o": ["decanteren", "filtreren", "destilleren", "centrifugeren"], "j": 2, "u": "Ze vormen een homogeen mengsel, dus decanteren, filtreren en centrifugeren werken niet. Het verschil in kooktemperatuur gebruik je bij destilleren."}]}, {"id": "chemie-atomen", "groep": "Chemie 3de jaar", "titel": "Atomen en elementen", "cursus": "cursus-chemie-atomen-elementen.html", "strat": "toets", "opdr": "Schrijf met je cursus dicht: de 6 atoommodellen in de juiste volgorde, met de wetenschapper en één kenmerk. Schrijf daarna de symbolen van de elementen 1 tot 20 en de Latijnse symbolen. Kijk na en verbeter in het groen.", "tool": ["chemie-atoommodellen.html", "Atomen en elementen"], "oef": [[2, "Chronologisch rangschikken"], [4, "Kenmerken"], [5, "Symbool en naam"], [6, "Juist of fout geschreven?"]], "rest": [[1, "Dynamisch model"], [3, "Welk model?"], [7, "Redeneren: het model van Thomson"], [8, "Van pijlen naar zinnen"]], "extra": ["chemie-atoommodellen.html#les12", "Test jezelf: symbolen"], "doelen": ["Ik kan uitleggen waarom het atoommodel een dynamisch model is", "Ik kan de namen van de atoommodellen en hun kenmerken noteren en ze chronologisch rangschikken", "Ik kan het chemisch symbool noteren als de naam gegeven is, en omgekeerd"], "woorden": [["het atoommodel", "Een voorstelling die wetenschappers gebruiken om de bouw van een atoom te beschrijven; dit model is doorheen de geschiedenis meermaals aangepast.", "Het atoommodel van vandaag verschilt sterk van het eerste atoommodel van meer dan 100 jaar geleden."], ["het chemisch element", "Een zuivere stof die bestaat uit slechts één soort atomen.", "Zuurstof en koolstof zijn voorbeelden van een chemisch element."], ["de elementaire deeltjes", "De kleinste bouwstenen waaruit een atoom is opgebouwd: protonen, neutronen en elektronen.", "De elementaire deeltjes van een atoom bepalen samen zijn eigenschappen."]], "vragen": [{"t": "open", "dok": 2, "v": "Wat was nieuw in het model van Rutherford ten opzichte van dat van Thomson? Welk experiment was de oorzaak?", "a": "Rutherford: een heel kleine, positieve kern met bijna alle massa, en vooral lege ruimte errond. Oorzaak: het goudfolie-experiment, waarbij een paar deeltjes terugkaatsten."}, {"t": "open", "dok": 2, "v": "Schrijf het symbool: kalium, koper, kwik, kobalt, koolstof, krypton. Welke drie komen van een Latijnse naam?", "a": "K, Cu, Hg, Co, C, Kr. Van het Latijn: K (kalium), Cu (cuprum), Hg (hydrargyrum)."}, {"t": "open", "dok": 3, "v": "Iemand zegt: \"Het model van Bohr is fout, dus waarom leren we het nog?\" Geef een goed antwoord met het woord \"dynamisch\".", "a": "Een atoommodel is dynamisch: het wordt aangepast als nieuwe experimenten nieuwe dingen tonen. Bohr is niet de laatste versie, maar het is eenvoudig en verklaart wat wij nodig hebben (schillen, valentie-elektronen, het PSE). Een model hoeft niet perfect te zijn om nuttig te zijn."}, {"t": "mc", "dok": 3, "v": "Bij het goudfolie-experiment gingen bijna alle deeltjes rechtdoor. Wat besloot Rutherford daaruit?", "o": ["Het atoom is een massief bolletje.", "Het atoom bestaat vooral uit lege ruimte.", "Elektronen draaien op vaste schillen.", "De positieve lading is gelijk verdeeld over het atoom."], "j": 1, "u": "Als bijna alles zonder botsen doorgaat, is er bijna niets in de weg: vooral lege ruimte. De paar deeltjes die terugkaatsten, toonden de kleine kern."}, {"t": "mc", "dok": 3, "v": "Welke notatie is een element en geen stof die uit twee elementen bestaat?", "o": ["CO", "Co", "NO", "HF"], "j": 1, "u": "Co (kobalt) heeft één hoofdletter: één element. CO, NO en HF hebben twee hoofdletters: telkens twee elementen."}]}, {"id": "chemie-atoombouw", "groep": "Chemie 3de jaar", "titel": "Bouw van het atoom", "cursus": "cursus-chemie-atoombouw.html", "strat": "schema", "opdr": "Teken het schillenmodel van zuurstof, natrium en chloor. Schrijf het aantal protonen en neutronen in de kern, kleur de valentie-elektronen en noteer de elektronenconfiguratie.", "tool": ["chemie-atoombouw.html", "Bouw van het atoom · atoombouwer"], "oef": [[3, "Van configuratie naar tekening"], [5, "Elektronenconfiguratie noteren"], [6, "Welk element?"], [7, "Vul de tabel aan"]], "rest": [[1, "Elementaire deeltjes"], [2, "Schillenmodel tekenen"], [4, "Zoek de fout"], [8, "Neutronen tellen"], [9, "Relatieve atoommassa"], [10, "Redeneren: een fout in de atoombouwer"], [11, "Schillen zijn energieniveaus"], [12, "Van pijlen naar zinnen"]], "extra": ["elektronenconfiguratie.html", "Oefen elektronenconfiguraties"], "doelen": ["Ik kan beschrijven hoe een atoom is opgebouwd (kern, protonen, neutronen, elektronen, elektronenmantel)", "Ik kan de elementaire deeltjes noteren", "Ik kan voor de eerste 18 elementen de elektronenconfiguratie tekenen en noteren", "Ik kan de definitie van valentie-elektronen noteren en noteren dat de schillen energieniveaus zijn", "Ik kan met het atoomnummer Z en het massagetal A het aantal protonen, neutronen en elektronen bepalen", "Ik kan een element symbolisch voorstellen met atoomnummer en massagetal", "Ik kan het verband tussen absolute en relatieve atoommassa uitleggen"], "woorden": [["de atoomkern", "Het centrale, positief geladen deel van het atoom, waarin protonen en neutronen zitten.", "Bijna de volledige massa van een atoom bevindt zich in de atoomkern."], ["het nucleon", "Een deeltje in de atoomkern: ofwel een proton, ofwel een neutron.", "Het aantal nucleonen in de kern bepaalt het massagetal van het atoom."], ["de elektronenmantel", "Het gebied rond de atoomkern waarin de elektronen zich bevinden.", "De elektronenmantel bepaalt hoe een atoom reageert met andere atomen."], ["het proton", "Een positief geladen deeltje in de atoomkern.", "Het aantal protonen bepaalt om welk chemisch element het gaat."], ["het neutron", "Een ongeladen deeltje in de atoomkern.", "Neutronen dragen bij aan de massa van het atoom, maar niet aan zijn lading."], ["de elektronen", "Negatief geladen deeltjes die zich in de elektronenmantel rond de atoomkern bevinden.", "Elektronen zijn verantwoordelijk voor de chemische reacties van een atoom."], ["het energieniveau", "Een van de vaste 'niveaus' waarop elektronen zich rond de atoomkern kunnen bevinden.", "Elektronen op een hoger energieniveau bevinden zich verder van de atoomkern."], ["de elektronenconfiguratie", "De verdeling van de elektronen van een atoom over de verschillende schillen of energieniveaus.", "Uit de elektronenconfiguratie van een atoom kan je zijn plaats in het PSE afleiden."], ["het valentie-elektron", "Een elektron in de buitenste schil van een atoom, dat een rol speelt bij chemische reacties.", "De valentie-elektronen bepalen hoeveel bindingen een atoom kan vormen."], ["het schillenmodel", "Een model dat de elektronen van een atoom voorstelt als verdeeld over opeenvolgende schillen rond de kern.", "Volgens het schillenmodel bevat de eerste schil rond de kern maximaal twee elektronen."], ["de lewisstructuur", "Een eenvoudige voorstelling van een atoom waarbij enkel het symbool en de valentie-elektronen als puntjes getekend worden.", "In een lewisstructuur teken je de valentie-elektronen als puntjes rond het symbool van het element."], ["de absolute atoommassa", "De werkelijke massa van een atoom, uitgedrukt in kilogram, wat een extreem klein getal oplevert.", "De absolute atoommassa van een atoom is zo klein dat we er in de praktijk zelden mee rekenen."], ["de relatieve atoommassa", "De massa van een atoom uitgedrukt ten opzichte van de atoommassaeenheid, zonder eenheid.", "De relatieve atoommassa van koolstof-12 is per definitie precies 12."], ["de atoommassaeenheid", "De eenheid waarin atoommassa's meestal worden uitgedrukt, gelijk aan één twaalfde van de massa van een koolstof-12-atoom.", "Eén atoommassaeenheid komt overeen met een heel klein gewicht, ongeveer de massa van één proton."], ["het massagetal", "Het totaal aantal nucleonen (protonen + neutronen) in een atoomkern.", "Een atoom met 6 protonen en 6 neutronen heeft een massagetal van 12."], ["het atoomnummer", "Het aantal protonen in de kern van een atoom, dat bepaalt om welk element het gaat.", "Elk element heeft een uniek atoomnummer, dat je terugvindt in het PSE."]], "vragen": [{"t": "open", "dok": 2, "v": "Een atoom heeft Z = 15 en A = 31. Hoeveel protonen, neutronen en elektronen heeft het? Noteer de elektronenconfiguratie en het aantal valentie-elektronen.", "a": "15 protonen, 31 − 15 = 16 neutronen, 15 elektronen. Configuratie 2/8/5, dus 5 valentie-elektronen (fosfor)."}, {"t": "open", "dok": 2, "v": "Waarom is de relatieve atoommassa A_r van een atoom ongeveer gelijk aan zijn massagetal A?", "a": "Een proton en een neutron hebben elk een massa van ongeveer 1 u en elektronen wegen bijna niets. De massa in u is dus ongeveer het aantal protonen + neutronen = A."}, {"t": "open", "dok": 3, "v": "Twee atomen hebben allebei 6 protonen. Het ene heeft 6 neutronen, het andere 8. Zijn het atomen van hetzelfde element? Leg uit en noteer beide in symbolische voorstelling.", "a": "Ja: het aantal protonen (Z = 6) bepaalt het element, hier koolstof. Het aantal neutronen mag verschillen. ¹²₆C en ¹⁴₆C (massagetal 12 en 14)."}, {"t": "mc", "dok": 3, "v": "Een deeltje heeft 11 protonen, 12 neutronen en 10 elektronen. Wat is het?", "o": ["een neutraal neonatoom", "een neutraal natriumatoom", "een natriumdeeltje met één elektron te weinig", "een magnesiumatoom"], "j": 2, "u": "11 protonen = natrium. Met 10 elektronen is er één elektron te weinig: het deeltje is positief geladen (een ion). Het element verandert niet door elektronen."}, {"t": "mc", "dok": 3, "v": "Waarom komt het 3de elektron van lithium op de L-schil?", "o": ["De L-schil heeft een lagere energie dan de K-schil.", "De K-schil is vol met 2 elektronen.", "Lithium heeft 3 schillen.", "Elektronen verdelen zich altijd gelijk over de schillen."], "j": 1, "u": "De K-schil heeft de laagste energie en wordt eerst gevuld, maar kan maximaal 2 elektronen bevatten. Het 3de elektron gaat naar de volgende schil."}]}, {"id": "chemie-pse", "groep": "Chemie 3de jaar", "titel": "Het periodiek systeem", "cursus": "cursus-chemie-pse.html", "strat": "redenering", "opdr": "Kies 3 elementen uit verschillende groepen. Leg voor elk uit wat je uit de plaats in het PSE weet: groep → aantal valentie-elektronen, periode → aantal schillen, links of rechts van de trap → metaal of niet-metaal.", "tool": ["chemie-pse.html#lesC", "Periodiek systeem · groep en periode"], "oef": [[3, "Van PSE naar atoom"], [4, "Tekenen: drie edelgassen"], [6, "Van atoom naar PSE"], [7, "Zelfde groep"]], "rest": [[1, "Categorieën kleuren"], [2, "Metaal, niet-metaal of edelgas?"], [5, "Tekenen: één groep, drie perioden"], [8, "Elektronegativiteit vergelijken"], [9, "Edelgasconfiguratie"], [10, "Redeneren: waarom reageren edelgassen niet?"], [11, "Van pijlen naar zinnen"]], "extra": ["chemie-pse.html", "Oefenen in de tool"], "doelen": ["Ik kan noteren dat de elementen in eenzelfde groep dezelfde chemische eigenschappen hebben en dus op dezelfde manier reageren", "Ik kan met het PSE het verband noteren tussen het groepsnummer, het periodenummer en de bouw van het atoom", "Ik kan met het PSE de opbouw van een atoom noteren en omgekeerd", "Ik kan uitleggen wat een hoge of lage elektronegativiteit betekent", "Ik kan uitleggen wat de edelgasconfiguratie is", "Ik kan de categorieën van elementen noteren en aanduiden waar ze in het PSE staan"], "woorden": [["het PSE", "Het periodiek systeem van de elementen: een schema waarin alle chemische elementen geordend zijn volgens hun atoomnummer en eigenschappen.", "In het PSE vind je elk element terug op basis van zijn atoomnummer."], ["de periode", "Een horizontale rij in het periodiek systeem.", "Elementen in dezelfde periode hebben evenveel elektronenschillen."], ["de groep", "Een verticale kolom in het periodiek systeem.", "Elementen in dezelfde groep hebben evenveel valentie-elektronen en lijken chemisch op elkaar."], ["de edelgasconfiguratie", "Een elektronenconfiguratie waarbij de buitenste schil volledig gevuld is, zoals bij een edelgas.", "Veel atomen 'streven' naar een edelgasconfiguratie door elektronen op te nemen of af te staan."], ["de elektronegatieve waarde", "Een maat voor hoe sterk een atoom elektronen naar zich toe trekt bij een chemische binding.", "Fluor heeft de hoogste elektronegatieve waarde van alle elementen."], ["het metaal", "Een element dat elektronen makkelijk afstaat en meestal glanst en goed geleidt.", "IJzer is een metaal dat elektriciteit goed geleidt."], ["het niet-metaal", "Een element dat elektronen makkelijk opneemt en meestal geen glans of goede geleiding vertoont.", "Zuurstof is een niet-metaal."], ["het edelgas", "Een element met een volledig gevulde buitenste elektronenschil, waardoor het nauwelijks reageert met andere stoffen.", "Helium is een edelgas dat nauwelijks chemische reacties aangaat."], ["het ion", "Een geladen deeltje dat ontstaat wanneer een atoom elektronen opneemt of afstaat.", "Wanneer een natriumatoom een elektron afstaat, ontstaat een positief geladen ion."], ["het oxidatiegetal", "Een getal dat aangeeft hoeveel elektronen een atoom in een verbinding heeft opgenomen of afgestaan (of lijkt te hebben opgenomen/afgestaan).", "Het oxidatiegetal van zuurstof is meestal -2 in een verbinding."]], "vragen": [{"t": "open", "dok": 2, "v": "Een element staat in periode 3 en groep VIa. Hoeveel schillen en valentie-elektronen heeft het? Welk element is het? Noteer de configuratie.", "a": "3 schillen, 6 valentie-elektronen: zwavel (S), Z = 16, configuratie 2/8/6."}, {"t": "open", "dok": 2, "v": "Rangschik van lage naar hoge elektronegativiteit: Cl, Na, P, Mg. Leg uit hoe je dat met de plaats in het PSE ziet.", "a": "Na (0,9) < Mg (1,2) < P (2,1) < Cl (3,0). Ze staan allemaal in periode 3; de EN stijgt naar rechts in een periode."}, {"t": "open", "dok": 3, "v": "Kalium is gevaarlijker in water dan natrium. Gebruik de bouw van beide atomen om te verklaren waarom ze op dezelfde manier reageren, en waarom kalium heviger reageert.", "a": "Allebei groep Ia: 1 valentie-elektron, dus zelfde chemische eigenschappen (geven dat elektron af). Kalium heeft één schil meer: het valentie-elektron zit verder van de kern en wordt zwakker aangetrokken (lagere EN, 0,8 tegenover 0,9), dus het wordt nog gemakkelijker afgegeven."}, {"t": "mc", "dok": 3, "v": "Welk element heeft dezelfde chemische eigenschappen als chloor?", "o": ["argon", "zwavel", "broom", "natrium"], "j": 2, "u": "Broom staat in dezelfde groep (VIIa, halogenen): evenveel valentie-elektronen, dus dezelfde manier van reageren. Argon en zwavel staan wel naast chloor, maar in een andere groep."}, {"t": "mc", "dok": 3, "v": "Magnesium (2/8/2) wil een edelgasconfiguratie. Wat doet het het gemakkelijkst?", "o": ["2 elektronen afgeven, zodat het 2/8 heeft zoals neon", "6 elektronen opnemen, zodat het 2/8/8 heeft zoals argon", "niets, het heeft al een edelgasconfiguratie", "2 protonen afgeven"], "j": 0, "u": "Magnesium is een metaal met een lage EN: 2 elektronen afgeven is veel makkelijker dan er 6 opnemen. Protonen veranderen nooit bij een reactie."}]}, {"id": "optica-zien", "groep": "Fysica 3de jaar", "titel": "Zien door licht", "cursus": "cursus-zien-door-licht.html", "strat": "schema", "opdr": "Teken de schaduw van een bal met één lamp, en daarna met twee lampen. Duid kernschaduw en bijschaduw aan. Teken ook zon, maan en aarde bij een zonsverduistering.", "tool": ["optica.html#z3", "Optica · schaduw"], "oef": [[3, "Lichtbundels herkennen"], [4, "Schaduw tekenen"], [6, "Verduistering of niet?"], [7, "Redeneren: verduistering"]], "rest": [[1, "Lichtbron of donker lichaam?"], [2, "Optische middenstoffen"], [5, "Kernschaduw en bijschaduw tekenen"], [8, "Een laserstraal zichtbaar maken"], [9, "Juist of fout?"], [10, "Van pijlen naar zinnen"]], "extra": ["optica.html#z4", "Bekijk zons- en maansverduistering in de tool"], "doelen": ["Ik kan lichtbronnen en donkere lichamen van elkaar onderscheiden", "Ik kan uitleggen wat een optische middenstof is en er 4 voorbeelden van noteren", "Ik kan weergeven hoe licht zich voortplant in een optische middenstof, en aangeven dat de stralengang omkeerbaar is", "Ik kan de drie soorten lichtbundels (divergerend, convergerend en evenwijdig) herkennen en tekenen", "Ik kan noteren van welke eigenschap van licht schaduwvorming het gevolg is", "Ik kan uit een tekening van zon, maan en aarde afleiden of er een (gedeeltelijke) zons- of maansverduistering is", "Ik kan uitleggen waarom er een (gedeeltelijke) zonsverduistering plaatsvindt"], "woorden": [["de lichtbron", "Een voorwerp dat zelf licht uitzendt.", "De zon en een brandende lamp zijn voorbeelden van een lichtbron."], ["de natuurlijke lichtbron", "Een lichtbron die niet door de mens gemaakt is.", "De zon en een bliksemschicht zijn natuurlijke lichtbronnen."], ["de kunstmatige lichtbron", "Een lichtbron die door de mens gemaakt is.", "Een led-lamp is een kunstmatige lichtbron."], ["het donkere lichaam", "Een voorwerp dat zelf geen licht uitzendt, maar dat je enkel ziet doordat het licht van een lichtbron weerkaatst.", "Een boek of een tafel is een donker lichaam: je ziet het enkel als er licht op valt."], ["de optische middenstof", "Een doorzichtige stof waar licht doorheen kan gaan, zoals lucht, water of glas.", "Licht plant zich voort door een optische middenstof zoals lucht."], ["de lichtstraal", "Een denkbeeldige rechte lijn die de weg van het licht voorstelt.", "Op een tekening stel je het pad van het licht voor met een lichtstraal."], ["de lichtbundel", "Een geheel van lichtstralen die samen van een lichtbron vertrekken.", "Een zaklamp zendt een lichtbundel uit."], ["de divergerende lichtbundel", "Een lichtbundel waarvan de lichtstralen uit elkaar lopen.", "Dicht bij een lamp krijg je een divergerende lichtbundel."], ["de evenwijdige lichtbundel", "Een lichtbundel waarvan de lichtstralen parallel naast elkaar lopen.", "Het zonlicht dat de aarde bereikt, beschouwen we als een evenwijdige lichtbundel."], ["de convergerende lichtbundel", "Een lichtbundel waarvan de lichtstralen naar elkaar toe lopen en elkaar in één punt kunnen kruisen.", "Na het passeren van een bolle lens krijg je vaak een convergerende lichtbundel."], ["de schaduw", "De donkere zone die ontstaat wanneer een ondoorzichtig voorwerp het licht van een lichtbron tegenhoudt.", "Op een zonnige dag werp je zelf een schaduw op de grond."], ["de kernschaduw", "Het volledig donkere deel van een schaduw, waar helemaal geen licht van de lichtbron komt.", "In de kernschaduw van een boom is het volledig donker."], ["de bijschaduw", "Het minder donkere deel rond de kernschaduw, waar slechts een deel van het licht van de lichtbron wordt tegengehouden.", "In de bijschaduw is het minder donker dan in de kernschaduw, omdat er nog wat licht binnenkomt."]], "vragen": [{"t": "open", "dok": 2, "v": "Is de maan een lichtbron? Waarom zie je de maan dan toch?", "a": "Nee, de maan is een donker lichaam. Ze weerkaatst het licht van de zon. Dat weerkaatste licht komt in je oog."}, {"t": "open", "dok": 2, "v": "Welke soort lichtbundel komt uit een zaklamp met een spiegel erachter, uit een kaars en uit een vergrootglas in de zon?", "a": "Zaklamp: (bijna) evenwijdig. Kaars: divergerend. Vergrootglas in de zon: convergerend (de stralen komen samen in één punt)."}, {"t": "open", "dok": 3, "v": "Bij een zonsverduistering ziet iemand in Brussel een totale verduistering en iemand in Parijs maar een gedeeltelijke. Hoe kan dat? Gebruik de woorden kernschaduw en bijschaduw.", "a": "De schaduw van de maan op de aarde heeft een kleine kernschaduw en een grotere bijschaduw errond. Wie in de kernschaduw staat, krijgt geen zonlicht: totale verduistering. Wie in de bijschaduw staat, krijgt licht van een deel van de zon: gedeeltelijke verduistering."}, {"t": "mc", "dok": 3, "v": "In een donkere zaal zie je de lichtbundel van een projector als een rechte kegel. Wat verklaart dat het best?", "o": ["Licht is altijd zichtbaar, ook als het niet in je oog komt.", "Stofdeeltjes in de lucht weerkaatsen een beetje licht naar je oog, en licht gaat rechtdoor.", "De projector maakt de lucht zelf lichtgevend.", "Licht buigt rond de stofdeeltjes."], "j": 1, "u": "Je ziet licht alleen als het in je oog komt. Stof weerkaatst licht naar je oog. De rechte rand toont dat licht zich in rechte lijnen voortplant."}, {"t": "mc", "dok": 3, "v": "Je zet een tweede lamp naast de eerste lamp. Wat gebeurt er met de schaduw van een bal op het scherm?", "o": ["De schaduw verdwijnt helemaal.", "Er ontstaat een kernschaduw met een bijschaduw errond.", "De schaduw wordt overal even donker, maar groter.", "Er ontstaan twee aparte kernschaduwen zonder bijschaduw."], "j": 1, "u": "Waar geen licht van beide lampen komt, is het helemaal donker (kernschaduw). Waar licht van maar één lamp komt, is het halfdonker (bijschaduw)."}]}, {"id": "optica-weerkaatsing", "groep": "Fysica 3de jaar", "titel": "Zien door weerkaatsing", "cursus": "cursus-weerkaatsing.html", "strat": "schema", "opdr": "Teken op ruitjespapier een spiegel, een invallende straal en de weerkaatste straal. Duid de normaal, de invalshoek en de weerkaatsingshoek aan. Teken daarna het beeld van een potlood in een vlakke spiegel.", "tool": ["optica.html#s12", "Optica · beeld bij een vlakke spiegel"], "oef": [[2, "Hoeken berekenen"], [3, "Regelmatig of diffuus?"], [6, "Beeld van een potlood (rechtop)"], [9, "Gezichtsveld tekenen"]], "rest": [[1, "Weerkaatste straal tekenen"], [4, "Laser op spiegel of papier"], [5, "Kenmerken van het beeld"], [7, "Beeld van een schuin potlood"], [8, "Nog een potlood"], [10, "Gezichtsveld bij een kleinere spiegel"], [11, "Redeneren: gezichtsveld"], [12, "Twee spiegels"], [13, "Van pijlen naar zinnen"]], "extra": ["optica.html#s13", "Oefen het gezichtsveld in de tool"], "doelen": ["Ik kan aantonen wanneer je lichtbronnen en wanneer je donkere lichamen kan zien (absorptie en/of weerkaatsing)", "Ik kan de begrippen invalshoek, weerkaatsingshoek, invalspunt en normaal omschrijven en aanduiden op een tekening", "Ik kan omschrijven aan welke wetten de weerkaatsing van licht voldoet", "Ik kan de stralengang tekenen bij weerkaatsing op een vlakke spiegel", "Ik kan het verschil tussen regelmatige en diffuse weerkaatsing in woorden noteren en tekenen (\"weerkaatste stralen\")", "Ik kan aan een voorwerp uitleggen hoe je ziet dat het een regelmatig of een onregelmatig oppervlak heeft", "Ik kan de vijf kenmerken van het beeld bij een vlakke spiegel weergeven", "Ik kan het beeld van een voorwerp (een potlood) door een spiegel construeren", "Ik kan het gezichtsveld van een spiegel tekenen met het stappenplan, en het belang ervan met voorbeelden aangeven"], "woorden": [["de weerkaatsing", "Het terugkaatsen van licht wanneer het op een oppervlak botst.", "Dankzij de weerkaatsing van licht op voorwerpen kunnen we ze zien."], ["de absorptie", "Het opnemen van licht door een voorwerp, waardoor het niet wordt weerkaatst of doorgelaten.", "Een zwart voorwerp zorgt voor veel absorptie van licht, daarom lijkt het donker."], ["de invallende straal", "De lichtstraal die op een oppervlak toekomt, vóór de weerkaatsing.", "De invallende straal raakt de spiegel in het invalspunt."], ["het invalspunt", "Het punt waar de invallende straal het oppervlak raakt.", "In het invalspunt teken je de normaal loodrecht op het oppervlak."], ["de normaal", "De denkbeeldige lijn die loodrecht op een oppervlak staat in het invalspunt.", "De invalshoek wordt gemeten tussen de invallende straal en de normaal."], ["de weerkaatste straal", "De lichtstraal die van het oppervlak wegkaatst na de weerkaatsing.", "De weerkaatste straal maakt dezelfde hoek met de normaal als de invallende straal."], ["de invalshoek", "De hoek tussen de invallende straal en de normaal.", "De invalshoek is altijd gelijk aan de weerkaatsingshoek."], ["de weerkaatsingshoek", "De hoek tussen de weerkaatste straal en de normaal.", "Bij een vlakke spiegel is de weerkaatsingshoek even groot als de invalshoek."], ["de regelmatige weerkaatsing", "Weerkaatsing op een glad oppervlak, waarbij evenwijdige lichtstralen ook na de weerkaatsing evenwijdig blijven.", "Op een spiegel of een rustig wateroppervlak krijg je een regelmatige weerkaatsing."], ["de diffuse weerkaatsing", "Weerkaatsing op een ruw oppervlak, waarbij de lichtstralen na de weerkaatsing in allerlei richtingen verspreid worden.", "Op een blad papier krijg je een diffuse weerkaatsing, waardoor je het vanuit elke hoek kan zien."], ["het virtuele beeld", "Een beeld dat je ogen waarnemen, maar dat niet echt op een scherm kan worden opgevangen omdat de lichtstralen er niet echt samenkomen.", "Het beeld dat je in een vlakke spiegel ziet, is een virtueel beeld."], ["het gezichtsveld", "Het volledige gebied dat je kan zien via een spiegel of vanuit een bepaald standpunt.", "Hoe groter de spiegel, hoe groter je gezichtsveld."]], "vragen": [{"t": "open", "dok": 2, "v": "Een lichtstraal valt op een vlakke spiegel. De hoek tussen de straal en de spiegel is 25°. Hoe groot is de invalshoek? En de weerkaatsingshoek?", "a": "De invalshoek meet je tegenover de normaal: 90° − 25° = 65°. De weerkaatsingshoek is even groot: 65°."}, {"t": "open", "dok": 2, "v": "Waarom zie je jezelf wel in een spiegel en niet in een wit blad papier, hoewel beide veel licht weerkaatsen?", "a": "Een spiegel is glad: regelmatige weerkaatsing, de stralen blijven geordend en vormen een beeld. Papier is ruw: diffuse weerkaatsing, het licht gaat in alle richtingen en er ontstaat geen beeld."}, {"t": "open", "dok": 3, "v": "Een leerling staat voor een kleine spiegel en ziet zijn voeten niet. Hij stapt achteruit. Ziet hij nu meer van zichzelf? Leg uit met de spiegelwet.", "a": "Nee. Om een punt van jezelf te zien, moet het licht via de spiegel in je oog komen; volgens de spiegelwet raakt die straal de spiegel halfweg tussen je oog en dat punt, in de hoogte. Die plaats verandert niet als je achteruitstapt. Je hebt een spiegel nodig die minstens half zo hoog is als jij en goed hangt."}, {"t": "mc", "dok": 3, "v": "Je kijkt naar het beeld van een potlood in een vlakke spiegel. Welke uitspraak klopt?", "o": ["Het beeld ligt op het spiegeloppervlak.", "Het beeld ligt even ver achter de spiegel als het potlood ervoor, en is even groot.", "Het beeld is kleiner, omdat het verder weg ligt.", "Het beeld is omgekeerd (ondersteboven)."], "j": 1, "u": "Bij een vlakke spiegel is het beeld virtueel, even groot, rechtop en symmetrisch ten opzichte van de spiegel."}, {"t": "mc", "dok": 3, "v": "Je verschuift je oog dichter naar een vlakke spiegel. Wat gebeurt er met je gezichtsveld?", "o": ["Het wordt kleiner.", "Het wordt groter.", "Het blijft even groot.", "Je ziet niets meer."], "j": 1, "u": "De randstralen van het gezichtsveld lopen van je oog naar de randen van de spiegel. Hoe dichter je oog bij de spiegel, hoe wijder die stralen uit elkaar gaan."}]}, {"id": "optica-breking", "groep": "Fysica 3de jaar", "titel": "Lichtbreking", "cursus": "cursus-lichtbreking.html", "strat": "redenering", "opdr": "Leg uit, met een tekening erbij: wat gebeurt er met een lichtstraal van lucht naar water? En van water naar lucht? Wanneer krijg je totale weerkaatsing? Gebruik de woorden normaal, ijl, dicht en grenshoek.", "tool": ["optica.html#s5", "Optica · breking"], "oef": [[2, "Breking tekenen: lucht naar glas"], [4, "Breking of totale weerkaatsing?"], [5, "Schijnbare verhoging tekenen"], [8, "Totale weerkaatsing: ja of nee?"]], "rest": [[1, "Ijl of dicht?"], [3, "Breking tekenen: water naar lucht"], [6, "Schijnbare verhoging: ondiep water"], [7, "Schijnbare verhoging: diep water"], [9, "Speervissen"], [10, "Glasvezel en fata morgana"], [11, "Juist of fout?"], [12, "Van pijlen naar zinnen"]], "extra": ["optica.html#s6", "Bekijk totale weerkaatsing in de tool"], "doelen": ["Ik kan uitleggen wat lichtbreking is en wanneer ze optreedt", "Ik kan de stralengang tekenen bij de overgang van een optisch ijle naar een optisch dichte middenstof en omgekeerd", "Ik kan met de juiste termen verwoorden wat er met een lichtstraal gebeurt bij breking (bv. \"breekt naar de normaal toe\")", "Ik kan het verband tussen invalshoek en brekingshoek noteren", "Ik kan de schijnbare verhoging van een voorwerp in water verklaren met een tekening", "Ik kan de voorwaarden voor totale weerkaatsing noteren en toepassen, en de stralengang tekenen", "Ik kan een fata morgana verklaren met een tekening", "Ik kan de werking van een glasvezelkabel uitleggen"], "woorden": [["de lichtbreking", "Het verschijnsel waarbij een lichtstraal van richting verandert wanneer ze van de ene naar de andere optische middenstof gaat.", "Door lichtbreking lijkt een rietje in een glas water geknikt."], ["de optisch ijle middenstof", "Een middenstof waarin licht zich sneller voortplant.", "Lucht is optisch ijler dan water."], ["de optisch dichte middenstof", "Een middenstof waarin licht zich trager voortplant.", "Water is optisch dichter dan lucht."], ["het grensvlak", "Het scheidingsvlak tussen twee optische middenstoffen.", "Aan het grensvlak tussen lucht en water breekt het licht."], ["de gebroken straal", "De lichtstraal na de breking, in de tweede optische middenstof.", "De gebroken straal buigt af ten opzichte van de invallende straal."], ["de brekingshoek", "De hoek tussen de gebroken straal en de normaal.", "Bij het overgaan naar een optisch dichtere middenstof wordt de brekingshoek kleiner dan de invalshoek."]], "vragen": [{"t": "open", "dok": 2, "v": "Een lichtstraal gaat van lucht naar water. Breekt hij naar de normaal toe of van de normaal weg? En van water naar lucht?", "a": "Van lucht (ijl) naar water (dicht): naar de normaal toe. Van water naar lucht: van de normaal weg."}, {"t": "open", "dok": 2, "v": "Wanneer kan totale weerkaatsing optreden? Noem de twee voorwaarden.", "a": "1) Het licht gaat van een dichte naar een ijle middenstof (bv. van water naar lucht). 2) De invalshoek is groter dan de grenshoek."}, {"t": "open", "dok": 3, "v": "Een speervisser mikt recht op de vis die hij ziet en mist. Moet hij hoger of lager mikken? Leg uit met de breking aan het wateroppervlak.", "a": "Lager. Het licht van de vis breekt aan het wateroppervlak van de normaal weg. Het oog volgt de straal terug in een rechte lijn en ziet de vis hoger dan hij is (schijnbare verhoging). De echte vis zit dieper."}, {"t": "mc", "dok": 3, "v": "Je vergroot de invalshoek van een straal die van glas naar lucht gaat. Wat gebeurt er als de invalshoek groter wordt dan de grenshoek?", "o": ["De straal breekt naar de normaal toe.", "Al het licht wordt weerkaatst in het glas.", "De straal gaat rechtdoor zonder te breken.", "Het licht wordt geabsorbeerd."], "j": 1, "u": "Boven de grenshoek is er geen gebroken straal meer: totale weerkaatsing. Daarom werken glasvezels."}, {"t": "mc", "dok": 3, "v": "Een rietje in een glas water lijkt geknikt aan het wateroppervlak. Wat is de oorzaak?", "o": ["Het water buigt het rietje echt.", "Licht van het deel onder water breekt bij de overgang naar lucht.", "Het glas werkt als een spiegel.", "Licht gaat sneller in water dan in lucht."], "j": 1, "u": "Het licht van het onderste deel breekt bij de overgang water → lucht. Je ziet dat deel daardoor hoger dan het is. (Licht gaat juist trager in water.)"}]}, {"id": "optica-lenzen", "groep": "Fysica 3de jaar", "titel": "Lenzen", "cursus": "cursus-lenzen.html", "strat": "schema", "opdr": "Teken op ruitjespapier een bolle lens met F en F'. Teken de 3 hoofdstralen vanuit de top van een pijl die voorbij 2F staat. Schrijf bij elke straal de regel. Noteer de kenmerken van het beeld.", "tool": ["optica.html#s10", "Optica · bolle lens"], "oef": [[2, "Constructie: voorwerp voorbij 2F"], [5, "Constructie: voorwerp in 2F"], [10, "Vergrotingsfactor berekenen"], [13, "Redeneren: het voorwerp verschuift"]], "rest": [[1, "De hoofdstralen"], [3, "Constructie: voorwerp tussen F en 2F"], [4, "Constructie: voorwerp tussen F en de lens"], [6, "Constructie: groot voorwerp ver van de lens"], [7, "Constructie: klein voorwerp tussen F en 2F"], [8, "Constructie: voorwerp in F"], [9, "Constructie: vergrootglas"], [11, "Omvormen"], [12, "Beamer in de klas"], [14, "Welke toepassing?"], [15, "Van pijlen naar zinnen"]], "extra": ["optica.html#s16", "Oefen de vergrotingsfactor in de tool"], "doelen": ["Ik kan in een figuur de drie hoofdstralen tekenen die door een bolle lens gebroken worden", "Ik kan de stralengang bij een bolle lens tekenen en het gevormde beeld construeren", "Ik kan de kenmerken van het beeld (stand, grootte, aard) en de toepassing noteren die bij een constructie horen", "Ik kan met het principe van gelijkvormigheid de vergrotingsfactor van een bolle lens berekenen", "Ik kan de formule voor de vergrotingsfactor gebruiken en omvormen om de grootte van beeld of voorwerp, of de beeld- en voorwerpsafstand te berekenen"], "woorden": [["de bolle lens", "Een doorzichtig voorwerp met minstens één bolvormig oppervlak, dat lichtstralen laat convergeren.", "Een vergrootglas is een bolle lens."], ["het brandpunt", "Het punt waarin evenwijdige lichtstralen samenkomen na het passeren van een bolle lens.", "Zonlicht dat door een bolle lens gaat, komt samen in het brandpunt."], ["de optische as", "De denkbeeldige lijn die loodrecht door het midden van een lens gaat.", "Het brandpunt ligt op de optische as van de lens."], ["het optisch middelpunt", "Het middelpunt van de lens, waar een lichtstraal ongebroken doorheen gaat.", "Een lichtstraal door het optisch middelpunt verandert niet van richting."], ["de brandpuntsafstand", "De afstand tussen het optisch middelpunt van de lens en het brandpunt.", "Hoe boller de lens, hoe kleiner de brandpuntsafstand."], ["de hoofdstraal", "Een van de vaste lichtstralen die je gebruikt om een beeld bij een lens te construeren (bijvoorbeeld door het brandpunt of het optisch middelpunt).", "Met drie hoofdstralen kan je het beeld van een voorwerp achter een bolle lens tekenen."], ["het reële beeld", "Een beeld dat ontstaat doordat lichtstralen elkaar echt kruisen, en dat je op een scherm kan opvangen.", "Bij een projector wordt een reëel beeld op het scherm gevormd."], ["de vergrotingsfactor", "Het getal dat aangeeft hoeveel groter of kleiner het beeld is dan het voorwerp zelf.", "Bij een vergrotingsfactor van 2 is het beeld dubbel zo groot als het voorwerp."]], "vragen": [{"t": "open", "dok": 2, "v": "Noem de drie hoofdstralen bij een bolle lens en waar ze na de lens naartoe gaan.", "a": "1) Evenwijdig met de hoofdas → door het brandpunt F' achter de lens. 2) Door het optisch middelpunt O → rechtdoor. 3) Door het brandpunt F vóór de lens → evenwijdig met de hoofdas."}, {"t": "open", "dok": 2, "v": "Een voorwerp van 2,0 cm geeft een beeld van 6,0 cm. Het beeld staat 30 cm van de lens. Bereken N en de voorwerpsafstand.", "a": "N = B / V = 6,0 / 2,0 = 3,0. v = b / N = 30 cm / 3,0 = 10 cm."}, {"t": "open", "dok": 3, "v": "Een fototoestel maakt een klein beeld, een beamer een groot beeld. Beide gebruiken een bolle lens. Waar staat het voorwerp telkens ten opzichte van F en 2F? Verklaar het verschil.", "a": "Fototoestel: voorwerp voorbij 2F → beeld tussen F' en 2F', verkleind en omgekeerd. Beamer: voorwerp tussen F en 2F → beeld voorbij 2F', vergroot en omgekeerd. Hoe dichter het voorwerp bij F komt, hoe groter en verder het beeld."}, {"t": "mc", "dok": 3, "v": "Een voorwerp staat in het brandpunt F van een bolle lens. Wat gebeurt er?", "o": ["Er ontstaat een even groot beeld in 2F'.", "Er ontstaat geen beeld: de stralen lopen evenwijdig na de lens.", "Er ontstaat een virtueel, vergroot beeld.", "Er ontstaat een heel klein beeld in F'."], "j": 1, "u": "Stralen uit F worden evenwijdig na de lens. Ze komen nooit samen: geen beeld. Zo werkt een zaklamp met een lens."}, {"t": "mc", "dok": 3, "v": "Je bedekt de bovenste helft van een bolle lens met papier. Wat gebeurt er met het beeld op het scherm?", "o": ["De bovenste helft van het beeld verdwijnt.", "De onderste helft van het beeld verdwijnt.", "Het volledige beeld blijft, maar wordt minder helder.", "Er is geen beeld meer."], "j": 2, "u": "Uit elk punt van het voorwerp gaan stralen door de hele lens. Ook door de onderste helft komen nog stralen van elk punt samen, dus het hele beeld blijft, met minder licht."}]}, {"id": "krachten", "groep": "Fysica 3de jaar", "titel": "Krachten", "cursus": "cursus-krachten-beweging.html", "strat": "schema", "opdr": "Teken op schaal (1 cm = 10 N) twee krachten van 30 N en 50 N: eens in dezelfde zin, eens in tegengestelde zin en eens loodrecht op elkaar. Teken telkens de resulterende kracht en schrijf de grootte erbij.", "tool": ["krachten-construeren.html#1.1", "Krachten samenstellen en ontbinden"], "oef": [[3, "Tekenen op schaal"], [6, "Tegengestelde zin"], [9, "Loodrechte krachten"], [12, "Traagheid uitleggen"]], "rest": [[1, "Statisch of dynamisch?"], [2, "Kenmerken"], [4, "Grootte aflezen"], [5, "Zelfde zin"], [7, "Tegengestelde zin in het dagelijks leven"], [8, "Touwtrekken"], [10, "Schuine krachten"], [11, "Ontbinden"], [13, "Wat gebeurt er met de snelheid?"], [14, "Juist of fout?"], [15, "Van pijlen naar zinnen"]], "extra": ["krachten-beweging.html", "Oefenen in de tool Traagheid en beweging"], "doelen": ["Ik kan het statisch en dynamisch effect van een kracht herkennen en noteren in concrete situaties", "Ik kan een kracht definiëren als mogelijke oorzaak van vormverandering of van verandering in bewegingstoestand", "Ik kan een kracht voorstellen als vector en de 4 kenmerken benoemen", "Ik kan krachten tekenen als vectoren met een schaal, en met de schaal de grootte van een vector bepalen", "Ik kan met een tekening of berekening de resulterende kracht bepalen van krachten met hetzelfde aangrijpingspunt, met dezelfde en/of verschillende richting en zin", "Ik kan een kracht ontbinden volgens zijn componenten", "Ik kan uitleggen wat traagheid is en de traagheidswet toepassen", "Ik kan uit de resulterende kracht afleiden of de snelheid van een voorwerp toeneemt, afneemt, gelijk blijft of van richting verandert"], "woorden": [["de kracht", "Een inwerking die de beweging of de vorm van een voorwerp kan veranderen.", "Om een kar te doen bewegen, moet je er een kracht op uitoefenen."], ["het dynamisch effect van een kracht", "Het effect van een kracht waarbij de snelheid of de bewegingsrichting van een voorwerp verandert.", "Wanneer je een stilstaande bal een duw geeft, zie je het dynamisch effect van een kracht."], ["de wrijvingskracht", "Een kracht die de beweging van een voorwerp tegenwerkt wanneer het over een oppervlak beweegt of glijdt.", "Door de wrijvingskracht met de grond komt een rollende bal uiteindelijk tot stilstand."], ["de vectoriële grootheid of de vector", "Een grootheid die niet enkel een grootte heeft, maar ook een richting en een zin; je stelt ze voor met een pijl.", "Een kracht is een vectoriële grootheid, want ze heeft een grootte én een richting."], ["het aangrijpingspunt", "Het punt waar een kracht op een voorwerp inwerkt.", "Op de tekening teken je de kracht vertrekkend vanuit het aangrijpingspunt."], ["de richting", "De rechte (lijn) waarlangs een vector (bijvoorbeeld een kracht) werkt.", "De richting van de zwaartekracht is verticaal."], ["de zin", "De kant waarnaar een vector wijst, langs zijn richting (bijvoorbeeld naar boven of naar beneden).", "De zwaartekracht heeft de richting verticaal en de zin naar beneden."], ["de grootte", "Hoe lang de vectorpijl is, wat overeenkomt met de sterkte van bijvoorbeeld een kracht.", "Hoe groter de grootte van de kracht, hoe langer je de pijl tekent."], ["de resulterende kracht of de resultante", "De ene kracht die hetzelfde effect heeft als verschillende krachten samen.", "Je vervangt twee krachten door hun resulterende kracht om de situatie eenvoudiger te maken."], ["de component", "Een van de krachten waarin je een resulterende kracht kan ontbinden.", "Je kan de resulterende kracht opsplitsen in twee componenten."], ["de snelheidsvector", "Een vector die de snelheid van een voorwerp voorstelt, met een grootte, een richting en een zin.", "Bij een auto die rechtdoor rijdt, wijst de snelheidsvector in de rijrichting."], ["de elektrische influentie", "Het verschijnsel waarbij een geladen voorwerp, zonder het aan te raken, ladingen in een nabije geleider laat verschuiven.", "Door elektrische influentie verschuiven de vrije elektronen in de geleider naar de kant het verst van het geladen voorwerp."], ["de polarisatie", "Het verschijnsel waarbij een geladen voorwerp de ladingen binnenin een isolator een heel klein beetje doet verschuiven, zonder dat ze echt kunnen bewegen.", "Door polarisatie wordt een klein stukje papier aangetrokken door een geladen voorwerp, ook al is papier een isolator."], ["de veldkracht", "De kracht die een veld (bijvoorbeeld een elektrisch veld) uitoefent op iets dat zich in dat veld bevindt.", "De veldkracht op de lading hangt af van hoe sterk het elektrisch veld is op die plaats."], ["de coulombkracht", "De aantrekkings- of afstotingskracht tussen twee elektrische ladingen.", "Twee positieve ladingen stoten elkaar af door de coulombkracht."]], "vragen": [{"t": "open", "dok": 2, "v": "Twee krachten van 40 N en 30 N werken op hetzelfde voorwerp. Hoe groot is de resulterende kracht als ze dezelfde zin hebben? Als ze een tegengestelde zin hebben? Als ze loodrecht op elkaar staan?", "a": "Dezelfde zin: 40 + 30 = 70 N. Tegengestelde zin: 40 − 30 = 10 N, in de zin van de 40 N. Loodrecht: √(40² + 30²) = 50 N."}, {"t": "open", "dok": 2, "v": "Een bal ligt stil op de grond. Er werken twee krachten op. Welke? Hoe groot is de resulterende kracht?", "a": "De zwaartekracht (naar beneden) en de normaalkracht van de grond (naar boven), even groot. De resulterende kracht is 0 N."}, {"t": "open", "dok": 3, "v": "Een fietser rijdt met constante snelheid op een vlakke weg. Een klasgenoot zegt: \"Hij beweegt, dus er moet een resulterende kracht vooruit zijn.\" Klopt dat? Leg uit met traagheid.", "a": "Nee. Bij een constante snelheid is de resulterende kracht 0 N: de trapkracht en de wrijvingskrachten zijn even groot en tegengesteld. Door traagheid blijft een voorwerp met dezelfde snelheid bewegen zolang de resulterende kracht nul is. Een resulterende kracht verandert de snelheid."}, {"t": "mc", "dok": 3, "v": "Tijdens het touwtrekken trekt ploeg A met 600 N naar links en ploeg B met 550 N naar rechts. Wat gebeurt er met het touw (dat eerst stilstaat)?", "o": ["Het blijft stilstaan, want beide ploegen trekken.", "Het beweegt naar links met steeds grotere snelheid.", "Het beweegt naar rechts.", "Het beweegt naar links met constante snelheid."], "j": 1, "u": "De resulterende kracht is 50 N naar links. Een resulterende kracht verandert de snelheid: het touw versnelt naar links."}, {"t": "mc", "dok": 3, "v": "Een kracht van 50 N wordt ontbonden in twee loodrechte componenten. Welke combinatie is mogelijk?", "o": ["30 N en 40 N", "25 N en 25 N", "50 N en 50 N", "20 N en 30 N"], "j": 0, "u": "Bij loodrechte componenten geldt √(30² + 40²) = 50 N. Bij 25 N en 25 N krijg je 35 N; de componenten zijn samen niet zomaar 50 N."}]}, {"id": "druk-vast", "groep": "Fysica 4de jaar", "titel": "Druk bij vaste stoffen", "cursus": "cursus-druk-vaste-stoffen.html", "strat": "redenering", "opdr": "Leg uit waarom een naaldhak een parketvloer beschadigt en een olifant niet. Gebruik de formule p = F / A en de woorden kracht, oppervlakte en druk.", "tool": ["druk.html#s1", "Druk · vaste stoffen"], "oef": [[2, "Druk van een kist"], [3, "Naaldhak of olifant?"], [5, "Oppervlakte berekenen"], [6, "Redeneren"]], "rest": [[1, "Omzetten"], [4, "Kracht berekenen"], [7, "Uitleggen"], [8, "De baksteen"], [9, "Tekenen: een kist op de vloer"], [10, "Tekenen: de punaise"], [11, "Van pijlen naar zinnen"]], "extra": ["druk.html#s12", "Oefenen in de tool Druk"], "doelen": ["Ik kan het begrip druk uitleggen", "Ik kan de formule van druk gebruiken en ze omvormen om de kracht en de oppervlakte te berekenen", "Ik kan met de factoren die de druk beïnvloeden uitleggen waarom een voorwerp drukverhogend of drukverlagend is (bv. een mes, rupsbanden)", "Ik kan beredeneren wat er met de druk gebeurt als de kracht en/of de oppervlakte met een bepaalde factor groter of kleiner worden"], "woorden": [["de druk", "De kracht die op een oppervlakte werkt, gedeeld door de grootte van dat oppervlakte.", "Als je met een vinger op een tafel duwt, oefen je druk uit op het tafelblad."], ["de pascal", "De eenheid waarin druk wordt uitgedrukt. Symbool: Pa. 1 pascal is gelijk aan een kracht van 1 newton op een oppervlakte van 1 vierkante meter.", "De luchtdruk bedraagt ongeveer 100.000 pascal."]], "vragen": [{"t": "open", "dok": 2, "v": "Een kist van 600 N staat op een oppervlak van 0,30 m². Bereken de druk. Wat wordt de druk als je de kist op een kant van 0,10 m² zet?", "a": "p = F / A = 600 N / 0,30 m² = 2000 Pa. Op de kleine kant: 600 / 0,10 = 6000 Pa: drie keer zo groot."}, {"t": "open", "dok": 2, "v": "Waarom heeft een sneeuwschoen een groot oppervlak en een punaise een scherpe punt?", "a": "Sneeuwschoen: groot oppervlak → kleine druk → je zakt niet weg. Punaise: klein oppervlak aan de punt → grote druk → ze dringt gemakkelijk in het hout."}, {"t": "open", "dok": 3, "v": "Iemand zegt: \"Een olifant oefent een grotere druk uit op de grond dan een vrouw op naaldhakken, want de olifant is veel zwaarder.\" Ga je akkoord? Gebruik de formule en een redenering met getallen in grootteorde.", "a": "Niet akkoord. Druk hangt af van de kracht én van het oppervlak. Olifant: ± 50 000 N op ± 0,5 m² → ± 100 000 Pa. Vrouw: ± 600 N op een hak van ± 1 cm² = 0,0001 m² → ± 6 000 000 Pa. De naaldhak geeft dus een veel grotere druk."}, {"t": "mc", "dok": 3, "v": "Een baksteen ligt eerst plat en dan rechtop op de grond. Wat verandert er?", "o": ["De kracht op de grond en de druk.", "Alleen de kracht op de grond.", "Alleen de druk op de grond.", "Niets."], "j": 2, "u": "De kracht op de grond is altijd de zwaartekracht van de steen: die blijft gelijk. Het oppervlak verandert, dus de druk verandert."}, {"t": "mc", "dok": 3, "v": "Je wil de druk van een voorwerp op de grond halveren. Welke ingreep werkt?", "o": ["De kracht verdubbelen.", "Het oppervlak halveren.", "Het oppervlak verdubbelen.", "Kracht en oppervlak allebei verdubbelen."], "j": 2, "u": "p = F / A. Verdubbel je A bij dezelfde F, dan wordt p de helft. Bij D blijft p gelijk."}]}, {"id": "druk-gas", "groep": "Fysica 4de jaar", "titel": "Druk bij gassen", "cursus": "cursus-druk-gassen.html", "strat": "redenering", "opdr": "Leg met het deeltjesmodel uit hoe gasdruk ontstaat. Leg daarna uit waarom een zak chips opzwelt in een vliegtuig. Gebruik de woorden overdruk en onderdruk.", "tool": ["druk.html#s3", "Druk · gassen"], "oef": [[1, "Omzetten"], [2, "Kracht op een raam"], [4, "Overdruk of onderdruk?"], [6, "Band in de zomer"]], "rest": [[3, "De zuignap"], [5, "Chips in het vliegtuig"], [7, "Bandenmanometer"], [8, "Snelkookpan"], [9, "Het kaartje onder het glas"], [10, "Luchtdruk in de bergen"], [11, "Tekenen: de zuignap"], [12, "Tekenen: het deksel van de snelkookpan"], [13, "Van pijlen naar zinnen"]], "extra": ["druk.html#s12", "Oefenen in de tool Druk"], "doelen": ["Ik kan omschrijven hoe de druk in een gas ontstaat", "Ik kan verklaren waarom een kaartje onder een omgekeerd glas vol water blijft hangen", "Ik kan verklaren hoe een zuignap werkt", "Ik kan met het deeltjesmodel verklaren waarom de druk van een ingesloten gas toeneemt bij een hogere temperatuur", "Ik kan uitleggen van welke factoren de grootte van de luchtdruk afhangt", "Ik kan de kracht berekenen die een gas uitoefent op een oppervlak", "Ik kan noteren met welke toestellen je luchtdruk en gasdruk meet", "Ik kan uitleggen wat overdruk en onderdruk zijn en van een toepassing zeggen om welke van de twee het gaat", "Ik kan de grootte van de normdruk noteren en gebruiken in toepassingen"], "woorden": [["de gasdruk", "De druk die een gas uitoefent op de wanden van de ruimte waarin het zit, doordat de gasdeeltjes er voortdurend tegenaan botsen.", "Hoe meer je een gas samendrukt, hoe groter de gasdruk wordt."], ["de luchtdruk / de atmosferische druk", "De druk die de lucht van de dampkring uitoefent op alles wat zich erin bevindt.", "Op grote hoogte in de bergen is de luchtdruk lager dan aan de zeespiegel."], ["de normdruk", "De afgesproken standaardwaarde voor de luchtdruk op zeeniveau, gebruikt als referentie: 101.325 Pa (of 1013 hPa).", "Metingen worden vaak vergeleken met de normdruk om de resultaten eerlijk te kunnen vergelijken."], ["de barometer", "Een meettoestel waarmee je de luchtdruk kan meten.", "Met een barometer kan je aflezen of de luchtdruk stijgt of daalt."], ["de manometer", "Een meettoestel waarmee je de druk van een gas of vloeistof in een gesloten systeem meet (bijvoorbeeld in een autoband).", "Met een manometer controleer je of de bandenspanning van je fiets nog goed is."], ["de overdruk", "Het verschil tussen de druk in een gesloten ruimte (bv. een band) en de luchtdruk eromheen, wanneer de druk binnenin groter is.", "De overdruk in een opgepompte fietsband is het verschil tussen de bandendruk en de buitenluchtdruk."], ["de onderdruk", "Een druk die kleiner is dan de luchtdruk eromheen.", "Door de lucht uit een fles te zuigen, ontstaat er onderdruk in de fles."], ["de wet van Archimedes bij gassen", "De wet die zegt dat een voorwerp in een gas een opwaartse kracht ondervindt die gelijk is aan het gewicht van het gas dat het voorwerp verplaatst.", "Dankzij de wet van Archimedes bij gassen weten we waarom een heteluchtballon kan opstijgen."]], "vragen": [{"t": "open", "dok": 2, "v": "Zet om: 1,5 bar naar Pa, 101 300 Pa naar hPa, 250 kPa naar bar.", "a": "1,5 bar = 150 000 Pa. 101 300 Pa = 1013 hPa. 250 kPa = 2,5 bar."}, {"t": "open", "dok": 2, "v": "Wat gebeurt er met de deeltjes van een gas als je het in een gesloten fles verwarmt? Wat betekent dat voor de gasdruk?", "a": "De deeltjes bewegen sneller en botsen vaker en harder tegen de wand. De gasdruk stijgt."}, {"t": "open", "dok": 3, "v": "In een vliegtuig zwelt een gesloten zak chips op. Na de landing is hij weer plat. Leg uit met de woorden luchtdruk, gasdruk en kracht.", "a": "In de zak zit lucht met de druk van de grond. In het vliegtuig is de luchtdruk buiten de zak lager. De lucht in de zak oefent dan een grotere kracht uit op de binnenkant dan de lucht buiten op de buitenkant: de zak zwelt op. Na de landing is de luchtdruk buiten weer even groot."}, {"t": "mc", "dok": 3, "v": "Een manometer op een autoband wijst 2,2 bar aan. Wat betekent dat?", "o": ["De gasdruk in de band is 2,2 bar.", "De gasdruk in de band is 2,2 bar groter dan de luchtdruk: overdruk.", "De gasdruk in de band is 2,2 bar kleiner dan de luchtdruk.", "De kracht van de band op de weg is 2,2 bar."], "j": 1, "u": "Een bandenmanometer meet de overdruk tegenover de luchtdruk. De echte gasdruk is ongeveer 2,2 + 1,0 = 3,2 bar. Druk is geen kracht."}, {"t": "mc", "dok": 3, "v": "Een zuignap blijft aan een glazen wand hangen. Welke uitleg klopt?", "o": ["De zuignap zuigt zich vast aan het glas.", "Onder de zuignap is de druk lager dan de luchtdruk; de lucht erbuiten oefent een kracht uit die de zuignap tegen het glas drukt.", "Het glas trekt het rubber aan.", "De zuignap blijft hangen door wrijving alleen."], "j": 1, "u": "Er is geen \"zuigkracht\". De lucht buiten oefent een grotere kracht uit dan de lucht met lage druk eronder."}]}, {"id": "druk-vloeistof", "groep": "Fysica 4de jaar", "titel": "Druk bij vloeistoffen", "cursus": "cursus-druk-vloeistoffen.html", "strat": "redenering", "opdr": "Maak een tabel: wat gebeurt er met de hydrostatische druk als de diepte, de massadichtheid of de zwaarteveldsterkte groter wordt? Schrijf bij elke rij waarom. Leg ook uit hoe een garagekrik werkt.", "tool": ["druk.html#s6", "Druk · hydrostatische druk"], "oef": [[1, "Zwembad"], [3, "Hoe diep?"], [7, "Redeneren"], [8, "Garagekrik"]], "rest": [[2, "Duiken in zee"], [4, "Welke vloeistof?"], [5, "Op de maan"], [6, "Proefopstelling"], [9, "Reservoir"], [10, "Tekenen: de hydraulische pers"], [11, "Tekenen: water tegen een wand"], [12, "Van pijlen naar zinnen"]], "extra": ["druk.html#s12", "Oefenen in de tool Druk"], "doelen": ["Ik kan uitleggen hoe hydrostatische druk ontstaat", "Ik kan noteren van welke factoren de hydrostatische druk wel en niet afhangt", "Ik kan van een tekening van een proefopstelling afleiden welke factor onderzocht wordt", "Ik kan beredeneren wat het effect is op de hydrostatische druk als één factor verandert", "Ik kan de formule p<sub>h</sub> = ρ · g · h gebruiken en omvormen om ρ, g en h te berekenen", "Ik kan het beginsel van Pascal noteren", "Ik kan uitleggen waarvan de totale druk in een vloeistof afhangt en die druk berekenen", "Ik kan uitleggen wat de functie is van een hydraulisch systeem en er krachten en oppervlakten mee berekenen"], "woorden": [["de hydrostatische druk", "De druk die een vloeistof uitoefent door haar eigen gewicht, en die groter wordt naarmate je dieper in de vloeistof gaat.", "Hoe dieper een duiker zwemt, hoe groter de hydrostatische druk die hij voelt."], ["het beginsel van Pascal", "Het principe dat zegt dat een drukverandering in een ingesloten vloeistof zich ongewijzigd naar alle kanten voortplant.", "Dankzij het beginsel van Pascal kan een kleine kracht op een hydraulische rem een grote kracht veroorzaken."], ["de totale druk in een vloeistof", "De som van de hydrostatische druk (door de vloeistof zelf) en de luchtdruk die op het vloeistofoppervlak drukt.", "Om de totale druk op een bepaalde diepte te berekenen, tel je de hydrostatische druk op bij de luchtdruk."], ["het hydraulisch systeem", "Een systeem dat gebruikmaakt van een ingesloten vloeistof en het beginsel van Pascal om een kracht te vergroten of te verplaatsen.", "De remmen van een auto werken via een hydraulisch systeem."]], "vragen": [{"t": "open", "dok": 2, "v": "Bereken de hydrostatische druk op 4,0 m diepte in een zwembad (ρ = 1000 kg/m³, g = 9,81 N/kg).", "a": "p = ρ · g · h = 1000 · 9,81 · 4,0 = 39 240 Pa ≈ 39 kPa."}, {"t": "open", "dok": 2, "v": "Een garagekrik heeft een kleine zuiger van 2,0 cm² en een grote zuiger van 200 cm². Je duwt met 100 N. Hoe groot is de kracht op de grote zuiger?", "a": "De druk is overal gelijk (Pascal). F₂ = F₁ · A₂ / A₁ = 100 N · 200 / 2,0 = 10 000 N."}, {"t": "open", "dok": 3, "v": "Een duiker zwemt op 10 m diepte in zee en daarna op 10 m diepte in een zoetwatermeer. Waar is de hydrostatische druk het grootst? Is de vorm of de grootte van het water van belang? Leg uit.", "a": "In zee: zout water heeft een grotere massadichtheid (± 1030 kg/m³) en p = ρ · g · h. De vorm en de hoeveelheid water spelen geen rol: alleen de diepte, de massadichtheid en g."}, {"t": "mc", "dok": 3, "v": "Drie vazen met een verschillende vorm zijn tot dezelfde hoogte gevuld met water. Waar is de druk op de bodem het grootst?", "o": ["in de breedste vaas", "in de smalste vaas", "in de vaas met het meeste water", "overal even groot"], "j": 3, "u": "De hydrostatische druk hangt alleen af van ρ, g en h. De hoogte is gelijk, dus de druk is gelijk."}, {"t": "mc", "dok": 3, "v": "Je doet hetzelfde proefje op de maan (g = 1,6 N/kg) als op aarde. Wat gebeurt er met de hydrostatische druk op dezelfde diepte?", "o": ["Hij blijft gelijk.", "Hij wordt ongeveer 6 keer kleiner.", "Hij wordt ongeveer 6 keer groter.", "Er is geen hydrostatische druk op de maan."], "j": 1, "u": "p is recht evenredig met g: 9,81 / 1,6 ≈ 6. De druk wordt ongeveer 6 keer kleiner."}]}, {"id": "archimedes", "groep": "Fysica 4de jaar", "titel": "Archimedeskracht", "cursus": "cursus-archimedes.html", "strat": "redenering", "opdr": "Leg uit wanneer een voorwerp zinkt, zweeft, stijgt of drijft. Gebruik telkens de zwaartekracht en de archimedeskracht, en vergelijk de massadichtheid van het voorwerp met die van de vloeistof. Teken bij elke situatie de twee krachtpijlen.", "tool": ["druk.html#s9", "Druk · zinken, zweven, stijgen of drijven"], "oef": [[1, "Steen in water"], [3, "Volume berekenen"], [5, "Zinken, zweven of stijgen?"], [10, "Zinkt het of drijft het?"]], "rest": [[2, "Zinkt de steen?"], [4, "Welke vloeistof?"], [6, "Binnenvaartschip"], [7, "De vis"], [8, "Heliumballon"], [9, "Heteluchtballon"], [11, "Het topje van de ijsberg"], [12, "De formule verklaren"], [13, "Tekenen: een steen onder water"], [14, "Tekenen: een drijvend blok"], [15, "Van pijlen naar zinnen"]], "extra": ["druk.html#s12", "Oefenen in de tool Druk"], "doelen": ["Ik kan noteren wat de archimedeskracht in vloeistoffen is", "Ik kan de kenmerken van de archimedeskrachtvector noteren", "Ik kan de formule F<sub>A</sub> = ρ<sub>vl</sub> · g · V<sub>ond</sub> gebruiken en omvormen om ρ, g en V te berekenen", "Ik kan de formule voor de archimedeskracht verklaren aan de hand van een tekening", "Ik kan met de archimedeskracht en een krachtenbalans, en met de massadichtheden van voorwerp en vloeistof, uitleggen wanneer een voorwerp zinkt, zweeft, stijgt of drijft", "Ik kan uitleggen hoe een vis kan zinken, zweven of stijgen", "Ik kan uitleggen wat de wet van Archimedes bij gassen inhoudt en ze in formulevorm gebruiken", "Ik kan uitleggen wanneer een voorwerp in een gas zal dalen, zweven of opstijgen"], "woorden": [["de archimedeskracht", "De opwaartse kracht die een vloeistof of gas uitoefent op een voorwerp dat erin ondergedompeld is.", "Dankzij de archimedeskracht voelt een voorwerp in water lichter aan dan in de lucht."], ["de wet van Archimedes bij vloeistoffen", "De wet die zegt dat de archimedeskracht op een voorwerp in een vloeistof gelijk is aan het gewicht van de vloeistof die het voorwerp verplaatst.", "Met de wet van Archimedes bij vloeistoffen kan je berekenen of een voorwerp zal drijven of zinken."], ["de newton", "De eenheid waarin kracht wordt uitgedrukt. Symbool: N.", "De zwaartekracht op een appel van 100 gram is ongeveer 1 newton."]], "vragen": [{"t": "open", "dok": 2, "v": "Een steen met een volume van 0,0020 m³ is volledig ondergedompeld in water (ρ = 1000 kg/m³). Bereken de archimedeskracht.", "a": "F_A = ρ_vl · g · V_ond = 1000 · 9,81 · 0,0020 = 19,6 N."}, {"t": "open", "dok": 2, "v": "Een voorwerp heeft een massadichtheid van 800 kg/m³. Zinkt, zweeft of drijft het in water? En in alcohol (790 kg/m³)?", "a": "In water drijft het: ρ_v < ρ_vl. In alcohol zinkt het (heel traag): ρ_v > ρ_vl."}, {"t": "open", "dok": 3, "v": "Een schip van staal drijft, maar een stalen blokje zinkt. Leg uit hoe dat kan, met de archimedeskracht en de massadichtheid.", "a": "Het schip is hol: het verplaatst een groot volume water. De archimedeskracht hangt af van het ondergedompelde volume en wordt even groot als de zwaartekracht vóór het schip helemaal onder water is. De gemiddelde massadichtheid van het schip (staal + lucht) is kleiner dan die van water. Het blokje verplaatst te weinig water: F_A < F_z."}, {"t": "mc", "dok": 3, "v": "Een ballon met helium stijgt. Hij komt hoger, waar de lucht minder dicht is. Wat gebeurt er met de archimedeskracht?", "o": ["Ze wordt groter.", "Ze wordt kleiner, tot ze even groot is als de zwaartekracht: de ballon zweeft.", "Ze blijft altijd even groot.", "Ze verdwijnt meteen."], "j": 1, "u": "F_A = ρ_lucht · g · V. Hoger is ρ_lucht kleiner, dus F_A daalt. Waar F_A = F_z, zweeft de ballon."}, {"t": "mc", "dok": 3, "v": "Een vis wil stijgen. Wat doet hij?", "o": ["Hij laat gas uit zijn zwemblaas, zodat zijn volume kleiner wordt.", "Hij vult zijn zwemblaas met meer gas, zodat zijn volume groter wordt.", "Hij maakt zichzelf zwaarder.", "Hij zwemt sneller, dan wordt de archimedeskracht groter."], "j": 1, "u": "Meer gas in de zwemblaas → groter volume → grotere archimedeskracht bij dezelfde zwaartekracht → de vis stijgt."}]}, {"id": "energie", "groep": "Fysica 4de jaar", "titel": "Energie in systemen", "cursus": "cursus-energie-systemen.html", "strat": "schema", "opdr": "Teken een energieschema van een tram die vertrekt aan de halte en van een bal die van een trap valt. Schrijf welke energievormen er zijn en in welke vorm ze omgezet worden.", "tool": ["energie-vermogen.html", "Energie, vermogen en rendement"], "oef": [[2, "Energieomzettingen"], [4, "Tram"], [6, "Snelheid berekenen"], [9, "Redeneren"]], "rest": [[1, "Welk systeem?"], [3, "Op het Atomium"], [5, "Veer"], [7, "Hoogte berekenen"], [8, "Pompcentrale"], [10, "Energie in een veld"], [11, "Tekenen: de energieketen van een fietslamp"], [12, "Tekenen: de pompcentrale bij een tekort"], [13, "Van pijlen naar zinnen"]], "extra": ["energie-vermogen.html", "Oefenen in de tool (laatste deel)"], "doelen": ["Ik kan het verschil uitleggen tussen een open, gesloten en geïsoleerd systeem", "Ik kan uitleggen waarom een zwaarteveld, een magnetisch veld en een elektrisch veld potentiële energie bevatten", "Ik kan in voorbeelden uit het dagelijks leven de energieomzetting noteren met gravitationele, elastische, kinetische, chemische, thermische, stralings-, kern- en elektrische energie", "Ik kan uitleggen hoe een waterreservoir op een heuvel energie kan opslaan", "Ik kan de formules voor gravitationele potentiële energie, kinetische energie en elastische potentiële energie gebruiken en omvormen"], "woorden": [["het systeem", "Het deel van de werkelijkheid dat je bestudeert, afgebakend van zijn omgeving.", "Bij het bestuderen van een vallende bal beschouwen we de bal als het systeem."], ["het open systeem", "Een systeem waarbij zowel materie als energie kunnen worden uitgewisseld met de omgeving.", "Een pot water die kookt op het vuur zonder deksel is een open systeem, want er ontsnapt waterdamp."], ["het gesloten systeem", "Een systeem waarbij geen materie, maar wel energie kan worden uitgewisseld met de omgeving.", "Een gesloten fles die opwarmt in de zon is een gesloten systeem: er ontsnapt geen materie, maar er komt wel warmte-energie bij."], ["het geïsoleerd systeem", "Een systeem waarbij geen materie en geen energie
